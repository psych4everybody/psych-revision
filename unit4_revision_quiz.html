<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Outfit',sans-serif;background:#f0f4fb;color:#1a2744;min-height:100vh;}

/* HEADER */
header{background:#1a2744;color:#fff;padding:26px 20px 22px;text-align:center;}
header .eyebrow{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#7fa8d4;margin-bottom:8px;}
header h1{font-family:'Playfair Display',serif;font-size:26px;color:#fff;line-height:1.3;}
header .subtitle{margin-top:7px;font-size:13px;color:#a8c4e0;}

/* CONTROLS */
.controls-bar{background:#fff;border-bottom:2px solid #dde6f4;padding:14px 20px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 10px rgba(26,39,68,.09);}
.controls-bar select{padding:9px 13px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:500;border:2px solid #c8d8ee;border-radius:8px;background:#f4f6fb;color:#1a2744;cursor:pointer;outline:none;min-width:175px;}
.controls-bar select:focus{border-color:#2E75B6;}
.btn-start{padding:9px 26px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:700;background:#1a2744;color:#fff;border:none;border-radius:8px;cursor:pointer;letter-spacing:.4px;transition:background .2s;}
.btn-start:hover{background:#2E75B6;}

/* MAIN */
.main{max-width:860px;margin:28px auto;padding:0 14px 60px;}
#quizArea{background:#fff;border-radius:12px;padding:28px;box-shadow:0 2px 16px rgba(26,39,68,.07);min-height:280px;}
.placeholder-text{text-align:center;padding:56px 20px;color:#7a90b5;font-size:16px;line-height:1.8;}

/* PROGRESS */
.progress-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13px;font-weight:500;color:#4a6080;}
.progress-bar-track{height:5px;background:#e0e8f4;border-radius:3px;margin-bottom:22px;overflow:hidden;}
.progress-bar-fill{height:100%;background:#2E75B6;border-radius:3px;transition:width .4s ease;}

/* QUESTION */
.question-text{font-size:16px;line-height:1.7;margin-bottom:20px;color:#1a2744;}
.stem-label{display:block;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#7fa8d4;margin-bottom:8px;}

.skill-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:3px 10px;border-radius:20px;margin-bottom:13px;}
.skill-1{background:#e8eef8;color:#3a5a8a;}
.skill-2{background:#e3f2fd;color:#1565c0;}
.skill-3{background:#fff3e0;color:#e65100;}
.skill-4{background:#e8f5e9;color:#2e7d32;}

/* OPTIONS */
.options-list{display:flex;flex-direction:column;gap:9px;}
.option-btn{display:flex;align-items:flex-start;gap:11px;padding:13px 15px;border:2px solid #d0ddef;border-radius:8px;background:#f8fafd;cursor:pointer;font-family:'Outfit',sans-serif;font-size:14px;line-height:1.5;color:#1a2744;text-align:left;transition:border-color .15s,background .15s;width:100%;}
.option-btn:hover:not(:disabled){border-color:#2E75B6;background:#eaf3fc;}
.option-btn .letter{font-weight:700;min-width:20px;color:#2E75B6;flex-shrink:0;}
.option-btn.correct{border-color:#28a745;background:#d4edda;color:#155724;}
.option-btn.incorrect{border-color:#dc3545;background:#f8d7da;color:#721c24;}
.option-btn.revealed{border-color:#28a745;background:#d4edda;color:#155724;}
.option-btn:disabled{cursor:default;}

/* FEEDBACK */
.feedback-box{margin-top:16px;padding:13px 16px;border-radius:8px;font-size:14px;font-weight:600;}
.feedback-box.correct{background:#d4edda;color:#155724;}
.feedback-box.incorrect{background:#f8d7da;color:#721c24;}
.feedback-box.neutral{background:#e8f1fa;color:#1a4a7a;}
.btn-next{display:inline-block;margin-top:16px;padding:11px 28px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:700;background:#1a2744;color:#fff;border:none;border-radius:8px;cursor:pointer;transition:background .2s;}
.btn-next:hover{background:#2E75B6;}

/* FLASHCARD */
.flashcard-wrapper{perspective:1200px;max-width:660px;margin:16px auto;height:240px;cursor:pointer;}
.flashcard-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s ease;}
.flashcard-wrapper.flipped .flashcard-inner{transform:rotateY(180deg);}
.flashcard-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 30px;text-align:center;}
.flashcard-front{background:#1a2744;color:#fff;}
.flashcard-front .face-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#7fa8d4;margin-bottom:12px;}
.flashcard-front .face-term{font-size:22px;font-weight:700;line-height:1.35;}
.flashcard-back{background:#eef4fc;border:2px solid #c8d8ee;transform:rotateY(180deg);}
.flashcard-back .face-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#4a6080;margin-bottom:12px;}
.flashcard-back .face-def{font-size:15px;line-height:1.65;color:#1a2744;}
.flashcard-hint{text-align:center;margin-top:10px;font-size:12px;color:#7a90b5;}
.flashcard-nav{display:flex;gap:10px;justify-content:center;margin-top:18px;}
.flashcard-nav button{padding:9px 22px;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;border:2px solid #1a2744;border-radius:8px;background:#fff;color:#1a2744;cursor:pointer;transition:all .15s;}
.flashcard-nav button:hover{background:#1a2744;color:#fff;}
.flashcard-nav button.self-rate-good{border-color:#28a745;color:#1e7b34;}
.flashcard-nav button.self-rate-good:hover{background:#28a745;color:#fff;}
.flashcard-nav button.self-rate-review{border-color:#dc3545;color:#a72638;}
.flashcard-nav button.self-rate-review:hover{background:#dc3545;color:#fff;}

/* MATCH */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:580px){.match-grid{grid-template-columns:1fr;}}
.match-col-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#7a90b5;margin-bottom:8px;}
.match-terms,.match-defs{display:flex;flex-direction:column;gap:8px;}
.match-term{padding:11px 13px;background:#1a2744;color:#fff;border-radius:7px;font-size:13px;font-weight:600;cursor:grab;user-select:none;transition:opacity .2s;}
.match-term.dragging{opacity:.35;}
.match-def{padding:11px 13px;background:#f4f6fb;border:2px dashed #b0c4de;border-radius:7px;font-size:12px;min-height:56px;position:relative;transition:border-color .15s,background .15s;}
.match-def.drag-over{border-color:#2E75B6;background:#e3f2fd;border-style:solid;}
.match-def.correct{border-color:#28a745;background:#d4edda;border-style:solid;}
.match-def.incorrect{border-color:#dc3545;background:#f8d7da;border-style:solid;}
.match-dropped{display:block;font-weight:700;font-size:12px;color:#1a2744;background:#c8d8ee;border-radius:4px;padding:2px 7px;margin-bottom:4px;}
.match-check-btn{display:block;margin:18px auto 0;padding:11px 30px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:700;background:#2E75B6;color:#fff;border:none;border-radius:8px;cursor:pointer;}
.match-check-btn:hover{background:#1a5a9a;}

/* HANGMAN */
.hangman-container{display:flex;flex-direction:column;align-items:center;}
.hangman-svg{width:180px;height:200px;}
.hangman-hint{background:#e8f1fa;border-left:4px solid #2E75B6;padding:11px 15px;border-radius:0 8px 8px 0;font-size:13px;font-style:italic;color:#2a4a70;margin-bottom:18px;max-width:480px;width:100%;}
.word-display{font-size:1.9rem;letter-spacing:7px;font-family:'Courier New',monospace;font-weight:700;margin:14px 0;word-break:break-all;text-align:center;}
.keyboard{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:440px;margin-top:14px;}
.key{width:35px;height:35px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-family:'Outfit',sans-serif;background:#1a2744;color:#fff;border:none;border-radius:5px;cursor:pointer;transition:background .15s;}
.key:hover:not(:disabled){background:#2E75B6;}
.key:disabled{opacity:.45;cursor:default;}
.key.correct-guess{background:#28a745;}
.key.wrong-guess{background:#dc3545;}

/* SCORE SCREEN */
.score-screen{text-align:center;padding:36px 20px;}
.score-screen .big-score{font-family:'Playfair Display',serif;font-size:60px;font-weight:700;color:#1a2744;line-height:1;margin-bottom:8px;}
.score-screen .score-label{font-size:17px;color:#4a6080;margin-bottom:22px;}
.score-screen .score-message{font-size:20px;font-weight:700;margin-bottom:6px;color:#1a2744;}
.btn-restart{display:inline-block;margin-top:20px;padding:11px 32px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:700;background:#1a2744;color:#fff;border:none;border-radius:8px;cursor:pointer;}
.btn-restart:hover{background:#2E75B6;}
.btn-print{background:#2E75B6;margin-left:10px;}
.btn-print:hover{background:#1a5a9a;}

/* Common Mistakes mode */
.mistake-topic-header{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#7a90b5;margin:22px 0 10px;}
.mistake-topic-header:first-child{margin-top:0;}
.mistake-item{background:#fff3e0;border-left:4px solid #e65100;padding:12px 15px;border-radius:0 8px 8px 0;font-size:14px;line-height:1.65;margin-bottom:12px;color:#5a3a00;}

/* Session review block */
.review-block{text-align:left;background:#f8fafd;border:2px solid #d0ddef;border-radius:10px;padding:16px 18px;margin:22px 0;max-height:320px;overflow-y:auto;}
.review-header{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#4a6080;margin-bottom:10px;}
.review-item{font-size:13px;line-height:1.6;padding:8px 0;border-bottom:1px solid #e0e8f4;}
.review-item:last-child{border-bottom:none;}
.review-item strong{color:#1a2744;}
.review-correct{color:#155724;display:block;margin-top:2px;}

@media(max-width:480px){
  header h1{font-size:20px;}
  #quizArea{padding:16px;}
  .word-display{font-size:1.3rem;letter-spacing:3px;}
  .key{width:28px;height:28px;font-size:11px;}
  .controls-bar select{min-width:140px;font-size:13px;}
}
</style>

const termsDB = {
  "4.1": [
    {term:"Attribution Theory",def:"Explains how people interpret and explain the causes of behavior, using either internal (dispositional) or external (situational) factors."},

    {term:"Situational Attribution",def:"Explaining behavior by referring to external, environmental factors such as weather, circumstances, or other people."},

    {term:"Pessimistic Explanatory Style",def:"Explaining bad events as permanent and internal, and good events as external. Linked to helplessness."},

    {term:"External Locus of Control",def:"The belief that outside forces such as luck, fate, or other people control outcomes. May lead to learned helplessness and reduced motivation."},

    {term:"Mere Exposure Effect",def:"Repeated exposure to a stimulus increases liking for it. Used heavily in advertising. Repeated exposure to something strongly disliked can intensify that dislike."},
    {term:"Self-Fulfilling Prophecy",def:"An expectation that changes behavior in ways that cause the expectation to come true, creating a self-reinforcing cycle."},
    {term:"Social Comparison",def:"Evaluating ourselves by comparing ourselves to others. Upward comparison is to someone better off; downward comparison is to someone worse off."},
    {term:"Relative Deprivation",def:"Feeling worse off than your reference group, regardless of your actual circumstances. It is about what you have compared to others around you."}
  ],
  "4.2": [
    {term:"Explicit Attitude",def:"A belief the individual is consciously aware of holding."},
    {term:"Implicit Attitude",def:"An unconscious belief or evaluation. The individual may not even realize they hold it, yet it can shape behavior automatically."},
    {term:"Stereotype",def:"A generalized belief about a group of people. It works as a mental heuristic that allows quick categorization but promotes selective attention. The thinking part of the chain."},
    {term:"Prejudice",def:"A preconceived negative attitude toward a group and its members. It can be explicit or implicit. The feeling part of the chain."},
    {term:"Discrimination",def:"Unfair treatment of an individual based on group membership. Prejudice turned into action. The behavior part of the chain."},
    {term:"Just World Phenomenon",def:"The belief that the world is fair and people get what they deserve. Can lead to blaming victims for their misfortune."},
    {term:"Outgroup Homogeneity Bias",def:"Perceiving members of an outgroup as more similar to each other than they actually are. Promotes stereotypes and erases individual differences."},
    {term:"Ingroup Bias",def:"Favoring people within your own group while being more critical of outsiders."},
    {term:"Ethnocentrism",def:"Believing your own culture is superior and judging other cultures by its standards."},

    {term:"Belief Perseverance",def:"Maintaining a belief despite clear contradictory evidence."},
    {term:"Confirmation Bias",def:"Seeking out information that confirms existing views while dismissing contradictory evidence."},
    {term:"Cognitive Dissonance",def:"Mental discomfort caused by holding two conflicting beliefs, attitudes, or behaviors. Because humans seek consistency, it motivates attitude or behavior change to restore harmony."}
  ],
  "4.3": [

  ],

    {term:"Superego",def:"Represents ideals, morals, and societal expectations. Guides behavior based on right and wrong."},

    {term:"Arousal Theory",def:"People are motivated to maintain an optimal level of alertness and stimulation. Too little leads to boredom; too much leads to stress."},

    {q:"Which of the following best defines display rules as used in the study of emotion?",opts:["The innate, biologically hardwired patterns of facial expression that are universally recognized across all human cultures","Culturally established social norms that govern when, where, and how it is appropriate for individuals to express particular emotions","The cognitive labels individuals apply to their physiological arousal in order to identify and name the emotion they are experiencing","The set of stimuli and situations that reliably trigger emotional responses in individuals across different cultural contexts"],answer:1,skill:"Skill 1"},
    {q:"Yusuf is a first-time skydiver. As his plane approaches the jump altitude, his heart pounds, his palms sweat, and his breathing quickens. A psychologist says: 'What matters is not just that Yusuf is physiologically aroused. He looks around at the open plane door, the altitude, and the gear, and labels his arousal as fear based on that context. If he were on a roller coaster instead, he might label the same physical sensations as excitement.' Which theory does this explanation best represent?",opts:["James-Lange theory","Cannon-Bard theory","Broaden-and-build theory","Schachter-Singer two-factor theory"],answer:3,skill:"Skill 2"},
    {q:"In one culture, it is considered deeply inappropriate for adults to cry or show sadness in any public setting, including funerals, where grief is expected to be expressed only through quiet, composed behavior. A visitor from a different cultural background finds this restraint confusing and even cold. Which of the following concepts best explains the difference in the visitor's reaction and the local cultural norm?",opts:["The universality of emotional expression: people everywhere experience grief but show it differently due to individual personality differences","Elicitors of emotion: funerals trigger different emotional responses in different cultures because the meaning attached to death varies","Display rules: both cultures may experience similar grief, but the cultural norms governing how and when it is appropriate to express that grief differ significantly","The broaden-and-build theory: negative emotions like grief narrow behavior, and different cultures have developed different ways of managing that narrowing"],answer:2,skill:"Skill 2"},
    {q:"A drama teacher instructs her students to hold a wide smile for three full minutes while rehearsing a neutral scene, one with no inherently funny or joyful content. Several students report that by the end of the exercise, they actually feel slightly happier and more energized than when they began, even though nothing in the scene changed. Which of the following best explains the students' experience?",opts:["Cannon-Bard theory: the students' emotional experience and facial expression occurred simultaneously, with neither causing the other","Schachter-Singer two-factor theory: the students labeled their muscle activity as happiness after searching for a contextual explanation","The facial feedback hypothesis: the physical act of smiling sent signals to the brain that were interpreted as a positive emotional state, influencing how the students felt","The broaden-and-build theory: the sustained smile broadened the students' cognitive flexibility, making them more receptive to positive feelings"],answer:2,skill:"Skill 2"},
    {q:"A researcher wants to test whether the facial feedback hypothesis holds when participants are unaware that their facial expressions are being manipulated. Participants hold a pen between their teeth (which activates smiling muscles) or between their lips (which prevents smiling) while rating the funniness of cartoons. She does not tell participants that the pen position is related to facial expression. Which of the following best explains the methodological purpose of keeping participants unaware?",opts:["It eliminates the need for informed consent, because participants are not being directly deceived about the nature of the study","It controls for demand characteristics: if participants knew the pen was activating smile muscles, they might consciously adjust their ratings to match what they believe the researcher expects, confounding the results","It ensures that the facial feedback effect can only be measured through physiological instruments rather than self-report ratings","It prevents social desirability bias by ensuring participants do not feel pressure to rate the cartoons as funnier than they actually find them"],answer:1,skill:"Skill 4"}
  ]
};

// ==============================================================
// HELPERS
// ==============================================================
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function getTerms(topic){return topic==="all"?Object.values(termsDB).flat():(termsDB[topic]||[]);}
function getPractice(topic){return topic==="all"?Object.values(practiceDB).flat():(practiceDB[topic]||[]);}
function skillClass(s){return s.includes("4")?"skill-4":s.includes("3")?"skill-3":s.includes("2")?"skill-2":"skill-1";}
function progressBar(idx,total,score){
  const pct=total>0?(idx/total)*100:0;
  return `<div class="progress-row"><span>Question ${idx+1} of ${total}</span><span>Score: ${score} / ${idx}</span></div><div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div>`;
}

// Logs one attempt for the session review panel and the printable answer key.
function logAttempt(type,stem,studentAnswer,correctAnswer,correct){
  S.log.push({type:type,stem:stem,studentAnswer:studentAnswer,correctAnswer:correctAnswer,correct:correct});
}

// Builds the on-screen "Terms to review" panel plus the Print Summary button, shown on every completion screen.
function buildReviewBlock(){
  const missed=S.log.filter(function(r){return !r.correct;});
  let html="";
  if(missed.length){
    html+='<div class="review-block"><div class="review-header">Terms to Review ('+missed.length+')</div>';
    html+=missed.map(function(r){return '<div class="review-item"><strong>'+r.stem+'</strong><span class="review-correct">Correct answer: '+r.correctAnswer+'</span></div>';}).join("");
    html+='</div>';
  }
  html+='<button class="btn-restart btn-print" onclick="printSummary()">Print Summary</button>';
  return html;
}

// Builds and opens the printable, teacher-checkable answer key in its own tab, so printing
// does not depend on window.print() working inside whatever frame this page is embedded in.
function printSummary(){
  const total=S.log.length;
  const correctCount=S.log.filter(function(r){return r.correct;}).length;
  const scoreText=total?(correctCount+" / "+total+" ("+Math.round((correctCount/total)*100)+"%)"):"No graded items this session";
  let rows=S.log.map(function(r,i){
    return '<tr><td style="border:1px solid #999;padding:6px;">'+(i+1)+'</td>'+
      '<td style="border:1px solid #999;padding:6px;">'+String(r.stem).replace(/\n/g," ")+'</td>'+
      '<td style="border:1px solid #999;padding:6px;">'+r.studentAnswer+'</td>'+
      '<td style="border:1px solid #999;padding:6px;">'+r.correctAnswer+'</td>'+
      '<td style="border:1px solid #999;padding:6px;">'+(r.correct?"Correct":"Review")+'</td></tr>';
  }).join("");
  if(!rows){rows='<tr><td colspan="5" style="border:1px solid #999;padding:6px;">No graded items in this session.</td></tr>';}

  let mistakesHTML="";
  if(S.topic!=="all"&&mistakesDB[S.topic]){
    mistakesHTML='<h2 style="font-size:15px;margin-top:18px;border-bottom:1px solid #999;">Common Mistakes for This Topic</h2><ul style="font-size:12px;line-height:1.6;">'+
      mistakesDB[S.topic].map(function(m){return '<li style="margin-bottom:6px;">'+m+'</li>';}).join("")+'</ul>';
  }

  const reportBody=
    '<h1 style="font-size:20px;border-bottom:2px solid #000;padding-bottom:8px;">AP Psychology Unit 4: Social Psychology and Personality</h1>'+
    '<p style="font-size:13px;">Revision Session Summary</p>'+
    '<table style="width:100%;font-size:13px;margin:14px 0;"><tr><td>Name: ___________________________</td><td>Date: ___________________</td></tr></table>'+
    '<p style="font-size:13px;">Topic: '+(S.topicLabel||"All Topics")+' &nbsp;|&nbsp; Activity: '+(S.modeLabel||"")+' &nbsp;|&nbsp; Score: '+scoreText+'</p>'+
    '<h2 style="font-size:15px;margin-top:18px;border-bottom:1px solid #999;">Answer Key and Review</h2>'+
    '<table style="width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;">'+
    '<tr style="background:#eee;"><th style="border:1px solid #999;padding:6px;text-align:left;">#</th><th style="border:1px solid #999;padding:6px;text-align:left;">Question / Term</th><th style="border:1px solid #999;padding:6px;text-align:left;">Your Answer</th><th style="border:1px solid #999;padding:6px;text-align:left;">Correct Answer</th><th style="border:1px solid #999;padding:6px;text-align:left;">Result</th></tr>'+
    rows+'</table>'+mistakesHTML+
    '<p class="no-print" style="margin-top:22px;font-size:12px;color:#666;">If the print dialog did not open automatically, use your browser\'s print command (Ctrl+P or Cmd+P) on this tab.</p>';

  const fullDoc='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Unit 4 Revision Summary</title>'+
    '<style>body{font-family:Arial,Helvetica,sans-serif;color:#000;padding:20px;max-width:800px;margin:0 auto;}'+
    '@media print{.no-print{display:none;}}</style></head><body>'+reportBody+'</body></html>';

  const win=window.open("","_blank");
  if(!win){
    alert("Your browser blocked the new tab needed to print. Please allow pop-ups for this page and click Print Summary again.");
    return;
  }
  win.document.open();
  win.document.write(fullDoc);
  win.document.close();
  win.focus();
  setTimeout(function(){
    try{win.print();}catch(e){/* user can still print manually from the new tab */}
  },250);
}

// ==============================================================
// STATE
// ==============================================================
const S={mode:null,topic:"all",topicLabel:"All Topics",modeLabel:"",terms:[],practice:[],idx:0,score:0,
  hWord:"",hGuessed:[],hMistakes:0,hAttempted:new Set(),hActive:false,hCurrentTerm:null,
  _matchSet:[],log:[]};

// ==============================================================
// START
// ==============================================================
document.getElementById("startBtn").addEventListener("click",function(){
  S.topic=document.getElementById("topicSelect").value;
  S.mode=document.getElementById("modeSelect").value;
  const topicSel=document.getElementById("topicSelect");
  const modeSel=document.getElementById("modeSelect");
  S.topicLabel=topicSel.options[topicSel.selectedIndex].text;
  S.modeLabel=modeSel.options[modeSel.selectedIndex].text;
  S.idx=0; S.score=0; S.hActive=false; S.hAttempted=new Set(); S.log=[];

  if(S.mode==="mistakes"){
    renderMistakes();
    return;
  }

  if(S.mode==="practice"){
    S.practice=shuffle(getPractice(S.topic));
    if(!S.practice.length){setQA('<div class="placeholder-text">No practice questions for this topic yet.</div>');return;}
    renderPractice();
  } else {
    S.terms=shuffle(getTerms(S.topic));
    if(!S.terms.length){setQA('<div class="placeholder-text">No terms found for this selection.</div>');return;}
    if(S.mode==="flash")renderFlash();
    else if(S.mode==="mcq")renderMCQ();
    else if(S.mode==="tf")renderTF();
    else if(S.mode==="match")renderMatch();
    else if(S.mode==="hangman"){S.hActive=true;renderHangman();}
  }
});

function setQA(html){document.getElementById("quizArea").innerHTML=html;}

// ==============================================================
// COMMON MISTAKES
// ==============================================================
function renderMistakes(){
  let html='<p style="text-align:center;color:#4a6080;font-size:13px;margin-bottom:18px;">Common mix-ups students make on this material. Review these before you test yourself.</p>';
  const topicsToShow=(S.topic==="all")?Object.keys(mistakesDB):[S.topic];
  topicsToShow.forEach(function(tKey){
    if(!mistakesDB[tKey])return;
    if(S.topic==="all"){html+='<div class="mistake-topic-header">Topic '+tKey+'</div>';}
    mistakesDB[tKey].forEach(function(m){html+='<div class="mistake-item">'+m+'</div>';});
  });
  setQA(html);
}

// ==============================================================
// FLASHCARDS
// ==============================================================
function renderFlash(){
  if(S.idx>=S.terms.length){
    setQA(`<div class="score-screen"><div class="big-score">${S.terms.length}</div><div class="score-label">cards reviewed</div><div class="score-message">All done!</div>${buildReviewBlock()}<br><button class="btn-restart" onclick="S.idx=0;S.log=[];renderFlash()">Start Over</button></div>`);
    return;
  }
  const t=S.terms[S.idx];
  const pct=(S.idx/S.terms.length)*100;
  setQA(`
    <div class="progress-row"><span>Card ${S.idx+1} of ${S.terms.length}</span><span style="font-size:12px;color:#7a90b5;">Click to flip</span></div>
    <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    <div class="flashcard-wrapper" id="fc" onclick="this.classList.toggle('flipped')">
      <div class="flashcard-inner">
        <div class="flashcard-face flashcard-front"><div class="face-label">Term</div><div class="face-term">${t.term}</div></div>
        <div class="flashcard-face flashcard-back"><div class="face-label">Definition</div><div class="face-def">${t.def}</div></div>
      </div>
    </div>
    <div class="flashcard-hint">Tap the card to reveal the definition, then rate yourself honestly</div>
    <div class="flashcard-nav">
      <button class="self-rate-review" onclick="rateFlash(false)">Review again</button>
      <button class="self-rate-good" onclick="rateFlash(true)">Got it</button>
    </div>
    <div class="flashcard-nav" style="margin-top:8px;">
      <button onclick="S.idx=Math.max(0,S.idx-1);renderFlash()">Previous</button>
    </div>
  `);
}
function rateFlash(gotIt){
  const t=S.terms[S.idx];
  logAttempt("Flashcards",t.term,gotIt?"Marked: Got it":"Marked: Review again",t.def,gotIt);
  S.idx++;
  renderFlash();
}

// ==============================================================
// VOCABULARY MCQ
// ==============================================================
function renderMCQ(){
  if(S.idx>=S.terms.length){showVocabScore();return;}
  const cur=S.terms[S.idx];
  const opts=shuffle([cur,...shuffle(S.terms.filter(t=>t!==cur)).slice(0,3)]);
  const letters=["A","B","C","D"];
  S._mcqOpts=opts; S._mcqCorrect=cur; S._mcqDef=cur.def;

  let optsHTML=opts.map((o,i)=>`<button class="option-btn" data-idx="${i}"><span class="letter">${letters[i]}</span><span>${o.term}</span></button>`).join("");
  setQA(`
    ${progressBar(S.idx,S.terms.length,S.score)}
    <div class="question-text"><span class="stem-label">Definition</span>${cur.def}</div>
    <p style="font-size:12px;color:#4a6080;margin-bottom:10px;font-weight:600;">Which term matches this definition?</p>
    <div class="options-list" id="mcqOpts">${optsHTML}</div>
    <div id="mcqFb"></div>
  `);
  document.querySelectorAll("#mcqOpts .option-btn").forEach(function(btn){
    btn.addEventListener("click",function(){handleMCQ(parseInt(this.dataset.idx));});
  });
}

function handleMCQ(si){
  if(document.querySelector(".option-btn.correct,.option-btn.incorrect"))return;
  const opts=S._mcqOpts; const correct=S._mcqCorrect;
  const ci=opts.indexOf(correct);
  document.querySelectorAll(".option-btn").forEach(function(b){b.disabled=true;if(parseInt(b.dataset.idx)===ci)b.classList.add("revealed");});
  const isRight=(si===ci);
  const btn=document.querySelector(`[data-idx="${si}"]`);
  if(btn){btn.classList.remove("revealed");btn.classList.add(isRight?"correct":"incorrect");}
  if(isRight)S.score++;
  logAttempt("Vocabulary MCQ",S._mcqDef,opts[si].term,correct.term,isRight);
  S.idx++;
  document.getElementById("mcqFb").innerHTML=`<div class="feedback-box ${isRight?"correct":"incorrect"}">${isRight?"Correct!":"Not quite. The correct answer is highlighted above."}</div><button class="btn-next" onclick="renderMCQ()">Next</button>`;
}

// ==============================================================
// TRUE / FALSE
// ==============================================================
function renderTF(){
  if(S.idx>=S.terms.length){showVocabScore();return;}
  const cur=S.terms[S.idx];
  const isTrue=Math.random()>0.5;
  let disp=cur.def;
  if(!isTrue&&S.terms.length>1){
    let w=S.terms[Math.floor(Math.random()*S.terms.length)];
    while(w.term===cur.term)w=S.terms[Math.floor(Math.random()*S.terms.length)];
    disp=w.def;
  }
  S._tfIsTrue=isTrue; S._tfTerm=cur.term; S._tfDisp=disp;
  setQA(`
    ${progressBar(S.idx,S.terms.length,S.score)}
    <div class="question-text">Is this the correct definition of <strong>${cur.term}</strong>?</div>
    <div style="background:#f4f6fb;padding:13px 15px;border-radius:8px;font-style:italic;border-left:4px solid #b0c4de;margin-bottom:18px;font-size:14px;line-height:1.65;">"${disp}"</div>
    <div class="options-list" style="flex-direction:row;gap:14px;">
      <button class="option-btn" id="tfT" style="justify-content:center;"><span class="letter" style="color:#28a745;">T</span>True</button>
      <button class="option-btn" id="tfF" style="justify-content:center;"><span class="letter" style="color:#dc3545;">F</span>False</button>
    </div>
    <div id="tfFb"></div>
  `);
  document.getElementById("tfT").addEventListener("click",function(){handleTF(true);});
  document.getElementById("tfF").addEventListener("click",function(){handleTF(false);});
}

function handleTF(userTrue){
  if(document.querySelector(".option-btn.correct,.option-btn.incorrect"))return;
  document.querySelectorAll(".option-btn").forEach(function(b){b.disabled=true;});
  const right=(S._tfIsTrue===userTrue);
  const btn=userTrue?document.getElementById("tfT"):document.getElementById("tfF");
  if(btn)btn.classList.add(right?"correct":"incorrect");
  if(right)S.score++;
  logAttempt("True/False",'"'+S._tfDisp+'" - definition of '+S._tfTerm+'?',userTrue?"True":"False",S._tfIsTrue?"True":"False",right);
  S.idx++;
  document.getElementById("tfFb").innerHTML=`<div class="feedback-box ${right?"correct":"incorrect"}">${right?"Correct!":"Not quite. The correct answer was: "+(S._tfIsTrue?"True":"False")}</div><button class="btn-next" onclick="renderTF()">Next</button>`;
}

// ==============================================================
// MATCH'EM UP
// ==============================================================
function renderMatch(){
  const chunk=S.terms.slice(0,Math.min(6,S.terms.length));
  S._matchSet=chunk;
  const shuffledDefs=shuffle(chunk.map(function(t,i){return {termIdx:i,def:t.def};}));

  const termsHTML=chunk.map(function(t,i){
    return `<div class="match-term" draggable="true" data-tidx="${i}">${t.term}</div>`;
  }).join("");
  const defsHTML=shuffledDefs.map(function(d){
    return `<div class="match-def" data-correct="${d.termIdx}" data-dropped="-1"><div class="match-def-text" style="font-size:12px;line-height:1.5;">${d.def}</div></div>`;
  }).join("");

  setQA(`
    <p style="text-align:center;color:#4a6080;font-size:13px;margin-bottom:18px;">Drag each <strong>term</strong> from the left onto its matching <strong>definition</strong> on the right.</p>
    <div class="match-grid">
      <div><div class="match-col-label">Terms</div><div class="match-terms" id="matchTerms">${termsHTML}</div></div>
      <div><div class="match-col-label">Definitions</div><div class="match-defs" id="matchDefs">${defsHTML}</div></div>
    </div>
    <button class="match-check-btn" onclick="checkMatch()">Check Answers</button>
    <div id="matchFb" style="margin-top:14px;"></div>
  `);

  document.querySelectorAll(".match-term").forEach(function(el){
    el.addEventListener("dragstart",function(e){e.dataTransfer.setData("text",this.dataset.tidx);this.classList.add("dragging");});
    el.addEventListener("dragend",function(){this.classList.remove("dragging");});
  });
  document.querySelectorAll(".match-def").forEach(function(el){
    el.addEventListener("dragover",function(e){e.preventDefault();this.classList.add("drag-over");});
    el.addEventListener("dragleave",function(){this.classList.remove("drag-over");});
    el.addEventListener("drop",function(e){
      e.preventDefault();this.classList.remove("drag-over");
      const tidx=e.dataTransfer.getData("text");
      this.dataset.dropped=tidx;
      let lbl=this.querySelector(".match-dropped");
      if(!lbl){lbl=document.createElement("div");lbl.className="match-dropped";this.insertBefore(lbl,this.firstChild);}
      lbl.textContent=S._matchSet[parseInt(tidx)].term;
    });
  });
}

function checkMatch(){
  let correct=0;
  const defEls=document.querySelectorAll(".match-def");
  defEls.forEach(function(el){
    const dropped=parseInt(el.dataset.dropped);
    const right=parseInt(el.dataset.correct);
    const isRight=(dropped===right);
    if(isRight){el.classList.add("correct");correct++;}
    else{el.classList.add("incorrect");}
    const defText=el.querySelector(".match-def-text").textContent;
    const droppedTermText=(dropped>=0&&S._matchSet[dropped])?S._matchSet[dropped].term:"No answer given";
    const correctTermText=S._matchSet[right].term;
    logAttempt("Match'em Up",defText,droppedTermText,correctTermText,isRight);
  });
  const total=defEls.length;
  const pct=Math.round((correct/total)*100);
  document.getElementById("matchFb").innerHTML=`<div class="feedback-box ${correct===total?"correct":correct>total/2?"neutral":"incorrect"}">${correct} / ${total} correct (${pct}%)</div>${buildReviewBlock()}<button class="btn-next" onclick="renderMatch()">Try Another Set</button>`;
}

// ==============================================================
// HANGMAN
// ==============================================================
function renderHangman(){
  if(S.idx>=S.terms.length){showVocabScore();return;}
  const t=S.terms[S.idx];
  S.hCurrentTerm=t;
  S.hWord=t.term.toUpperCase();
  S.hGuessed=S.hWord.split("").map(function(ch){return /[A-Z]/.test(ch)?null:ch;});
  S.hMistakes=0; S.hAttempted=new Set();
  drawHangmanBoard(t);
}

function drawHangmanBoard(t){
  const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  const keyHTML=letters.map(function(l){return `<button class="key" data-ltr="${l}">${l}</button>`;}).join("");
  const pct=(S.idx/S.terms.length)*100;
  setQA(`
    <div class="progress-row"><span>Word ${S.idx+1} of ${S.terms.length}</span><span>Score: ${S.score}</span></div>
    <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    <div class="hangman-container">
      <div class="hangman-drawing">
        <svg class="hangman-svg" viewBox="0 0 100 120" stroke="#1a2744" stroke-width="3" fill="none" stroke-linecap="round">
          <line x1="10" y1="115" x2="90" y2="115"/><line x1="30" y1="115" x2="30" y2="5"/>
          <line x1="30" y1="5" x2="70" y2="5"/><line x1="70" y1="5" x2="70" y2="20"/>
          <circle id="hp1" cx="70" cy="32" r="12" style="display:none"/>
          <line id="hp2" x1="70" y1="44" x2="70" y2="80" style="display:none"/>
          <line id="hp3" x1="70" y1="52" x2="54" y2="68" style="display:none"/>
          <line id="hp4" x1="70" y1="52" x2="86" y2="68" style="display:none"/>
          <line id="hp5" x1="70" y1="80" x2="54" y2="100" style="display:none"/>
          <line id="hp6" x1="70" y1="80" x2="86" y2="100" style="display:none"/>
        </svg>
      </div>
      <div class="hangman-hint"><strong>Hint:</strong> ${t.def}</div>
      <div class="word-display" id="hDisp"></div>
      <div class="keyboard" id="hKeys">${keyHTML}</div>
      <div id="hFb" style="margin-top:16px;min-height:44px;text-align:center;"></div>
    </div>
  `);
  updateHDisp();
  document.querySelectorAll(".key").forEach(function(btn){
    btn.addEventListener("click",function(){doHGuess(this.dataset.ltr);});
  });
}

function updateHDisp(){
  const el=document.getElementById("hDisp");
  if(el)el.textContent=S.hGuessed.map(function(ch){return ch||"_";}).join(" ");
}

function updateHParts(){
  for(let i=1;i<=6;i++){const el=document.getElementById("hp"+i);if(el)el.style.display=i<=S.hMistakes?"block":"none";}
}

function doHGuess(letter){
  if(!S.hActive||S.hAttempted.has(letter)||S.hMistakes>=6)return;
  S.hAttempted.add(letter);
  const btn=document.querySelector(`.key[data-ltr="${letter}"]`);
  if(S.hWord.includes(letter)){
    S.hWord.split("").forEach(function(ch,i){if(ch===letter)S.hGuessed[i]=letter;});
    if(btn){btn.classList.add("correct-guess");btn.disabled=true;}
  } else {
    S.hMistakes++;
    if(btn){btn.classList.add("wrong-guess");btn.disabled=true;}
    updateHParts();
  }
  updateHDisp();
  checkHEnd();
}

function checkHEnd(){
  const won=!S.hGuessed.includes(null);
  const lost=S.hMistakes>=6;
  if(!won&&!lost)return;
  document.querySelectorAll(".key").forEach(function(k){k.disabled=true;});
  const fb=document.getElementById("hFb");
  const t=S.hCurrentTerm;
  logAttempt("Hangman",t?t.def:"",won?"Solved":"Not solved ("+S.hMistakes+" wrong guesses)",S.hWord,won);
  if(won){
    S.score++;
    if(fb)fb.innerHTML=`<div class="feedback-box correct">Correct! The term is "${S.hWord}".</div><button class="btn-next" onclick="S.idx++;renderHangman()">Next Word</button>`;
  } else {
    const d=document.getElementById("hDisp");
    if(d)d.textContent=S.hWord.split("").join(" ");
    if(fb)fb.innerHTML=`<div class="feedback-box incorrect">The term was: <strong>${S.hWord}</strong></div><button class="btn-next" onclick="S.idx++;renderHangman()">Next Word</button>`;
  }
}

document.addEventListener("keydown",function(e){
  if(!S.hActive)return;
  const k=e.key.toUpperCase();
  if(/^[A-Z]$/.test(k)){const btn=document.querySelector(`.key[data-ltr="${k}"]`);if(btn&&!btn.disabled)doHGuess(k);}
});

// ==============================================================
// PRACTICE SET MCQs
// ==============================================================
function renderPractice(){
  if(S.idx>=S.practice.length){showPracticeScore();return;}
  const q=S.practice[S.idx];
  const letters=["A","B","C","D"];
  const optsHTML=q.opts.map(function(opt,i){return `<button class="option-btn" data-idx="${i}"><span class="letter">${letters[i]}</span><span>${opt}</span></button>`;}).join("");
  const pct=(S.idx/S.practice.length)*100;
  setQA(`
    <div class="progress-row"><span>Question ${S.idx+1} of ${S.practice.length}</span><span>Score: ${S.score} / ${S.idx}</span></div>
    <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    <span class="skill-badge ${skillClass(q.skill)}">${q.skill}</span>
    <div class="question-text">${q.q.replace(/\n/g,"<br>")}</div>
    <div class="options-list" id="pOpts">${optsHTML}</div>
    <div id="pFb"></div>
  `);
  S._pq=q;
  document.querySelectorAll("#pOpts .option-btn").forEach(function(btn){
    btn.addEventListener("click",function(){handlePractice(parseInt(this.dataset.idx));});
  });
}

function handlePractice(si){
  if(document.querySelector(".option-btn.correct,.option-btn.incorrect"))return;
  const q=S._pq;
  document.querySelectorAll(".option-btn").forEach(function(b){b.disabled=true;if(parseInt(b.dataset.idx)===q.answer)b.classList.add("revealed");});
  const isRight=(si===q.answer);
  const btn=document.querySelector(`#pOpts [data-idx="${si}"]`);
  if(btn){btn.classList.remove("revealed");btn.classList.add(isRight?"correct":"incorrect");}
  if(isRight)S.score++;
  logAttempt("Practice Set MCQ",q.q,q.opts[si],q.opts[q.answer],isRight);
  S.idx++;
  document.getElementById("pFb").innerHTML=`<div class="feedback-box ${isRight?"correct":"incorrect"}">${isRight?"Correct!":"Not quite. The correct answer is highlighted above."}</div><button class="btn-next" onclick="renderPractice()">Next</button>`;
}

function showPracticeScore(){
  const pct=Math.round((S.score/S.practice.length)*100);
  const msg=pct>=80?"Strong work.":pct>=60?"Getting there. Keep reviewing.":"More revision needed - you've got this.";
  setQA(`<div class="score-screen"><div class="big-score">${pct}%</div><div class="score-label">${S.score} correct out of ${S.practice.length}</div><div class="score-message">${msg}</div>${buildReviewBlock()}<br><button class="btn-restart" onclick="S.idx=0;S.score=0;S.log=[];S.practice=shuffle(getPractice(S.topic));renderPractice()">Try Again</button></div>`);
}

// ==============================================================
// VOCAB SCORE
// ==============================================================
function showVocabScore(){
  const pct=Math.round((S.score/S.terms.length)*100);
  const msg=pct>=80?"Strong work.":pct>=60?"Getting there. Keep reviewing.":"More revision needed - you've got this.";
  const restart=S.mode==="mcq"?"S.idx=0;S.score=0;S.log=[];S.terms=shuffle(getTerms(S.topic));renderMCQ()":S.mode==="tf"?"S.idx=0;S.score=0;S.log=[];S.terms=shuffle(getTerms(S.topic));renderTF()":"S.idx=0;S.score=0;S.log=[];S.hActive=true;S.terms=shuffle(getTerms(S.topic));renderHangman()";
  setQA(`<div class="score-screen"><div class="big-score">${pct}%</div><div class="score-label">${S.score} correct out of ${S.terms.length}</div><div class="score-message">${msg}</div>${buildReviewBlock()}<br><button class="btn-restart" onclick="${restart}">Try Again</button></div>`);
}
</script>
