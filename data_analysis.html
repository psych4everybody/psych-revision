nus 17.7, which is 11.5 seconds. The value 46.9 comes from adding the means instead of subtracting them, and 7.5 is only the difference between the two standard deviations (20.6 minus 13.1), which is a different statistic.","study":"aaq-hidden-objects-infants"},{"id":"DA-G1-02","section":"3.4","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"bar","title":"Mean looking time (seconds) by condition and screen movement","xLabel":"Condition","yLabel":"Mean looking time (seconds)","categories":["Experimental condition (box behind screen)","Control condition (no box)"],"series":[{"name":"180 degree movement","values":[29.2,15.1]},{"name":"112 degree movement","values":[17.7,16.2]}],"yMax":35},"stem":"In the control condition, infants saw the same two screen movements as the experimental group, but no box was ever placed behind the screen. The difference between the two control means was not statistically significant. What is the most important thing the control result tells the researcher?","options":["Infants looked longer at the 112 degree movement (16.2 seconds) than at the 180 degree movement (15.1 seconds), so the shorter movement is more interesting.","Infants did not look longer at the 180 degree movement on its own (15.1 and 16.2 seconds), so the longer looking in the experimental condition is not explained by the movement alone.","Infants in the control condition were less interested in the display overall, so the experimental result is invalid.","Infants could not tell the two movements apart, which proves that infants cannot see a 180 degree movement."],"answer":1,"rationale":"In the control condition the means were 15.1 and 16.2 seconds, a gap of only 1.1 seconds that was not significant (F = 0.12). With no box, the 180 degree movement did not attract extra looking, so the 11.5 second gap in the experimental condition (29.2 versus 17.7) is more likely to come from the hidden box. The 112 degree option treats a non-significant gap as a real preference.","study":"aaq-hidden-objects-infants"},{"id":"DA-G1-03","section":"3.4","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Mean looking time and standard deviation (seconds) for each condition and movement","headers":["Condition","Screen movement","Mean","SD"],"rows":[["Experimental","180 degrees (impossible)","29.2","20.6"],["Experimental","112 degrees (possible)","17.7","13.1"],["Control","180 degrees","15.1","9.3"],["Control","112 degrees","16.2","12.3"]]},"stem":"The table shows looking times for infants in the two conditions. In the experimental condition, the difference between the two means was statistically significant (p < .0005). Which statement is best supported by the table?","options":["Because the SD for the impossible event (20.6) is almost as large as its mean (29.2), the difference between 29.2 and 17.7 cannot be statistically significant.","The most consistent looking times in the table were for the 112 degree movement in the control condition (SD = 12.3), which is the lowest SD.","Looking times for the impossible event varied more between infants (SD = 20.6) than looking times for the possible event (SD = 13.1), yet the difference between the two means was still statistically significant.","Infants varied more in the control condition than in the experimental condition, because the control means are lower."],"answer":2,"rationale":"A larger SD means more spread in the looking times, and 20.6 is larger than 13.1. Significance depends on the size of the mean difference relative to the spread across the whole sample, so a large SD does not rule out a significant result here (p < .0005). The lowest SD in the table is 9.3 (control, 180 degrees), not 12.3, and the control SDs (9.3 and 12.3) are both smaller than the experimental SDs for the same movements, so infants varied less, not more, in the control condition.","study":"aaq-hidden-objects-infants"},{"id":"DA-G1-04","section":"4.3","skill":"Data Interpretation","difficulty":1,"stimulus":{"type":"bar","title":"Percentage of participants who offered aid, by hurry condition","xLabel":"Hurry condition","yLabel":"Participants who offered aid (%)","categories":["Low hurry","Intermediate hurry","High hurry"],"series":[{"name":"Offered aid","values":[63,45,10]}],"yMax":100},"stem":"Forty seminary students were told they had time to spare, that the assistant was ready for them, or that they were already late. On the way to another building, each passed a man slumped in a doorway who coughed and groaned. How many percentage points more of the low hurry group than of the high hurry group offered aid?","options":["18 percentage points","35 percentage points","6.3 percentage points","53 percentage points"],"answer":3,"rationale":"The low hurry group was at 63% and the high hurry group at 10%, so the gap is 63 minus 10, which is 53 percentage points. The value 18 is the gap between low and intermediate hurry (63 minus 45), and 35 is the gap between intermediate and high hurry (45 minus 10). The value 6.3 is the ratio 63 divided by 10, not a difference in percentage points.","study":"aaq-hurry-and-helping"},{"id":"DA-G1-05","section":"4.3","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"bar","title":"Percentage of participants who offered aid, by topic of the talk","xLabel":"Topic of the talk","yLabel":"Participants who offered aid (%)","categories":["Talk about the helping story","Talk about jobs"],"series":[{"name":"Offered aid","values":[53,29]}],"yMax":100},"stem":"Before walking to another building, some seminary students prepared a talk about a story of a traveller who stopped to help an injured stranger, and others prepared a talk about jobs for seminary graduates. The difference between these two groups was not statistically significant. Which conclusion is best supported?","options":["The helping story group offered aid more often in this sample (53% versus 29%), but the difference could be due to chance, so the study does not show that the talk topic changed helping.","Thinking about helping caused an extra 24% of participants to help, so the talk topic has a significant effect.","The talk topic had no effect on helping, and the non-significant result proves this.","The two percentages cannot be compared at all because the groups prepared different talks."],"answer":0,"rationale":"The sample difference is 53 minus 29, which is 24 percentage points, but it was not statistically significant, so chance cannot be ruled out as the explanation. A non-significant result means the study found no reliable evidence of an effect, which is not the same as proof that there is no effect. The groups can be compared, because comparing groups that did different tasks is the purpose of an experiment.","study":"aaq-hurry-and-helping"},{"id":"DA-G1-06","section":"4.3","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"passage","text":"Forty-seven students at a seminary were scheduled to take part in a helping study. Seven were removed from the data: three because the procedure had been leaked to them and four because they suspected the real purpose. This left 40 participants."},"stem":"Approximately what percentage of the originally scheduled students was removed from the data? (Round to the nearest whole number.)","options":["7%","15%","18%","85%"],"answer":1,"rationale":"Seven of the 47 scheduled students were removed, and 7 divided by 47 is about 0.149, or 15%. Using 40 as the base gives 7 divided by 40, which is 17.5% (about 18%), but the original group of 47 is the correct base. The value 85% is the percentage who were kept (40 divided by 47), not the percentage removed.","study":"aaq-hurry-and-helping"},{"id":"DA-G1-07","section":"4.3","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"table","caption":"Hurry condition and percentage who offered aid (statistically significant, p < .05)","headers":["Hurry condition","What participants were told","Offered aid (%)"],"rows":[["Low","They had a few minutes to spare","63"],["Intermediate","The assistant was ready for them","45"],["High","They were already late and must get moving","10"]]},"stem":"The researchers set the hurry level for each participant, and then recorded whether the participant stopped to help a man who seemed to need aid. Which conclusion is best supported by the data?","options":["Seminary students are less caring than most people, because only 10% of the high hurry group offered aid.","Anyone who is in a hurry will walk past a person in need, because 90% of the high hurry group did not offer aid.","Among these 40 seminary students, greater hurry most likely reduced helping, because the researchers controlled hurry and helping fell steadily from 63% to 45% to 10%.","The data show only a correlation between hurry and helping, so they cannot be used to suggest that hurry affected helping."],"answer":2,"rationale":"Because the researchers decided who was in each hurry condition, the steady fall in helping (63%, 45%, 10%) and the significant result allow a cautious causal conclusion for this sample. The study had no comparison group of non-seminary students, so it cannot show that seminary students are less caring. A result for one group of 40 people cannot show that everyone in a hurry would behave the same way. The correlation-only option ignores that hurry was manipulated.","study":"aaq-hurry-and-helping"},{"id":"DA-G1-08","section":"5.1","skill":"Data Interpretation","difficulty":1,"stimulus":{"type":"table","caption":"Infection and clinical cold rates at the lowest and highest ends of the stress index (about)","headers":["Stress level","Became infected (%)","Developed a clinical cold (%)"],"rows":[["Lowest stress","74","27"],["Highest stress","90","47"]]},"stem":"Volunteers' stress was measured with questionnaires, and then they were exposed to a cold virus. By how many percentage points did the rate of clinical colds rise from the lowest to the highest stress level?","options":["16 percentage points","27 percentage points","47 percentage points","20 percentage points"],"answer":3,"rationale":"The clinical cold rate rose from 27% to 47%, and 47 minus 27 is 20 percentage points. The value 16 is the rise in the infection rate (90 minus 74), which is a different outcome. The values 27 and 47 are single rates at one stress level, not the size of the rise.","study":"aaq-stress-and-colds"},{"id":"DA-G1-09","section":"5.1","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Clinical colds by type of nose drops","headers":["Group","Number of volunteers","Developed a clinical cold"],"rows":[["Received a cold virus","394","148 (38%)"],["Received salt water (saline)","26","0"]]},"stem":"In a study of stress and colds, most volunteers were given nose drops containing a cold virus, and a small group was given salt water instead. Which conclusion does the saline group make possible?","options":["The colds in the virus group were due to the virus and not simply to living in quarantine, because none of the 26 saline volunteers developed a cold.","Stress has no effect on colds, because none of the saline volunteers developed a cold.","The saline group is too small (26 people) to tell the researchers anything, so it should be ignored.","The saline group shows that 38% of the colds in the virus group were caused by stress."],"answer":0,"rationale":"Saline and virus volunteers shared the same quarantine conditions, but only the virus group caught colds (148 of 394 is about 37.6%, which rounds to 38%). This points to the virus as the cause of the colds. The saline group says nothing about stress, because stress was not compared in this table, and even a small comparison group is useful when its result is clear-cut (0 colds).","study":"aaq-stress-and-colds"},{"id":"DA-G1-10","section":"5.1","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"passage","text":"As the stress index increased, the infection rate rose from about 74% to about 90%, and the rate of clinical colds rose from about 27% to about 47%. Among people who were already infected, stress was not reliably linked to developing a cold (p = .24)."},"stem":"Which interpretation of these results is best supported?","options":["The p value of .24 means there is a 24% chance that stress causes colds.","Higher stress was mainly linked to a greater chance of becoming infected, but among infected people stress did not reliably predict who developed a clinical cold.","Because p = .24 is greater than .05, the rise in infection from 74% to 90% must also be due to chance.","The p value of .24 proves that stress has no effect on colds in anyone, which contradicts the rise from 27% to 47%."],"answer":1,"rationale":"The infection rate rose 16 points (90 minus 74) with stress, while the p = .24 result applies only to the smaller group who were already infected. A p value is not the probability that a hypothesis is true, and a p above .05 for one analysis says nothing about the results of a different analysis. A non-significant result in one subgroup does not prove there is no effect.","study":"aaq-stress-and-colds"},{"id":"DA-G1-11","section":"5.1","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"passage","text":"Volunteers' stress was measured with three questionnaires (life events, perceived stress and negative mood), and the researchers did not assign anyone to a stress level. Higher stress was linked to higher rates of infection and clinical colds. The link remained after the researchers checked other factors, such as health habits and personality."},"stem":"What does the finding that the link remained after checking health habits and personality add to the study?","options":["It proves that stress causes colds, because the other possible explanations have been ruled out.","It shows that health habits and personality have no effect on whether people catch colds.","It makes those factors a less likely explanation for the link, but because stress was measured and not assigned, the study still cannot prove that stress caused the extra colds.","It means the study is no longer correlational, because the researchers analysed the data more carefully."],"answer":2,"rationale":"Checking other factors helps to reduce the chance that health habits or personality produced the link, but it cannot remove every possible third variable. The study design (measuring stress rather than assigning it) is what limits the causal conclusion, and extra analysis does not change the design. The study also did not test whether health habits affect colds, so the claim that they have no effect goes beyond the data.","study":"aaq-stress-and-colds"},{"id":"DA-G1-12","section":"1.2","skill":"Data Interpretation","difficulty":1,"stimulus":{"type":"table","caption":"Numbers of students in the study","headers":["Group","Number of students"],"rows":[["Took part in the study","119"],["Data analysed for the attention task","99"],["Data analysed for the memory (n-back) task","92"]]},"stem":"In an experiment on exercise and thinking skills, some students missed a session or had technical problems. Based on the table, how many students who took part were left out of the memory (n-back) analysis?","options":["20 students","7 students","92 students","27 students"],"answer":3,"rationale":"The study had 119 students and 92 were analysed for the memory task, so 119 minus 92 is 27 students left out. The value 20 is the number left out of the attention analysis (119 minus 99), and 7 is the gap between the two analysed groups (99 minus 92). The value 92 is the number analysed, not the number left out.","study":"aaq-exercise-attention-teens"},{"id":"DA-G1-13","section":"1.2","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Working memory (n-back) results after each session","headers":["Measure","After exercise","After sitting","p value"],"rows":[["Accuracy (% correct)","84.9","84.7","0.240"],["Reaction time (ms)","501.4","497.0","0.119"]]},"stem":"In a crossover experiment, each student completed a working memory task after an exercise session and after a sitting session. Which statement correctly reads the table?","options":["Students were on average 4.4 ms slower after exercise than after sitting, but the difference was not statistically significant.","Students were on average 4.4 ms faster after exercise, because a higher reaction time number means better performance.","Students were on average 0.2 ms slower after exercise, and the difference was statistically significant.","Accuracy was significantly higher after exercise, because 84.9% is greater than 84.7%."],"answer":0,"rationale":"A reaction time of 501.4 ms is longer, so slower, than 497.0 ms, and the gap is 501.4 minus 497.0, which is 4.4 ms. With p = 0.119, which is above .05, this difference is not statistically significant. The 0.2 figure is the accuracy gap in percentage points, not a reaction time, and the accuracy gap (p = 0.240) is also not significant.","study":"aaq-exercise-attention-teens"},{"id":"DA-G1-14","section":"1.2","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"table","caption":"Selected comparisons from the exercise study","headers":["Comparison","p value"],"rows":[["N-back accuracy, exercise versus sitting","0.240"],["N-back reaction time, exercise versus sitting","0.119"],["Alerting reaction time (attention), exercise versus sitting","0.880"],["N-back accuracy, 10 versus 20 versus 30 minute groups","0.476"]]},"stem":"Which conclusion about these results is most appropriate?","options":["A p value of 0.880 means there is an 88% chance that exercise has no effect on attention.","None of the comparisons was statistically significant, so the study found no evidence that one session changed performance, but this does not prove that exercise can never have an effect.","Because every p value is above .05, the study proved that exercise never affects attention or memory in any adolescents.","Non-significant results mean the study failed, so no conclusion of any kind can be drawn from it."],"answer":1,"rationale":"All four p values (0.240, 0.119, 0.880 and 0.476) are above .05, so no difference was reliably detected. A non-significant result does not prove that an effect is absent, because the exercise and sitting sessions may not have been different enough to show one. A p value is also not the probability that the null hypothesis is true, and a well-run null result is still informative.","study":"aaq-exercise-attention-teens"},{"id":"DA-G1-15","section":"3.6","skill":"Data Interpretation","difficulty":1,"stimulus":{"type":"bar","title":"Percentage of children who said the helper should help","xLabel":"Type of story","yLabel":"Children who said to help (%)","categories":["Moral stories","Immoral stories"],"series":[{"name":"Asked by a friend","values":[97,19]},{"name":"Asked by a stranger","values":[91,16]}],"yMax":100},"stem":"Children aged 4 to 8 heard picture stories in which one child needed help reaching an object. In moral stories the object belonged to the child asking, and in immoral stories it belonged to another child. According to the graph, what percentage of children said the helper should NOT help a friend in the immoral stories?","options":["19%","78%","81%","84%"],"answer":2,"rationale":"In the immoral stories 19% of children chose to help a friend, so the other 100 minus 19, which is 81%, chose not to help. The value 19 is the percentage who said to help, and 78 is the gap between helping a friend in the moral and immoral stories (97 minus 19). The value 84 is the share who said not to help a stranger (100 minus 16).","study":"aaq-children-helping-decisions"},{"id":"DA-G1-16","section":"3.6","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Percentage of children who said the helper should help","headers":["Story type","Asked by a friend (%)","Asked by a stranger (%)"],"rows":[["Moral story","97","91"],["Immoral story","19","16"]]},"stem":"Which statement about the pattern in the table is accurate?","options":["Whether the child asking was a friend or a stranger went with larger differences than whether the story was moral or immoral.","Both factors went with similar differences of about 78 percentage points.","The friend versus stranger difference was larger in the immoral stories (6 points) than in the moral stories (3 points).","Whether the story was moral or immoral went with much larger differences (75 to 78 points) than whether the child asking was a friend or a stranger (3 to 6 points)."],"answer":3,"rationale":"For a friend, moral versus immoral differs by 97 minus 19, which is 78 points, and for a stranger by 91 minus 16, which is 75 points. Friend versus stranger differs by only 97 minus 91, which is 6 points, in moral stories and 19 minus 16, which is 3 points, in immoral stories. The claim that friend versus stranger mattered more than moral versus immoral reverses these values, so it is wrong.","study":"aaq-children-helping-decisions"},{"id":"DA-G1-17","section":"3.6","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"passage","text":"In the immoral stories, about 25% of younger (preschool age) children said the helper should help. Among older (elementary school age) children, 13% said to help a friend and 7% said to help a stranger. The reported p < 0.001 in this study referred to the comparison between moral and immoral stories."},"stem":"Which conclusion is best supported by these figures?","options":["In the immoral stories, older children were less likely than younger children to say the helper should help, but the figures alone do not show whether this age difference is statistically significant.","The age difference is statistically significant (p < 0.001), which proves that children become less willing to help as they get older.","Older children were more likely to say to help a stranger (7%) than a friend (13%).","Younger and older children behaved in the same way, because every percentage is below 50%."],"answer":0,"rationale":"Both older-child figures (13% and 7%) are lower than the younger-child figure of about 25%, so the direction is clear. The p < 0.001 belongs to the moral versus immoral comparison, not to age, so the significance of the age gap is not given. The 7% is for strangers and 13% is for friends, so the claim that older children were more willing to help a stranger reverses them, and being below 50% does not make the groups equal.","study":"aaq-children-helping-decisions"},{"id":"DA-G1-18","section":"5.1","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Links between sources of support and weekly hours of organized sport (B = extra hours per week for each extra point of support)","headers":["Source of support","B","p value"],"rows":[["Coach","0.17","p < 0.001"],["Teammates","0.12","p < 0.05"],["PE teacher","-0.15","p < 0.01"]]},"stem":"In a study of adolescents, each source of support was scored from 0 to 14, and all sources were entered in one statistical model. Which statement correctly reads the table?","options":["Each extra point of PE teacher support went with about 0.15 more hours of organized sport per week, because its p value is below .01.","Each extra point of PE teacher support went with about 0.15 fewer hours of organized sport per week.","Teammate support was linked to fewer hours of sport, because its p value is the largest in the table.","Coach support had the strongest link because it was the only source with a positive B."],"answer":1,"rationale":"A negative B of -0.15 means that more PE teacher support went with fewer weekly hours, and the p value (p < 0.01) shows only that this link is unlikely to be due to chance. It does not give the direction. Teammate support was also positive (B = 0.12), so the claim that coach support was the only positive source is false.","study":"aaq-teen-sport-social-support"},{"id":"DA-G1-19","section":"5.1","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"passage","text":"In a study of adolescents, coach support was scored from 0 to 14. In the statistical model, B = 0.17 for coach support, which means each extra point of coach support went with about 0.17 more hours of organized sport per week."},"stem":"Student X scored 10 points higher on coach support than Student Y. According to the model, about how much more organized sport per week is Student X linked to playing?","options":["About 0.17 hours (10 minutes)","About 10 hours","About 1.7 hours","About 17 hours"],"answer":2,"rationale":"Each point is linked to 0.17 hours, so 10 points are linked to 10 times 0.17, which is 1.7 hours (about 102 minutes). The value 0.17 hours is the effect of only one point. The values 10 and 17 hours come from ignoring the 0.17 multiplier or misplacing the decimal point. The model shows a link, not proof that coach support causes the extra hours.","study":"aaq-teen-sport-social-support"},{"id":"DA-G1-20","section":"5.1","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"passage","text":"Information letters were sent to 1,127 first-year students and their parents. In total, 530 students received parental consent and gave their own consent. Only 294 students had complete data in all years and formed the final sample."},"stem":"Which statement about the final sample is accurate?","options":["About 26% of the consenting students remained, because 294 out of 1,127 is about 26%.","About 45% of the consenting students remained, so more than half of them left the study.","About 55% of the consenting students remained, and because this is more than half, the final sample must be representative of all of them.","About 55% of the consenting students remained, so the students who stayed may differ from those who left, and the results may not represent all consenting students."],"answer":3,"rationale":"The consenting group was 530 students and 294 remained, so 294 divided by 530 is about 0.555, or 55%. The 26% figure uses 1,127 invited students as the base (294 divided by 1,127), which is the wrong comparison group, and 45% is the share that left (236 divided by 530). Losing 45% of participants can bias a sample, because those who stayed may differ from those who dropped out.","study":"aaq-teen-sport-social-support"},{"id":"DA-G2-01","section":"2.2","skill":"Data Interpretation","difficulty":1,"stimulus":{"type":"table","caption":"Design of the questionnaire and interview parts of a study of AI tool use","headers":["Feature","Value"],"rows":[["Adults who completed the questionnaire","666"],["Prompts on the questionnaire","23"],["Response scale","6-point Likert scale"],["Participants chosen for one-to-one interviews","50"]]},"stem":"Researchers in the United Kingdom surveyed adults about their use of AI tools, then interviewed a smaller subset of the same people. Based on the table, about what percentage of the questionnaire participants were also interviewed?","options":["13.3%","0.75%","7.5%","50%"],"answer":2,"rationale":"Fifty of 666 participants were interviewed, and 50 / 666 = 0.075, which is about 7.5%. The value 13.3% comes from dividing 666 by 50, which flips the ratio and does not give a percentage of the sample.","study":"critical-thinking-ai"},{"id":"DA-G2-02","section":"2.2","skill":"Data Interpretation","difficulty":3,"stem":"In a questionnaire study of 666 adults, people who reported using AI tools more often tended to report lower critical thinking scores (a negative correlation). Which statement best explains why this result alone cannot show that heavy AI use reduces critical thinking?","options":["People who already have weaker critical thinking skills may be the ones who turn to AI tools more often, so the direction of cause could be the other way round.","A negative correlation means the two variables are unrelated, so no conclusion of any kind can be drawn.","A negative correlation proves that lower critical thinking causes people to use AI tools more.","The result is only trustworthy if all 666 participants were also interviewed."],"answer":0,"rationale":"A correlation shows that the two measures move in opposite directions, but not which one (if either) causes the other, so weaker thinkers relying on AI more is just as consistent with the data. The negative sign shows direction, not the absence of a relationship, and the data cannot prove the reverse cause either.","study":"critical-thinking-ai"},{"id":"DA-G2-03","section":"2.2","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"passage","text":"The 666 participants lived in the United Kingdom and were recruited online through social media platforms. They ranged from high school graduates to people with doctoral degrees, worked in a variety of professional fields, and fell into three age brackets: 17 to 25, 26 to 45, and 46 and older."},"stem":"The study found a relationship between AI tool use and critical thinking scores. To which group can these findings most reasonably be generalised?","options":["Adults in every country, because 666 is a large sample.","Only the participants who were interviewed one-to-one.","Only adults aged 17 to 25, because they are the most frequent users of AI tools.","Adults in the United Kingdom who use social media, with caution beyond that group."],"answer":3,"rationale":"The varied ages, education levels and professions support applying the findings to a range of UK adults, but recruitment through social media in one country limits this to similar people. A large sample (666) does not fix a narrow recruitment method, so the claim about adults in every country overreaches.","study":"critical-thinking-ai"},{"id":"DA-G2-04","section":"2.4","skill":"Data Interpretation","difficulty":1,"stimulus":{"type":"table","caption":"Participants in a study of handwriting and typing","headers":["Age group","Number of students"],"rows":[["10 to 11 years","63"],["16 years","43"]]},"stem":"Two groups of students from Finland took part in a study of how writing method affects memory. Based on the table, what percentage of all participants were the 16-year-olds?","options":["59.4%","40.6%","43.0%","68.3%"],"answer":1,"rationale":"The total is 63 + 43 = 106 students, and 43 / 106 = 0.406, which is about 40.6%. The value 59.4% is the share of the 10 to 11 year olds, and 68.3% comes from dividing 43 by 63 instead of by the total.","study":"handwriting-typing"},{"id":"DA-G2-05","section":"2.4","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"passage","text":"For the 63 students aged 10 to 11, the results were combined across the 10-year-olds and the 11-year-olds. The combined mean number of story details recalled one week later was highest after handwriting. The researchers noted that the handwriting advantage was found mainly among the 11-year-olds."},"stem":"Which statement gives the best reason for caution when using the combined mean to describe a typical 10-year-old in this study?","options":["A combined mean cannot be calculated when two ages are mixed in one sample.","The combined mean shows that handwriting helped 10-year-olds and 11-year-olds to the same degree.","The combined mean proves that typing on a touchscreen leads to worse recall than typing on a laptop.","The combined mean may hide that the advantage was found mainly in the 11-year-olds, so it could overstate the benefit for the 10-year-olds."],"answer":3,"rationale":"A mean that merges two ages can be driven by one subgroup, and the researchers said the handwriting advantage was mainly in the 11-year-olds. The claim that handwriting helped both ages equally is the opposite of what the researchers noted, and the combined mean says nothing about laptop versus touchscreen.","study":"handwriting-typing"},{"id":"DA-G2-06","section":"2.4","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"table","caption":"Design and main results for the students aged 10 to 11","headers":["Feature","Detail"],"rows":[["Writing methods compared","Handwriting, laptop typing, touchscreen typing"],["Memory measure","One point for each correct story detail recalled"],["Delay before the memory test","One week"],["Writing time","Handwriting took longer than both typing methods"],["Details recalled","Highest after handwriting"]]},"stem":"A critic argues that the better recall after handwriting may come from the extra time spent on each story rather than from handwriting itself. Which feature of the results leaves this criticism open?","options":["Handwriting took longer than typing, so writing method and time spent on the material changed together.","The memory test took place one week later, which makes recall scores impossible to compare.","Each correct detail earned one point, so scores could not differ between conditions.","The order of the stories and methods was randomised, which guarantees that time spent was identical in every condition."],"answer":0,"rationale":"The table shows that the handwriting condition took longer and also produced the highest recall, so the two cannot be separated. Randomising the order balances order effects but does not make writing times equal, so the claim that randomising made the writing times identical is wrong.","study":"handwriting-typing"},{"id":"DA-G2-07","section":"2.2","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Students recruited and removed in the two parts of a lecture study","headers":["Part of study","Students recruited","Removed (already knew the lecture material)"],"rows":[["Part 1: personal multitasking","44","4"],["Part 2: multitasking neighbour","39","1"]]},"stem":"Some students had to be removed from each part of the study. Which statement about the proportion of students removed is correct?","options":["A larger proportion was removed in Part 2, because Part 2 had fewer students.","A larger proportion was removed in Part 1: about 9.1% compared with about 2.6%.","The same proportion was removed in both parts.","A larger proportion was removed in Part 2: about 2.6% compared with about 9.1%."],"answer":1,"rationale":"In Part 1, 4 / 44 = 0.091, or about 9.1%, while in Part 2, 1 / 39 = 0.026, or about 2.6%. Having fewer students recruited does not mean a larger share was removed, and the options that say Part 2 lost a larger share reverse the groups.","study":"laptop-multitasking"},{"id":"DA-G2-08","section":"2.2","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Structure of the comprehension test given after the lecture","headers":["Question type","Number of questions"],"rows":[["Simple knowledge","20"],["Application of knowledge","20"],["Total","40"]]},"stem":"Scores were reported as the proportion of questions answered correctly, on a scale from 0 to 1. If one student's proportion is 0.05 higher than another student's, how many more questions did the first student answer correctly?","options":["5","20","2","0.05"],"answer":2,"rationale":"The test had 20 + 20 = 40 questions, and 0.05 x 40 = 2 questions. The answer of 5 would be right only for a 100-question test, and 0.05 confuses a proportion with a number of questions.","study":"laptop-multitasking"},{"id":"DA-G2-10","section":"2.2","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"table","caption":"Comparison of the two parts of the lecture study","headers":["Feature","Part 1","Part 2"],"rows":[["What differed between groups","Whether the student multitasked on a laptop","Whether the student sat behind a multitasking neighbour"],["How the real participants took notes","On a laptop","With paper and pencil"],["Result","Students who multitasked scored lower","Students seated behind a multitasker scored lower"]]},"stem":"What does the Part 2 result add to what was found in Part 1?","options":["It shows that taking notes on paper lowers comprehension compared with taking notes on a laptop.","It shows that multitasking only harms the person who is doing it.","It shows that the confederates learned less than the real participants did.","It shows that a multitasking neighbour can lower learning even for students who are not using a laptop themselves."],"answer":3,"rationale":"In Part 2 every real participant used paper and pencil, and the only difference between groups was whether a multitasker sat in front of them, so the lower scores point to the neighbour's multitasking. Paper note-taking was the same in both Part 2 groups, so it cannot explain the gap.","study":"laptop-multitasking"},{"id":"DA-G2-11","section":"2.4","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"table","caption":"Age of the sample in a study of learning from videos","headers":["Measure","Value"],"rows":[["College students in the sample","185"],["Mean age (years)","20.62"],["Standard deviation of age (years)","1.91"]]},"stem":"If the ages in this sample were roughly normally distributed, between which two ages would about 68 percent of the participants fall?","options":["16.80 to 24.44","18.71 to 22.53","20.62 to 22.53","18.71 to 20.62"],"answer":1,"rationale":"About 68 percent of scores lie within one standard deviation of the mean: 20.62 - 1.91 = 18.71 and 20.62 + 1.91 = 22.53. The range 16.80 to 24.44 is two standard deviations (about 95 percent), and the one-sided ranges cover only about 34 percent.","study":"learning-videos"},{"id":"DA-G2-12","section":"2.4","skill":"Data Interpretation","difficulty":1,"stimulus":{"type":"table","caption":"The immediate memory test","headers":["Feature","Detail"],"rows":[["Number of questions","10"],["Answer choices per question","4"],["Correct answers per question","1"]]},"stem":"A participant who guessed randomly on every question would be expected to answer what proportion of the questions correctly?","options":["0.10","0.50","0.25","0.40"],"answer":2,"rationale":"With four choices and one correct answer, a random guess is right 1 time in 4, so the expected proportion is 0.25 (2.5 of 10 questions). The value 0.10 confuses the chance of a correct guess with 1 out of 10 questions.","study":"learning-videos"},{"id":"DA-G2-13","section":"2.4","skill":"Data Interpretation","difficulty":2,"stem":"In an experiment, 185 college students were randomly assigned to learn from either one long video or a series of short videos. The long-video group remembered more, and the difference was statistically significant (p < .001). What does p < .001 mean here?","options":["A difference this large would be very unlikely (fewer than 1 chance in 1,000) if video format had no effect on memory.","The long-video group scored 0.1% higher than the short-video group.","There is a 99.9% chance that every student remembered more after the long video.","The difference was too small to matter in real life."],"answer":0,"rationale":"A p value below .001 means results this extreme would occur less than 1 time in 1,000 by chance alone if there were no real effect. It is a probability about chance, not the size of the difference, so reading it as a 0.1% score gap is a misreading.","study":"learning-videos"},{"id":"DA-G2-14","section":"2.4","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"The short-form video condition","headers":["Feature","Value"],"rows":[["Total viewing time","10 minutes"],["Number of short videos","5 to 7"],["Length of each short video","30 seconds to 2.5 minutes"]]},"stem":"Using only these figures, what is the possible range for the average length of a short video seen by this group?","options":["30 to 150 seconds","Exactly 120 seconds","5 to 7 minutes","About 86 to 120 seconds"],"answer":3,"rationale":"Ten minutes is 600 seconds, and 600 / 7 = about 86 seconds while 600 / 5 = 120 seconds, so the average must fall in that range. The range 30 to 150 seconds is the length of the single longest and shortest videos, not the average, and 120 seconds ignores the case of seven videos.","study":"learning-videos"},{"id":"DA-G3-01","section":"2.4","skill":"Data Interpretation","difficulty":1,"stimulus":{"type":"table","caption":"Approximate mean number of words recalled, by type of processing task","headers":["Type of processing task","Approximate mean words recalled"],"rows":[["Letters or grammar (nonsemantic)","8 to 9"],["Meaning-based (semantic)","15 to 17"]]},"stem":"Participants were randomly assigned to study the same word list using either meaning-based tasks or tasks focused on letters and grammar, and then recalled as many words as they could. Which statement is best supported by the table?","options":["Meaning-based tasks produced higher average recall than tasks focused on letters or grammar.","Tasks focused on letters or grammar produced higher average recall than meaning-based tasks.","The two types of task produced about the same average recall.","Average recall was 15 to 17 words for the tasks focused on letters or grammar."],"answer":0,"rationale":"Meaning-based tasks averaged about 15 to 17 words, while tasks focused on letters or grammar averaged about 8 to 9 words, so the meaning-based tasks led to higher recall. Saying that letters or grammar tasks did better reverses the groups, and giving them 15 to 17 words attaches the meaning-based figures to the wrong group.","study":"meaningful-processing"},{"id":"DA-G3-02","section":"2.4","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Approximate group means (words recalled) within each type of task","headers":["Type of processing task","Lowest group mean","Highest group mean"],"rows":[["Letters or grammar (nonsemantic)","8","9"],["Meaning-based (semantic)","15","17"]]},"stem":"The table gives the lowest and highest approximate group means for each type of task in a word-recall experiment. Using only these figures, what is the smallest and the largest possible gap between a meaning-based group mean and a letters-or-grammar group mean?","options":["6 to 8 words","6 to 9 words","8 to 9 words","1 to 2 words"],"answer":1,"rationale":"The smallest gap pairs the lowest meaning-based mean with the highest nonsemantic mean: 15 minus 9 equals 6. The largest gap pairs the highest meaning-based mean with the lowest nonsemantic mean: 17 minus 8 equals 9. The option 1 to 2 words only reflects the spread inside each type of task, not the gap between types.","study":"meaningful-processing"},{"id":"DA-G3-03","section":"2.4","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"passage","text":"242 adult volunteers, most of them university students, were randomly assigned in a laboratory to different word-processing tasks. Those who did meaning-based tasks recalled a mean of about 15 to 17 words. Those who did tasks focused on letters or grammar recalled a mean of about 8 to 9 words."},"stem":"Which conclusion is best supported by the study described below?","options":["The results prove that thinking about meaning improves memory for people of every age.","Because 242 people took part, the results apply to all adults.","For adults like those tested, the gap in recall was probably caused by the type of processing task, because participants were randomly assigned to tasks.","The results show that people who naturally think about meaning have better memories."],"answer":2,"rationale":"Random assignment means the groups should differ mainly in the task they were given, so the gap of about 15 to 17 words versus about 8 to 9 words can reasonably be linked to the type of processing. The sample was mostly university students, so claims about every age or all adults go too far, and saying that people who naturally think about meaning remember better wrongly treats the task as a personal trait that was not manipulated.","study":"meaningful-processing"},{"id":"DA-G3-04","section":"1.6","skill":"Data Interpretation","difficulty":1,"stimulus":{"type":"table","caption":"Effects reported by the ten patients","headers":["Effect reported","Number of patients"],"rows":[["Felt the phantom hand move while watching the reflection","6"],["Felt precisely located touch in the phantom when the intact hand was touched","3"]]},"stem":"Ten patients who had lost an arm or hand watched a mirror reflection of their intact hand placed where the missing hand would be. The table shows how many patients reported each effect. What percent of the ten patients felt the phantom hand move?","options":["6%","40%","30%","60%"],"answer":3,"rationale":"Six out of ten patients felt movement, and 6 divided by 10 is 0.6, or 60%. The option 30% is the touch result (3 of 10), and 40% is the share who did not feel movement.","study":"mirror-phantom-limb"},{"id":"DA-G3-05","section":"1.6","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Patients with painful spasms in the phantom hand","headers":["Measure","Number of patients"],"rows":[["All patients in the study","10"],["Patients with painful clenching spasms","5"],["Of these, patients whose spasms eased when the mirror helped them open the phantom hand","4"]]},"stem":"In a study of ten patients with a phantom limb, some patients had painful clenching spasms in the phantom hand. Based on the table, what percent of the patients who had spasms found that their spasms eased with the mirror?","options":["80%","40%","50%","20%"],"answer":0,"rationale":"Four of the five patients with spasms improved, and 4 divided by 5 is 0.8, or 80%. The option 40% wrongly divides by all ten patients, and 50% is the share of all patients who had spasms (5 of 10).","study":"mirror-phantom-limb"},{"id":"DA-G3-06","section":"1.6","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"passage","text":"Ten patients who had lost an arm or hand, aged 23 to 73, were recruited from clinical settings rather than chosen at random. Six felt the phantom hand move when they watched the mirror reflection. Four of the five patients with painful spasms found the spasms eased with the mirror. There was no control group, and the results relied on what patients said they felt."},"stem":"Which conclusion is best supported by the results described below?","options":["The mirror treatment is effective for everyone who has a phantom limb, because most of the patients in the study responded.","Most of the ten patients reported effects with the mirror, but the small non-random sample, self-reports and lack of a control group limit generalising or proving anything.","Because four patients did not feel movement, the results show that the mirror had no real effect on phantom limb sensations.","The patients' ages of 23 to 73 show that the mirror works equally well at every age, from young adults to older adults."],"answer":1,"rationale":"Six of ten patients felt movement and four of five with spasms found relief, which is encouraging, but ten clinic-referred patients with no control group and self-reported effects cannot show the mirror works for all amputees. Claiming no real effect ignores the six who did respond, and claiming the mirror works equally well at every age treats a wide age range in a tiny sample as proof of equal effects.","study":"mirror-phantom-limb"},{"id":"DA-G3-07","section":"2.2","skill":"Data Interpretation","difficulty":1,"stimulus":{"type":"bar","title":"Share of all recorded library behaviours","xLabel":"Type of behaviour","yLabel":"Percent of recorded behaviours","categories":["Study-related","Non-study"],"series":[{"name":"Percent of behaviours","values":[60,40]}],"yMax":100},"stem":"Researchers secretly observed college students in libraries and recorded what each student was doing. After all unclear actions had been sorted, the results were as shown in the graph. Out of every 100 recorded behaviours, how many more were study-related than non-study?","options":["40","60","20","10"],"answer":2,"rationale":"Study-related behaviours made up 60 out of every 100 and non-study behaviours made up 40, so the difference is 60 minus 40, which is 20. The option 60 is just the study share, and 40 is just the non-study share.","study":"phone-nearby"},{"id":"DA-G3-08","section":"2.2","skill":"Data Interpretation","difficulty":1,"stimulus":{"type":"table","caption":"Students tracked in library observations","headers":["Round of observation","Students tracked"],"rows":[["First round","730"],["Follow-up round (additional students)","2,773"],["Number of college libraries involved","4"]]},"stem":"A research team watched students in college libraries in two rounds. The table shows how many students were tracked. How many students were tracked in total across both rounds?","options":["2,043","3,403","2,773","3,503"],"answer":3,"rationale":"The total is 730 plus 2,773, which equals 3,503. The option 2,043 subtracts instead of adding, 3,403 is an addition slip, and 2,773 leaves out the first round.","study":"phone-nearby"},{"id":"DA-G3-09","section":"2.2","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"passage","text":"Researchers disguised themselves as library patrons and, at random times, recorded what nearby students were doing and whether each student's phone was visible or out of sight. Across four college libraries they tracked 730 students in a first round and 2,773 more in a follow-up. They did not change anything about the setting. Phone location was the strongest predictor of whether a student was doing academic work."},"stem":"Which conclusion is best supported by the study described below?","options":["Students with a visible phone were more likely to be off task, but because the researchers only observed, the data cannot show that the visible phone caused the off-task behaviour.","A visible phone causes off-task behaviour, because the sample of students was so large.","Phone visibility had little link to behaviour, because the researchers did not manipulate it.","Students whose phones were put away were always on task."],"answer":0,"rationale":"The study found that phone location was the strongest predictor of academic focus, which is an association. Without manipulating phone visibility, the researchers cannot rule out other explanations, such as students who plan to be distracted leaving a phone out, and a large sample does not turn a correlation into a cause. Not manipulating a variable does not mean it has no link to behaviour.","study":"phone-nearby"},{"id":"DA-G3-10","section":"2.4","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Size of the research review","headers":["Item counted","Number"],"rows":[["Separate studies","317"],["Published research articles","184"],["Massed-versus-distributed comparisons","839"]]},"stem":"A review combined the results of many earlier studies on spaced versus crammed study. Based on the table, about how many massed-versus-distributed comparisons did each separate study contribute on average?","options":["About 4.6","About 2.6","About 1.7","About 0.4"],"answer":1,"rationale":"Dividing the 839 comparisons by the 317 separate studies gives about 2.6 comparisons per study. Dividing by the 184 articles would give about 4.6, which counts articles instead of studies, and 317 divided by 184 is about 1.7, which is the number of studies per article.","study":"spacing-effect"},{"id":"DA-G3-11","section":"2.4","skill":"Data Interpretation","difficulty":1,"stem":"A large review of hundreds of comparisons found that spaced study led to better memory than cramming overall. When memory was tested within one day of studying, the advantage of spacing was relatively small. When the delay before the test was longer, the advantage was substantially larger. Which statement correctly describes this pattern?","options":["Spacing helped only when the test took place within one day of studying.","Spacing gave no advantage when the test took place within one day of studying.","The benefit of spacing grew as the delay before the test grew.","The benefit of spacing shrank as the delay before the test grew."],"answer":2,"rationale":"The advantage was small for tests within a day and became substantially larger with longer delays, so it grew with delay. A small advantage is not the same as no advantage, and the pattern is the reverse of saying the benefit shrank with delay.","study":"spacing-effect"},{"id":"DA-G3-12","section":"2.4","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"table","caption":"What the review covered","headers":["Feature","Description"],"rows":[["Separate studies combined","317"],["Comparisons of distributed and massed practice","839"],["Main kind of task","Verbal learning and memory tasks in school or laboratory settings"],["Groups excluded","Clinical populations"]]},"stem":"Which conclusion is best supported by the table describing what the review covered?","options":["Spacing beats cramming for every kind of learning, including physical skills, in every group of people, because 839 comparisons is a very large number.","Spacing was shown to beat cramming in clinical populations, because those groups were also tested in the studies reviewed.","The review can say nothing about spacing, because its authors combined earlier studies and did not collect new data themselves.","Spacing generally helps verbal memory in typical learners, but the review gives no basis for claims about clinical groups or non-verbal learning."],"answer":3,"rationale":"The 317 studies mostly used verbal learning and memory tasks in school or laboratory settings, and clinical populations were excluded, so the conclusion should be limited to similar learners and tasks. A large number of comparisons increases confidence within that range but does not extend it to groups and tasks that were left out. Combining existing studies is a valid way to learn about spacing.","study":"spacing-effect"},{"id":"DA-G3-13","section":"5.1","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Participants assigned to each study method","headers":["Group","Number of participants"],"rows":[["All participants","120"],["Restudying (rereading)","60"],["Retrieval practice (practice tests)","60"]]},"stem":"In an experiment on stress and memory, participants first studied a list of items. Next, half of each study-method group was randomly assigned to a stressful task and half to a non-stressful control task. Based on the table and this description, how many participants were in the retrieval practice plus stress group?","options":["30","60","15","120"],"answer":0,"rationale":"There were 60 participants in the retrieval practice group, and half of them were assigned to the stressful task, so 60 divided by 2 equals 30. The option 60 is the whole retrieval practice group before it was split by stress condition.","study":"stress-performance"},{"id":"DA-G3-14","section":"5.1","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"bar","title":"Mean items recalled by the retrieval practice groups (out of 30)","xLabel":"Condition","yLabel":"Mean items recalled","categories":["Stress","Control"],"series":[{"name":"Retrieval practice","values":[11,10]}],"yMax":30},"stem":"Participants in the retrieval practice groups studied a list of 30 items and were tested the next day after either a stressful task or a non-stressful control task. About what percent of the 30 items did the stressed group recall on average?","options":["11%","37%","33%","63%"],"answer":1,"rationale":"The stressed group recalled about 11 of 30 items, and 11 divided by 30 is about 0.37, or 37%. The option 33% is the control group's result (10 of 30), and 11% mistakes the number of items for a percent.","study":"stress-performance"},{"id":"DA-G3-15","section":"5.1","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"passage","text":"Among students who studied by restudying (rereading), stress had a negative effect on recall. Among students who studied by retrieval practice, stressed students recalled an average of about 11 of 30 items, compared with about 10 items for non-stressed students."},"stem":"Which conclusion is best supported by the results described below?","options":["Stress improves memory for people who use retrieval practice, because 11 is higher than 10.","Stress lowered recall in both study-method groups, but more in the retrieval practice group.","Stress harmed recall after restudying but not after retrieval practice, which fits the idea that retrieval practice protects memory from stress.","Retrieval practice lowered participants' cortisol levels, which explains the results."],"answer":2,"rationale":"Stress reduced recall for the restudy group, while the retrieval practice group recalled about 11 items under stress against about 10 without it, so no harm appeared. A difference of 1 item out of 30 is too small to claim that stress improved memory, and the results give no cortisol comparison between study methods.","study":"stress-performance"},{"id":"DA-G3-16","section":"2.6","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Study conditions in the experiment","headers":["Condition","Reading periods","Free-recall tests"],"rows":[["SSSS","4","0"],["SSST","3","1"],["STTT","1","3"]]},"stem":"Students studied a short science passage under one of three conditions (S means a study period, T means a free-recall test) and were tested on it one week later. The group with three tests (STTT) recalled more than the group that only reread (SSSS). Based on the table and this result, which conclusion is best supported?","options":["The STTT group recalled more because it had more study periods in total than the SSSS group did.","More reading periods led to better recall, because the SSSS group had the most reading periods of any group.","The number of tests a group took had no link to how much it recalled.","All groups had four periods in total, so the recall difference relates to how the periods were used, not how many there were."],"answer":3,"rationale":"Each condition had four periods in total (4 + 0, 3 + 1 and 1 + 3), yet the STTT group recalled more, so the type of activity in each period matters. The STTT group had the fewest reading periods (1 versus 4), which rules out the first two options, and its better recall is linked to taking more tests.","study":"testing-effect"},{"id":"DA-G3-18","section":"2.6","skill":"Data Interpretation","difficulty":2,"stem":"In an experiment on rereading and retrieval practice, memory for a science passage was tested only once, one week after studying. Which statement describes something the data cannot show?","options":["The data show that retrieval practice improves memory at every possible delay.","The data cannot show whether the groups would also differ if memory had been tested immediately after studying.","The data cannot show any difference between the groups, because only one test was given.","The data show that rereading has no effect on memory."],"answer":1,"rationale":"A single test after one week only shows how the groups compared at that delay. It says nothing about other delays such as an immediate test. One test can still reveal a difference between groups, and the data do not show rereading had no effect, only that it produced weaker recall than retrieval practice.","study":"testing-effect"},{"id":"DA-G4-01","section":"1.6","skill":"Data Interpretation","difficulty":1,"stimulus":{"type":"bar","title":"Percent of test words that students rated 'old' (heard before)","xLabel":"Type of test word","yLabel":"Percent rated 'old'","categories":["Words read aloud","Key words (never read)","Weakly related words","Unrelated words"],"series":[{"name":"Percent rated old","values":[86,84,21,2]}],"yMax":100},"stem":"Thirty-six students heard lists of 12 words that were all closely linked in meaning to one key word that was never read aloud. Later they rated test words as old (heard before) or new. According to the graph, which statement is accurate?","options":["Students called the unread key words 'old' almost as often as the words that were really read aloud.","Students called the unread key words 'old' less than half as often as the words that were really read aloud.","Students were most likely to call the unrelated words 'old'.","Weakly related words were called 'old' about as often as the unread key words."],"answer":0,"rationale":"The unread key words were called 'old' by 84% of students, only 2 percentage points below the 86% for words that were really read. Weakly related words (21%) were far below the key words (84% minus 21% = 63 percentage points), so saying that weakly related words were called 'old' about as often as key words is wrong.","study":"ebq-outside-information"},{"id":"DA-G4-02","section":"1.6","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"passage","text":"Nine adults with normal hearing set the level of a probe tone so that it sounded as loud as a steady reference tone. On some trials they also touched a small tube that vibrated in time with the probe tone. On other trials they did not touch the tube. When people touched the tube, they chose a probe tone that was on average 12% lower in level than without touch (p < 0.01). A lower level means that less sound was needed to match the reference tone."},"stem":"Which conclusion is best supported by these data?","options":["Touching a vibrating tube makes every person in the world hear quiet sounds as louder.","In this small sample, touch made the quiet sound seem louder, so less sound was needed to match the reference; the sample of nine limits how far this can be generalised.","Because p < 0.01, the result is not statistically significant.","Touch made people choose a louder probe tone, because a 12% lower level means more sound was needed."],"answer":1,"rationale":"A probe tone that was 12% lower in level matched the reference, so the same sound seemed louder with touch. The p value below 0.01 means a difference this big is unlikely to be due to chance, but only nine adults took part, so the result cannot safely be applied to everyone. Saying that people needed more sound reverses the meaning of 'lower level'.","study":"ebq-outside-information"},{"id":"DA-G4-03","section":"1.6","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Mean redrawing scores (out of 36) for all participants combined","headers":["Time of test","Mean redrawing score"],"rows":[["Straight after learning","26.53"],["One week later","22.75"]]},"stem":"Students learned a story and copied a complex drawing while smelling menthol or nothing, in four groups. They redrew the figure straight away and again one week later. The groups did not differ in how well they redrew the figure (p = .91). Which statement is best supported by the table and this result?","options":["Menthol smell lowered redrawing scores, because the scores fell from 26.53 to 22.75.","A p value of .91 means there is a 91% chance that the smell improved redrawing.","Scores fell by 3.78 points over the week for students overall, and the smell conditions made no reliable difference to redrawing.","Scores fell by 4.78 points over the week for students overall, and the smell conditions made no reliable difference to redrawing."],"answer":2,"rationale":"The overall fall is 26.53 minus 22.75 = 3.78 points, and p = .91 means the groups did not differ reliably. The fall happened across all groups combined, so it cannot be blamed on the menthol smell. The 4.78 option is an arithmetic slip.","study":"ebq-outside-information"},{"id":"DA-G4-04","section":"1.6","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"table","caption":"Key results from two studies of added information and memory","headers":["Study","Extra information","Result"],"rows":[["Word lists (36 students)","Lists of words all linked in meaning to an unread key word","84% of unread key words were called 'old', compared with 21% of weakly related words and 2% of unrelated words"],["Smell cue (131 students)","Same menthol smell when learning and when remembering","Better story recall than students who had the smell only when learning (p = .023) and than students who never had it (p = .04); no difference in redrawing a figure (p = .91)"]]},"stem":"The table summarises two studies of how added information can affect memory. Taken together, which conclusion do the data support best?","options":["Extra information always improves memory, because both studies found higher scores when it was present.","Extra information always distorts memory, because students in both studies made errors.","The smell effect (p = .023) was stronger than the word-list effect (84%), because the p value is the smaller number.","Related information led to many false 'old' judgments, while a matching smell helped recall of a story but not of a drawing, so the effect of added information depends on the type of information and the task."],"answer":3,"rationale":"The word-list data show added related information producing false memories (84% against 21% and 2%). The smell data show help for story recall (p = .023 and p = .04) but none for redrawing (p = .91), so no single rule fits both. A p value and a percentage measure different things and cannot be compared as sizes of effect.","study":"ebq-outside-information"},{"id":"DA-G4-05","section":"5.2","skill":"Data Interpretation","difficulty":1,"stimulus":{"type":"table","caption":"Income and two measures of well-being in a phone survey of more than 450,000 adults","headers":["Measure","Income below about $75,000","Income above about $75,000"],"rows":[["Daily emotional well-being (yes or no questions about the day before)","Rose as income rose","Did not rise further"],["Ladder score (life rated from 0 to 10)","Rose as income rose","Kept rising, even above $120,000"]]},"stem":"Adults reported their household income, answered questions about their feelings the day before, and rated their life on a ladder from 0 to 10. Which statement matches the table?","options":["Both daily emotional well-being and ladder scores stopped rising at about $75,000.","Above about $75,000, ladder scores kept rising but daily emotional well-being did not.","Above about $75,000, daily emotional well-being fell while ladder scores kept rising.","Daily emotional well-being kept rising with income, but ladder scores stopped rising at about $75,000."],"answer":1,"rationale":"The table shows that daily emotional well-being levelled off above about $75,000 while ladder scores kept rising, even above $120,000. The table does not show well-being falling; it only stopped rising. Saying well-being kept rising while ladder scores stopped swaps the two measures.","study":"ebq-daily-positive-feelings"},{"id":"DA-G4-06","section":"5.2","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"passage","text":"A total of 184 adults aged 18 to 94 from one region rated their health as good as or better than most people their age. They carried pagers for one week, and the pager went off five times a day. Each time they rated 8 positive and 11 negative emotions. The week of testing was repeated about every five years between 1993 and 2005. The positive emotional experience score (how often positive emotions were felt minus how often negative emotions were felt) rose with age until about age 64 and then levelled off. At no point in adult life did the score fall back to the more negative levels of young adults."},"stem":"Which conclusion do these data support best?","options":["The positive emotional experience score kept rising steadily right up to age 94.","Growing older causes people's emotional experience to improve, because the score rose until about age 64.","In this healthy sample from one region, the score was higher in later adulthood than in young adulthood and levelled off after about 64, so the pattern may not hold for all older adults.","The score fell after age 64, which shows that old age is a sad time."],"answer":2,"rationale":"The score rose until about 64 and then levelled off, never falling back to young adult levels. The sample was healthy and came from one region, so generalising to all older adults is not safe, and a pattern with age does not by itself show that ageing is the cause. Claiming steady rises to age 94, or a fall after 64, misreads what happened after 64.","study":"ebq-daily-positive-feelings"},{"id":"DA-G4-07","section":"5.2","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"table","caption":"A meditation course study of employees","headers":["Detail","Meditation group","Wait-list group"],"rows":[["Randomly assigned","102","100"],["Finished the study as planned","67","72"],["Change in positive emotion ratings per week","Rose by 0.03 points","-0.008 points (p = .31)"]]},"stem":"Employees were randomly assigned to a meditation course or a wait-list group and rated their positive emotions each day for about nine weeks. When the analysis was repeated with all 195 people who started, the difference between the groups was no longer reliable (p = .17). Which interpretation is best?","options":["The course clearly works for everyone, because 0.03 is greater than -0.008.","The p value of .17 proves that the course has no effect on any participant.","The p value of .17 means there is a 17% chance that the course worked.","The benefit was clearest among people who finished the course; when everyone who started was included the group difference was no longer reliable, so the evidence for the course as a whole is weaker."],"answer":3,"rationale":"Of the 202 people assigned, 202 minus 139 = 63 (about 31%) did not finish, and the analysis of those who finished showed a rising trend only in the meditation group. When 195 starters were analysed the difference was no longer reliable (p = .17). That does not prove there is no effect, and a p value is not the chance that the course worked.","study":"ebq-daily-positive-feelings"},{"id":"DA-G4-08","section":"5.2","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Two studies of what is linked to positive feelings","headers":["Study","Factor compared","Result"],"rows":[["Phone survey of more than 450,000 adults","Household income","Emotional well-being rose with income up to about $75,000, then did not rise further"],["Pager study of 184 adults aged 18 to 94","Age","Positive emotional experience score rose with age until about 64, then levelled off"]]},"stem":"Which statement is best supported by the two results taken together?","options":["In both studies, positive feelings were linked to the factor up to a point and then stopped rising, rather than continuing to rise or falling.","Earning more money causes people to age more happily, because both patterns level off.","Both studies show that positive feelings fall after the turning point.","Income and age have the same turning point, so they must be measuring the same thing."],"answer":0,"rationale":"Both results show a rise followed by a levelling off: after about $75,000 in the first study and after about age 64 in the second. Neither study reports a fall. The turning points are in different units (dollars and years), and both studies show links, not causes.","study":"ebq-daily-positive-feelings"},{"id":"DA-G4-09","section":"5.1","skill":"Data Interpretation","difficulty":1,"stimulus":{"type":"bar","title":"Drop in cortisol by length of nature experience","xLabel":"Length of nature experience","yLabel":"Drop in cortisol (%)","categories":["7 to 14 minutes","15 to 20 minutes","21 to 30 minutes"],"series":[{"name":"Drop in cortisol","values":[8.3,3.7,18.5]}],"yMax":20},"stem":"Adults gave saliva samples just before and just after nature experiences of different lengths in daily life. Only one of these three drops was large enough to rule out chance. Based on the graph, which statement is accurate?","options":["The longer the experience, the larger the drop, so 7 to 14 minutes gave a smaller drop than 15 to 20 minutes.","Experiences of 15 to 20 minutes gave the largest drop in cortisol.","Experiences of 21 to 30 minutes gave the largest drop, 18.5%, which is more than twice the drop for 7 to 14 minutes.","All three lengths gave drops large enough to rule out chance, so even 7 minutes is enough."],"answer":2,"rationale":"The 21 to 30 minute bar is the tallest at 18.5%, and 18.5 divided by 8.3 is about 2.2, so it is more than twice the 7 to 14 minute drop. The 7 to 14 minute drop (8.3%) was actually larger than the 15 to 20 minute drop (3.7%), so saying that longer experiences always gave larger drops is wrong.","study":"ebq-nature-stress-mood"},{"id":"DA-G4-10","section":"5.1","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Links with anxiety among 654 university students (higher anxiety score = more anxiety)","headers":["Measure","Correlation with anxiety score (r)"],"rows":[["Students' rating of how pleasant and green their campus felt","-0.317"],["How often students used campus green space","-0.145"]]},"stem":"Anxiety was scored from 0 to 21 and all the data were collected at one point in time. Which conclusion is best supported by the table?","options":["Using green space more often caused anxiety to fall, because r is negative.","Use of green space had a stronger link with anxiety than students' ratings did, because -0.145 is the smaller number.","Students who rated their campus as greener had higher anxiety, because r is negative.","Both links were negative, and the link for students' ratings (-0.317) was stronger than for use of green space (-0.145), but neither shows cause and effect."],"answer":3,"rationale":"A negative r means that as one measure goes up the other goes down, so greener ratings and more use went with lower anxiety. The size of r shows strength, and 0.317 is larger than 0.145, so the ratings had the stronger link. Because the data were collected at one time, no cause can be shown.","study":"ebq-nature-stress-mood"},{"id":"DA-G4-11","section":"5.1","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"table","caption":"Mean positive mood score before and after a 30-minute walk","headers":["Group","Before the walk","After the walk"],"rows":[["Nature walk (50 students)","25.03","30.0"],["City walk (50 students)","24.88","27.65"]]},"stem":"One hundred students were randomly assigned to a nature walk or a city walk. The rise in positive mood over time was significant in both groups (p < 0.001), but the difference between the two groups was not significant (p > 0.348). Which conclusion is best supported?","options":["The nature group's rise was about 2.2 points larger than the city group's, but because the group difference was not significant, the data do not show that a nature walk raises mood more than a city walk.","The nature walk raised mood more than the city walk, because 4.97 is greater than 2.77.","The city walk did not improve mood, because the groups did not differ significantly.","Mood rose by 30.0 points in the nature group, which is a larger rise than in the city group."],"answer":0,"rationale":"The nature group rose by 30.0 minus 25.03 = 4.97 and the city group by 27.65 minus 24.88 = 2.77, a difference of 2.20. That gap was not significant (p > 0.348), so it may be due to chance, and the city group still improved significantly. Saying mood rose by 30.0 points confuses the final score with the change.","study":"ebq-nature-stress-mood"},{"id":"DA-G4-12","section":"5.1","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Two studies on green space and well-being","headers":["Study","Design","Key result"],"rows":[["Campus survey (654 students)","Questionnaire at one point in time, with satellite greenness and students' own ratings of their campus","Students' rating of campus greenness and anxiety: r = -0.317"],["Walk study (100 students)","Random assignment to a 30-minute nature walk or city walk","Positive mood rose in both groups; the difference between groups was not significant (p > 0.348)"]]},"stem":"Taken together, which statement do the two studies best support?","options":["Nature walks are no better than city walks for any outcome, so green space is useless for anxiety.","Greener surroundings went with lower anxiety in the survey, but the walk study found no significant advantage of nature over a city walk, so it is unclear that nature itself is responsible.","The survey proves that green space lowers anxiety, and the walk study confirms it.","Because mood rose in both walks, the negative correlation in the survey must be wrong."],"answer":1,"rationale":"The survey found a negative link (r = -0.317) between perceived greenness and anxiety, but a correlation cannot show cause. The walk study did compare nature with a city walk and found no significant difference (p > 0.348), so nature may not be the key factor. A null result on mood does not show that green space is useless for anxiety.","study":"ebq-nature-stress-mood"},{"id":"DA-G4-13","section":"4.3","skill":"Data Interpretation","difficulty":1,"stimulus":{"type":"bar","title":"Mean happiness rating before and after packing items for another child","xLabel":"Time of rating","yLabel":"Mean happiness (six-point scale)","categories":["Before packing","After packing"],"series":[{"name":"Mean happiness","values":[5.18,5.63]}],"yMax":6},"stem":"A total of 238 children aged 5 to 12 rated how happy they felt on a six-point scale before and after packing items for another child. There was no control group. Which statement is accurate?","options":["Happiness rose by 0.45 points, which proves that helping caused the increase.","Happiness fell by 0.45 points after packing.","Happiness rose by 0.55 points, from 5.18 to 5.63.","Mean happiness rose by 0.45 points, from 5.18 to 5.63, but without a control group other explanations are possible."],"answer":3,"rationale":"The rise is 5.63 minus 5.18 = 0.45 points, so the 0.55 option is an arithmetic slip and the 'fell' option reverses the direction. With no group that did not help, the rise might have other explanations, so it cannot be said to prove that helping caused it.","study":"ebq-helping-wellbeing"},{"id":"DA-G4-14","section":"4.3","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Mean ratings after a 4-minute game (higher score = stronger feeling)","headers":["Measure","Neutral group (158 adults)","Positive impact group (154 adults)"],"rows":[["Satisfaction from helping","2.17","3.30"],["How meaningful the activity felt","2.43","3.10"],["Positive mood","3.12","3.26"],["Anxiety","1.82","1.69"]]},"stem":"In the positive impact group, a charity also earned money from the players' keystrokes. Which statement about the table is accurate?","options":["The largest difference between the groups was for satisfaction from helping (about 1.13 points), and the smallest was for anxiety (0.13 points).","The largest difference between the groups was for how meaningful the activity felt (about 0.67 points).","The differences on all four measures were about the same size, around 0.1 to 0.2 points.","The neutral group scored higher on satisfaction from helping, 2.17 compared with 3.30."],"answer":0,"rationale":"The differences are 3.30 minus 2.17 = 1.13 for satisfaction, 3.10 minus 2.43 = 0.67 for meaning, 3.26 minus 3.12 = 0.14 for mood and 1.82 minus 1.69 = 0.13 for anxiety. Satisfaction therefore has the largest gap, not meaningfulness. Saying the neutral group scored higher reverses the groups.","study":"ebq-helping-wellbeing"},{"id":"DA-G4-15","section":"4.3","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"passage","text":"In a three-week randomised trial, 1,234 adults were assigned to a kind acts group, an enjoyable acts group or a neutral group, and 1,052 were analysed. In the tests planned in advance, the kind acts group did not dif
