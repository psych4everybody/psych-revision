fer from the other groups on any outcome. Only 38% of people in the kind acts group said they often or always made extra effort. In a second analysis, not planned in advance, only people who said they often or always went beyond their normal behaviour were included. Among them, the kind acts group had lower anxiety (p = 0.017) and a stronger sense of a valuable life (p = 0.005) than the neutral group, but did not differ from the enjoyable acts group."},"stem":"Which conclusion is best supported by these results?","options":["Doing kind acts lowered anxiety for everyone in the kind acts group, because p = 0.017.","The planned tests found no benefit of kind acts; the benefits in the second analysis came from a self-selected subgroup, were not planned, and did not beat enjoyable acts, so they need to be repeated.","Kind acts reduced anxiety by 38%.","Because the planned tests found no difference, the study proves that kind acts can never help anyone."],"answer":1,"rationale":"The planned comparison showed no difference, and the lower anxiety appeared only in the subgroup of 38% who said they made extra effort, in an analysis that was not planned in advance. That subgroup chose itself, and its results did not differ from the enjoyable acts group, so the finding is tentative. The 38% is a share of people, not a size of effect, and a null result cannot prove that kind acts never help.","study":"ebq-helping-wellbeing"},{"id":"DA-G4-16","section":"4.3","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Anxiety results in two studies of helping","headers":["Study","Comparison","Anxiety result"],"rows":[["Keyboard game for charity (445 adults in three groups)","Positive impact group (154) compared with neutral group (158)","Mean anxiety score 1.69 compared with 1.82 (higher = more anxiety)"],["Three weeks of kind acts (1,052 adults analysed)","Kind acts group compared with the other groups, in tests planned in advance","No difference on any outcome"]]},"stem":"Taken together, which statement do the results best support?","options":["Helping clearly reduces anxiety, because the first study found a lower score.","The two studies contradict each other completely, so one of them must be wrong.","Evidence that helping lowers anxiety is weak: the difference in the first study was small (0.13 points) and the second study's planned tests found no difference.","The positive impact group had higher anxiety than the neutral group."],"answer":2,"rationale":"The first study's anxiety gap is 1.82 minus 1.69 = 0.13 points, which is small, and the second study's planned tests found no difference at all. Together they give only weak support for an effect on anxiety. The studies differ in design, so they need not be contradictory, and the lower score in the positive impact group shows less anxiety, not more.","study":"ebq-helping-wellbeing"}];</script>
<script>
/* ===================== Stimulus renderer (tables and charts) ===================== */
(function (global) {
  "use strict";
  var NAVY = "#1F3864", BLUE = "#2E75B6", ORANGE = "#C55A11", PALE = ["#fde9d9", "#DEEAF1", "#ececec", "#e8f3e8"];
  var SERIES = [NAVY, ORANGE, BLUE, "#6a8f3a"];
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function nice(max) {
    if (max <= 0) return 1;
    var p = Math.pow(10, Math.floor(Math.log10(max))), m = max / p;
    var step = m <= 1 ? 0.2 : m <= 2 ? 0.5 : m <= 5 ? 1 : 2;
    return Math.ceil(max / (step * p)) * step * p;
  }
  function ticks(lo, hi, n) {
    var span = hi - lo, raw = span / n, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p;
    var step = (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p, out = [];
    for (var v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(Math.round(v * 1e6) / 1e6);
    return out;
  }
  function frame(W, H, L, T, R, B, xl, yl) {
    return '<line x1="' + L + '" y1="' + T + '" x2="' + L + '" y2="' + (H - B) + '" stroke="#222" stroke-width="2"/>' +
      '<line x1="' + L + '" y1="' + (H - B) + '" x2="' + (W - R) + '" y2="' + (H - B) + '" stroke="#222" stroke-width="2"/>' +
      (xl ? '<text x="' + ((L + W - R) / 2) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="14">' + esc(xl) + '</text>' : "") +
      (yl ? '<text x="16" y="' + ((T + H - B) / 2) + '" text-anchor="middle" font-size="' + (String(yl).length > 40 ? 11 : 14) + '" transform="rotate(-90 16 ' + ((T + H - B) / 2) + ')">' + esc(yl) + '</text>' : "");
  }
  function legend(series) {
    if (series.length < 2) return "";
    var s = "", x = 70;
    series.forEach(function (ser, i) {
      s += '<rect x="' + x + '" y="8" width="14" height="14" fill="' + SERIES[i % 4] + '"/><text x="' + (x + 20) + '" y="20" font-size="13">' + esc(ser.name) + '</text>';
      x += 34 + String(ser.name).length * 7.5;
    });
    return s;
  }
  function svg(W, H, s, inner) {
    return (s.title ? '<div style="font-weight:bold;margin-bottom:4px;">' + esc(s.title) + '</div>' : "") +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="' + esc(s.title || "Chart") + '" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" fill="#222">' + inner + '</svg>';
  }
  function bar(s) {
    var W = 640, H = 340, L = 70, T = s.series.length > 1 ? 52 : 34, R = 20, B = 62;
    var vals = []; s.series.forEach(function (ser) { vals = vals.concat(ser.values); });
    var hi = s.yMax || nice(Math.max.apply(null, vals) * 1.08), lo = Math.min(0, Math.min.apply(null, vals));
    var y = function (v) { return T + (H - T - B) * (1 - (v - lo) / (hi - lo)); };
    var n = s.categories.length, k = s.series.length, gw = (W - L - R) / n, bw = Math.min(60, gw * 0.7 / k), g = "";
    ticks(lo, hi, 5).forEach(function (t) { g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="#dde3ea"/><text x="' + (L - 8) + '" y="' + (y(t) + 4) + '" text-anchor="end" font-size="13">' + t + '</text>'; });
    s.categories.forEach(function (c, i) {
      var cx = L + gw * i + gw / 2;
      s.series.forEach(function (ser, j) {
        var v = ser.values[i], x = cx - (k * bw) / 2 + j * bw;
        g += '<rect x="' + x + '" y="' + Math.min(y(v), y(0)) + '" width="' + (bw - 3) + '" height="' + Math.abs(y(0) - y(v)) + '" fill="' + SERIES[j % 4] + '"></rect>';
        g += '<text x="' + (x + (bw - 3) / 2) + '" y="' + (y(v) - 5) + '" text-anchor="middle" font-size="12">' + v + '</text>';
      });
      g += '<text x="' + cx + '" y="' + (H - B + 18) + '" text-anchor="middle" font-size="' + (n > 6 ? 11 : 13) + '">' + esc(c) + '</text>';
    });
    return svg(W, H, s, g + frame(W, H, L, T, R, B, s.xLabel, s.yLabel) + legend(s.series));
  }
  function line(s) {
    var W = 640, H = 340, L = s.yTickLabels ? 128 : 70, T = s.series.length > 1 ? 52 : 34, R = 20, B = 52;
    var xs = [], ys = [];
    s.series.forEach(function (ser) { ser.points.forEach(function (p) { xs.push(p[0]); ys.push(p[1]); }); });
    (s.hlines || []).forEach(function (h) { ys.push(h.y); });
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    var pad = (y1 - y0) * 0.08 || 1; y0 -= pad; y1 += pad;
    if (s.yMin !== undefined) y0 = s.yMin; if (s.yMax !== undefined) y1 = s.yMax;
    var X = function (v) { return L + (W - L - R) * (v - x0) / (x1 - x0 || 1); };
    var Y = function (v) { return T + (H - T - B) * (1 - (v - y0) / (y1 - y0)); };
    var g = "", same = (s.bands || []).every(function (x) { return x.label === (s.bands[0] || {}).label; });
    (s.bands || []).forEach(function (b, i) {
      g += '<rect x="' + X(b.from) + '" y="' + T + '" width="' + (X(b.to) - X(b.from)) + '" height="' + (H - T - B) + '" fill="' + PALE[(same ? 1 : i) % 4] + '"/>' +
        '<text x="' + ((X(b.from) + X(b.to)) / 2) + '" y="' + (T - 8) + '" text-anchor="middle" font-size="16" font-weight="bold" fill="' + NAVY + '">' + esc(b.label) + '</text>';
    });
    (s.yTicks || ticks(y0, y1, 7)).forEach(function (t) {
      var lab = s.yTickLabels && s.yTickLabels[t] !== undefined ? s.yTickLabels[t] : t;
      g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(t) + '" y2="' + Y(t) + '" stroke="#dde3ea"/><text x="' + (L - 8) + '" y="' + (Y(t) + 4) + '" text-anchor="end" font-size="13">' + esc(lab) + '</text>';
    });
    (s.xTicks || ticks(x0, x1, 6)).forEach(function (t) { g += '<text x="' + X(t) + '" y="' + (H - B + 18) + '" text-anchor="middle" font-size="13">' + t + '</text>'; });
    (s.hlines || []).forEach(function (h) {
      g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(h.y) + '" y2="' + Y(h.y) + '" stroke="' + ORANGE + '" stroke-width="2" stroke-dasharray="7 5"/>' +
        '<text x="' + (W - R - 4) + '" y="' + (Y(h.y) - 6) + '" text-anchor="end" font-size="13" font-weight="bold" fill="' + ORANGE + '">' + esc(h.label || "") + '</text>';
    });
    s.series.forEach(function (ser, j) {
      var d = ser.points.map(function (p, i) { return (i ? "L" : "M") + X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1); }).join(" ");
      g += '<path d="' + d + '" fill="none" stroke="' + SERIES[j % 4] + '" stroke-width="3" stroke-linejoin="round"/>';
      if (ser.points.length <= 14) ser.points.forEach(function (p) { g += '<circle cx="' + X(p[0]) + '" cy="' + Y(p[1]) + '" r="3.5" fill="' + SERIES[j % 4] + '"/>'; });
    });
    return svg(W, H, s, g + frame(W, H, L, T, R, B, s.xLabel, s.yLabel) + legend(s.series));
  }
  function table(s) {
    var h = '<div class="tablewrap"><table><thead><tr>' + s.headers.map(function (c) { return "<th>" + esc(c) + "</th>"; }).join("") + "</tr></thead><tbody>";
    s.rows.forEach(function (r) { h += "<tr>" + r.map(function (c) { return "<td>" + esc(c) + "</td>"; }).join("") + "</tr>"; });
    return h + "</tbody></table></div>" + (s.caption ? '<div class="cap">' + esc(s.caption) + "</div>" : "");
  }
  function passage(s) { return String(s.text).split(/\n+/).map(function (p) { return '<p style="margin:4px 0">' + esc(p) + "</p>"; }).join(""); }
  global.renderStimulus = function (s) {
    try {
      if (!s) return "";
      if (s.type === "table") return table(s);
      if (s.type === "bar") return bar(s);
      if (s.type === "line") return line(s);

    app.querySelectorAll(".unitbox").forEach(function (ub) {
      ub.addEventListener("click", function (e) { e.stopPropagation(); });
      ub.addEventListener("change", function () {
        app.querySelectorAll('.topicbox[data-sec^="' + ub.getAttribute("data-unit") + '."]').forEach(function (b) { b.checked = ub.checked; });
        if (ub.checked) ub.closest("details").open = true;
        update();
      });
    });
    document.getElementById("selAll").addEventListener("click", function () { app.querySelectorAll(".topicbox").forEach(function (b) { b.checked = true; }); update(); });
    document.getElementById("selNone").addEventListener("click", function () { app.querySelectorAll(".topicbox").forEach(function (b) { b.checked = false; }); update(); });
    var sw = document.getElementById("selWeak");
    if (sw) sw.addEventListener("click", function () {
      var w = {}; weak.forEach(function (s) { w[s] = 1; });
      app.querySelectorAll(".topicbox").forEach(function (b) { b.checked = !!w[b.getAttribute("data-sec")]; if (b.checked) b.closest("details").open = true; });
      update();
    });
    app.querySelectorAll("[data-size]").forEach(function (b) {
      b.addEventListener("click", function () {
        settings.size = +b.getAttribute("data-size");
        app.querySelectorAll("[data-size]").forEach(function (x) { x.setAttribute("aria-pressed", x === b); });
        update();
      });
    });
    app.querySelectorAll('input[name="mode"]').forEach(function (r) { r.addEventListener("change", function () { settings.mode = r.value; update(); }); });
    app.querySelectorAll('input[name="source"]').forEach(function (r) { r.addEventListener("change", function () { settings.source = r.value; update(); }); });
    document.getElementById("timer").addEventListener("change", function (e) { settings.timer = e.target.checked; update(); });
    document.getElementById("qtype").addEventListener("change", function (e) { settings.type = e.target.value; update(); });
    document.getElementById("startBtn").addEventListener("click", function () { startFromSettings(settings); });
    update();
  }

  function startFromSettings(st) {
    var qs = prepareSet(st);
    if (!qs.length) return;
    var copy = JSON.parse(JSON.stringify(st));
    function begin() {
      run = newRun(qs, { mode: st.mode, timer: st.timer, settings: copy, title: (st.mode === "test" ? "Test" : "Practice") + " set" });
      saveRun(); go("quiz");
    }
    if (run && !run.finished) confirmBox("Replace your unfinished set?", "You have an unfinished set. Starting a new one will discard it. Answers you already gave stay in your progress.", "Start new set", begin);
    else begin();
  }

  /* ---------- Diagnostic ---------- */
  /* Five questions per unit, each from a different topic where possible, mostly standard difficulty,
     new to the student where possible. */
  function prepareDiagnostic() {
    var out = [], usedSets = {};
    Object.keys(UNITS).forEach(function (u) {
      var secs = shuffle(SECTIONS.filter(function (s) { return unitOf(s) === u; }));
      var picks = [];
      for (var i = 0; picks.length < CONFIG.diagnosticPerUnit && i < secs.length * 3; i++) picks.push(secs[i % secs.length]);
      picks.forEach(function (s) {
        var cands = BY_SECTION[s].filter(function (q) { return !(q.set && usedSets[q.set]) && out.indexOf(q) < 0; });
        function score(q) {
          var r = store.items[q.id], fresh = !r || (!r.a && !r.s);
          return (fresh ? 0 : 10) + (q.difficulty === 2 ? 0 : q.difficulty === 1 ? 2 : 3) + Math.random();
        }
        cands.sort(function (a, b) { return score(a) - score(b); });
        var q = cands[0];
        if (q) { out.push(q); if (q.set) usedSets[q.set] = 1; }
      });
    });
    return shuffle(out);
  }

  function renderDiagIntro() {
    var n = Object.keys(UNITS).length * CONFIG.diagnosticPerUnit, mins = Math.round(n * CONFIG.secondsPerItem / 60);
    app.innerHTML = '<h2>Know where to start for May</h2><p class="lead">A quick check across the whole course. It shows which units, and which topics inside them, to put first in your revision.</p>' +
      '<div class="card accent"><h3>How it works</h3><ul style="margin:6px 0 12px;padding-left:22px">' +
      '<li><b>' + n + ' questions</b>: ' + CONFIG.diagnosticPerUnit + ' from each of Units 0 to 5, each from a different topic.</li>' +
      '<li>It runs like the exam: no feedback until you submit, and you can flag questions and change answers.</li>' +
      '<li>Answer on your own, without notes. A guess you got right hides a gap, so if you do not know, choose your best answer and move on.</li>' +
      '<li>At the end you get a ranking of the six units and a short list of topics to start with, with one-click practice sets for each.</li>' +
      '<li>You can retake it later (for example, after a unit test or in the spring). You will get different questions each time.</li></ul>' +
      '<label class="check"><input type="checkbox" id="dtimer" checked><span><b>Use the exam timer</b> <span class="tag orange">Highly recommended</span><br><span class="muted small">' + mins + ' minutes for ' + n + ' questions, the same pace as the AP exam.</span></span></label>' +
      '<div class="row" style="margin-top:14px"><button class="btn" id="dstart">Start the diagnostic</button><button class="btn alt" data-go="home">Not now</button></div></div>';
    document.getElementById("dstart").addEventListener("click", function () {
      var timer = document.getElementById("dtimer").checked;
      function begin() {
        run = newRun(prepareDiagnostic(), { mode: "test", timer: timer, kind: "diagnostic", title: "Diagnostic" });
        saveRun(); go("quiz");
      }
      if (run && !run.finished) confirmBox("Replace your unfinished set?", "You have an unfinished set. Starting the diagnostic will discard it. Answers you already gave stay in your progress.", "Start diagnostic", begin);
      else begin();
    });
  }

  function diagnosticSummary(r) {
    var units = {}, missed = {};
    Object.keys(UNITS).forEach(function (u) { units[u] = { c: 0, n: 0 }; });
    r.items.forEach(function (it) {
      var q = BY_ID[it.id], u = unitOf(q.section), ok = it.chosen === q.answer;
      units[u].n++; if (ok) units[u].c++;
      if (!ok) (missed[u] = missed[u] || []).push(q.section);
    });
    var order = Object.keys(units).sort(function (a, b) { return (units[a].c / (units[a].n || 1)) - (units[b].c / (units[b].n || 1)) || a - b; });
    var rec = order.filter(function (u) { return units[u].n && units[u].c / units[u].n <= 0.6; }).slice(0, 3);
    if (!rec.length) rec = order.slice(0, 1);
    return { units: units, order: order, rec: rec, missed: missed };
  }

  /* ---------- Quiz ---------- */
  function stopTimer() { if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } }
  function tickTimer() {
    var el = document.getElementById("timer"); if (!el || !run || !run.deadline) return;
    var left = (run.deadline - Date.now()) / 1000;
    if (left <= 0) {
      stopTimer(); finishRun(false); go("results");
      confirmBox("Time is up", "Your set was submitted automatically. Unanswered questions count as incorrect, just like on the exam.", null, function () { }, "See my results");
      return;
    }
    if (!run.timerHidden) el.textContent = fmtTime(left) + " left";
    el.className = "timer" + (left <= 60 ? " crit" : left <= 300 ? " low" : "");
    if (Math.floor(left) === 300 || Math.floor(left) === 60) announce(Math.floor(left / 60) + " minute" + (left >= 120 ? "s" : "") + " left");
  }

  function renderQuiz() {
    if (!run) { go("home"); return; }
    var it = run.items[run.pos], q = BY_ID[it.id], test = run.mode === "test";
    var answered = run.items.filter(function (x) { return x.chosen !== null; }).length;
    var revealed = !test && it.chosen !== null;
    var html = '<div class="qhead"><span><b>Question ' + (run.pos + 1) + ' of ' + run.items.length + '</b>' + (revealed ? ' <span class="tag">' + esc(q.section + " " + topicName(q.section)) + '</span>' : '') + '</span><span class="row">' +
      (run.deadline ? '<span class="timer" id="timer"></span><button class="btn small alt" id="hideT">' + (run.timerHidden ? "Show timer" : "Hide timer") + '</button>' : '') +
      '<button class="btn small alt" id="endBtn">' + (test ? "Submit set" : "End set") + '</button></span></div>' +
      '<div class="bar"><div style="width:' + (test ? answered / run.items.length : (run.pos + (revealed ? 1 : 0)) / run.items.length) * 100 + '%"></div></div>' +
      '<div class="card">' + (q.stimulus ? '<figure class="stim">' + renderStimulus(q.stimulus) + '</figure>' : '') +
      '<p class="stem" id="stem">' + esc(q.stem) + '</p><div class="options" role="group" aria-labelledby="stem">';
    it.order.forEach(function (orig, i) {
      var cls = "opt", pressed = it.chosen === orig;
      if (revealed) cls += orig === q.answer ? " correct" : pressed ? " wrong" : " dim";
      html += '<button class="' + cls + '" data-orig="' + orig + '"' + (test ? ' aria-pressed="' + pressed + '"' : '') + (revealed ? " disabled" : "") + '><span class="ltr">' + LETTERS[i] + '</span><span>' + esc(q.options[orig]) + '</span></button>';
    });
    html += '</div><div id="fb">';
    if (revealed) html += feedbackHtml(q, it);
    html += '</div><div class="qnav">';
    if (test) {
      html += '<button class="btn alt" id="prev"' + (run.pos === 0 ? " disabled" : "") + '>Previous</button>' +
        '<button class="btn alt flagbtn" id="flag" aria-pressed="' + it.flagged + '">' + (it.flagged ? "Flagged for review" : "Flag for review") + '</button>' +
        (run.pos < run.items.length - 1 ? '<button class="btn" id="next">Next</button>' : '<button class="btn" id="submit2">Review and submit</button>');
    } else if (revealed) {
      html += '<span></span><button class="btn" id="next">' + (run.pos < run.items.length - 1 ? "Next question" : "See my results") + '</button>';
    }
    html += '</div>';
    if (test) {
      html += '<div class="navgrid" aria-label="Jump to a question">' + run.items.map(function (x, i) {
        return '<button data-jump="' + i + '" class="' + (x.chosen !== null ? "done " : "") + (i === run.pos ? "cur " : "") + (x.flagged ? "flag" : "") + '" aria-label="Question ' + (i + 1) + (x.chosen !== null ? ", answered" : ", not answered") + (x.flagged ? ", flagged" : "") + '">' + (i + 1) + '</button>';
      }).join("") + '</div><p class="keyhint">Keyboard: A to D to choose, F to flag, left and right arrows to move.</p>';
    } else {
      html += '<p class="keyhint">Keyboard: A to D to answer, Enter for the next question.</p>';
    }
    html += '</div>';
    app.innerHTML = html;

    app.querySelectorAll("button.opt").forEach(function (b) { b.addEventListener("click", function () { choose(+b.getAttribute("data-orig")); }); });
    var e;
    if ((e = document.getElementById("next"))) e.addEventListener("click", next);
    if ((e = document.getElementById("prev"))) e.addEventListener("click", prev);
    if ((e = document.getElementById("flag"))) e.addEventListener("click", toggleFlag);
    if ((e = document.getElementById("submit2"))) e.addEventListener("click", askSubmit);
    if ((e = document.getElementById("hideT"))) e.addEventListener("click", function () { run.timerHidden = !run.timerHidden; saveRun(); if (run.timerHidden) document.getElementById("timer").textContent = "Timer hidden"; this.textContent = run.timerHidden ? "Show timer" : "Hide timer"; tickTimer(); });
    document.getElementById("endBtn").addEventListener("click", test ? askSubmit : askEndPractice);
    app.querySelectorAll("[data-jump]").forEach(function (b) { b.addEventListener("click", function () { run.pos = +b.getAttribute("data-jump"); saveRun(); renderQuiz(); }); });
    if (run.deadline) { if (run.timerHidden) document.getElementById("timer").textContent = "Timer hidden"; tickTimer(); stopTimer(); timerHandle = setInterval(tickTimer, 1000); }
    if (revealed && document.getElementById("next")) document.getElementById("next").focus();
  }

  function feedbackHtml(q, it) {
    var right = it.chosen === q.answer;
    var keyLetter = LETTERS[it.order.indexOf(q.answer)];
    return '<div class="feedback' + (right ? " good" : "") + '"><p class="verdict">' + (right ? "Correct." : "Not quite. The correct answer is " + keyLetter + ".") + '</p><p>' + esc(q.rationale) + '</p></div>';
  }

  function choose(orig) {
    var it = run.items[run.pos], q = BY_ID[it.id];
    if (run.mode === "test") {
      it.chosen = it.chosen === orig ? null : orig;
      saveRun(); renderQuiz();
      var pressed = app.querySelector('button.opt[data-orig="' + orig + '"]'); if (pressed) pressed.focus();
      return;
    }
    if (it.chosen !== null) return;
    it.chosen = orig;
    recordAnswer(it.id, orig === q.answer); saveStore(); saveRun();
    renderQuiz();
    announce(orig === q.answer ? "Correct." : "Not quite. The correct answer is " + LETTERS[it.order.indexOf(q.answer)] + ".");
  }
  function next() {
    if (run.pos < run.items.length - 1) { run.pos++; saveRun(); renderQuiz(); window.scrollTo(0, 0); }
    else if (run.mode === "practice") { finishRun(false); go("results"); }
  }
  function prev() { if (run.pos > 0) { run.pos--; saveRun(); renderQuiz(); window.scrollTo(0, 0); } }
  function toggleFlag() { var it = run.items[run.pos]; it.flagged = !it.flagged; saveRun(); renderQuiz(); }

  function askSubmit() {
    var un = run.items.filter(function (x) { return x.chosen === null; }).length, fl = run.items.filter(function (x) { return x.flagged; }).length;
    var body = (un ? "<b>" + un + " question" + (un > 1 ? "s are" : " is") + " unanswered</b> and will count as incorrect. " : "You have answered every question. ") +
      (fl ? fl + " question" + (fl > 1 ? "s are" : " is") + " still flagged for review. " : "") + "Once you submit, you cannot change your answers.";
    confirmBox("Submit your set?", body, "Submit", function () { finishRun(false); go("results"); }, "Keep working");
  }
  function askEndPractice() {
    var n = run.items.filter(function (x) { return x.chosen !== null; }).length;
    if (!n) { confirmBox("End this set?", "You have not answered any questions yet, so there are no results to show.", "End set", function () { run = null; saveRun(); go("home"); }); return; }
    confirmBox("End this set now?", "Your results will include the " + n + " question" + (n > 1 ? "s" : "") + " you answered.", "End and see results", function () { finishRun(true); go("results"); });
  }

  function finishRun(early) {
    if (run.finished) return;
    stopTimer();
    run.finished = true; run.endedEarly = early; run.finishedAt = Date.now();
    if (run.mode === "test") {
      run.items.forEach(function (it) {
        var q = BY_ID[it.id];
        if (it.chosen === null) recordSeen(it.id); else recordAnswer(it.id, it.chosen === q.answer);
      });
    }
    var counted = run.items.filter(function (it) { return run.mode === "test" || it.chosen !== null; });
    var correct = counted.filter(function (it) { return it.chosen === BY_ID[it.id].answer; }).length;
    var secs = {}; counted.forEach(function (it) { secs[BY_ID[it.id].section] = 1; });
    store.history.unshift({ t: run.finishedAt, mode: run.mode, kind: run.kind, n: counted.length, c: correct, secs: Object.keys(secs), dur: Math.round((run.finishedAt - run.startedAt) / 1000) });
    if (run.kind === "diagnostic") {
      var ds = diagnosticSummary(run);
      store.lastDiag = { t: run.finishedAt, c: correct, n: counted.length, units: ds.units, rec: ds.rec, missed: ds.missed };
    }
    store.history = store.history.slice(0, 200);
    saveStore();
    localStorage && storageOK && localStorage.removeItem(CONFIG.runKey);
    reviewFilter = "all";
  }

  document.addEventListener("keydown", function (e) {
    if (view !== "quiz" || !run || run.finished || document.querySelector(".modal-back")) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var tag = (e.target.tagName || "").toLowerCase(); if (tag === "input" || tag === "select" || tag === "textarea") return;
    var it = run.items[run.pos], key = e.key.toUpperCase(), i = LETTERS.indexOf(key);
    if (i > -1) { if (run.mode === "practice" && it.chosen !== null) return; e.preventDefault(); choose(it.order[i]); return; }
    if (run.mode === "test") {
      if (key === "F") { e.preventDefault(); toggleFlag(); }
      else if (e.key === "ArrowRight") { e.preventDefault(); if (run.pos < run.items.length - 1) next(); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
    } else if (e.key === "Enter" && it.chosen !== null && e.target.id !== "next") { e.preventDefault(); next(); }
  });

  /* ---------- Results ---------- */
  function renderResults() {
    if (!run || !run.finished) { go("home"); return; }
    var test = run.mode === "test";
    var counted = run.items.filter(function (it) { return test || it.chosen !== null; });
    var correct = counted.filter(function (it) { return it.chosen === BY_ID[it.id].answer; }).length;
    var p = pct(correct, counted.length), dur = Math.round((run.finishedAt - run.startedAt) / 1000);
    var msg = p >= 80 ? "Strong work. These topics are in good shape." : p >= 60 ? "Good progress. Read the explanations for the ones you missed, then try them again." : "Keep going. Review your notes on the topics below, then retry the questions you missed.";
    var bySec = {};
    counted.forEach(function (it) { var q = BY_ID[it.id], b = bySec[q.section] || (bySec[q.section] = { n: 0, c: 0 }); b.n++; if (it.chosen === q.answer) b.c++; });
    var missed = counted.filter(function (it) { return it.chosen !== BY_ID[it.id].answer; });

    var diag = run.kind === "diagnostic";
    var html = '<h2>' + (diag ? "Diagnostic" : run.kind === "retry" ? "Retry" : test ? "Test" : "Practice") + ' results</h2>' +
      (run.endedEarly ? '<p class="lead">You ended this set early, so these results cover the ' + counted.length + ' questions you answered.</p>' : '') +
      '<div class="card accent"><div class="bigscore">' + correct + ' / ' + counted.length + ' <span style="font-size:.55em">(' + p + '%)</span></div><p style="margin:6px 0 0">' + msg + '</p>' +
      '<div class="stats"><div class="stat"><b>' + correct + '</b><span>correct</span></div><div class="stat"><b>' + (counted.length - correct) + '</b><span>' + (test ? "incorrect or blank" : "incorrect") + '</span></div>' +
      '<div class="stat"><b>' + fmtTime(dur) + '</b><span>time taken</span></div><div class="stat"><b>' + (counted.length ? Math.round(dur / counted.length) : 0) + 's</b><span>per question (exam pace 72s)</span></div></div>' +
      '<div class="row">' + (missed.length ? '<button class="btn" id="retry">Retry the ' + missed.length + ' I missed</button>' : '') +
      (run.settings ? '<button class="btn alt" id="again">Prepare another set with the same ingredients</button>' : '') +
      (diag ? '' : '<button class="btn alt" data-go="build">Change ingredients</button>') +
      (CONFIG.resultsFormUrl ? '<button class="btn alt" id="send">Send my results to my teacher</button>' : '') + '</div></div>';

    if (diag) html += diagnosticCard(diagnosticSummary(run));

    html += '<div class="card"><h3>By topic</h3><div class="tablewrap"><table class="data"><thead><tr><th>Topic</th><th>Score</th><th class="hide-sm" style="width:30%">This set</th></tr></thead><tbody>' +
      Object.keys(bySec).sort(function (a, b) { var x = a.split("."), y = b.split("."); return (x[0] - y[0]) || (x[1] - y[1]); }).map(function (s) {
        var b = bySec[s], pp = pct(b.c, b.n);
        return '<tr><td><b>' + s + '</b> ' + esc(topicName(s)) + '</td><td>' + b.c + '/' + b.n + '</td><td class="hide-sm"><div class="mini"><div style="width:' + pp + '%;background:' + (pp < 60 ? "#a3242f" : pp < 80 ? "#C55A11" : "#1e7b34") + '"></div></div></td></tr>';
      }).join("") + '</tbody></table></div></div>';

    html += '<div class="card"><h3>Review every question</h3><div class="filters" role="group" aria-label="Filter the review">' +
      [["all", "All"], ["wrong", test ? "Incorrect or blank" : "Incorrect"]].concat(test ? [["flag", "Flagged"]] : []).map(function (f) {
        return '<button class="btn small alt" data-f="' + f[0] + '" aria-pressed="' + (reviewFilter === f[0]) + '">' + f[1] + '</button>';
      }).join("") + '</div><div id="reviewList"></div></div>';
    app.innerHTML = html;

    function drawReview() {
      var list = counted.map(function (it, i) { return { it: it, n: run.items.indexOf(it) + 1 }; }).filter(function (x) {
        var q = BY_ID[x.it.id];
        if (reviewFilter === "wrong") return x.it.chosen !== q.answer;
        if (reviewFilter === "flag") return x.it.flagged;
        return true;
      });
      document.getElementById("reviewList").innerHTML = list.length ? list.map(function (x) {
        var it = x.it, q = BY_ID[it.id], ok = it.chosen === q.answer, blank = it.chosen === null;
        return '<div class="review ' + (ok ? "" : blank ? "u" : "x") + '"><div class="row" style="justify-content:space-between"><b>Question ' + x.n + (blank ? " (left blank)" : ok ? " (correct)" : " (incorrect)") + '</b><span class="tag">' + esc(q.section + " " + topicName(q.section)) + '</span></div>' +
          (q.stimulus ? '<figure class="stim" style="margin-top:8px">' + renderStimulus(q.stimulus) + '</figure>' : '') +
          '<p style="font-weight:bold;margin:8px 0 4px">' + esc(q.stem) + '</p><ol>' + it.order.map(function (orig, i) {
            var cls = orig === q.answer ? "k" : orig === it.chosen ? "yx" : "";
            var note = orig === q.answer ? (orig === it.chosen ? " (your answer, correct)" : " (correct answer)") : orig === it.chosen ? " (your answer)" : "";
            return '<li class="' + cls + '">' + LETTERS[i] + '. ' + esc(q.options[orig]) + '<span class="small">' + note + '</span></li>';
          }).join("") + '</ol><div class="rat"><b>Why:</b> ' + esc(q.rationale) + '</div></div>';
      }).join("") : '<p class="muted">Nothing to show for this filter.</p>';
    }
    drawReview();
    app.querySelectorAll("[data-f]").forEach(function (b) {
      b.addEventListener("click", function () { reviewFilter = b.getAttribute("data-f"); app.querySelectorAll("[data-f]").forEach(function (x) { x.setAttribute("aria-pressed", x === b); }); drawReview(); });
    });
    var r = document.getElementById("retry");
    if (r) r.addEventListener("click", function () {
      var qs = shuffle(missed.map(function (it) { return BY_ID[it.id]; }));
      run = newRun(qs, { mode: "practice", kind: "retry", title: "Retry missed questions", settings: run.settings }); saveRun(); go("quiz");
    });
    var a = document.getElementById("again");
    if (a) a.addEventListener("click", function () { var st = run.settings; settings = Object.assign({}, settings, st); startFromSettings(st); });
    var sd = document.getElementById("send");
    if (sd) sd.addEventListener("click", function () { sendResults(run); });
    app.querySelectorAll("[data-practice]").forEach(function (b) {
      b.addEventListener("click", function () {
        settings.source = "fresh"; settings.mode = "practice";
        go("build", { sections: b.getAttribute("data-practice").split(",") });
      });
    });
  }

  function diagnosticCard(ds) {
    var all = 0, allC = 0;
    Object.keys(ds.units).forEach(function (u) { all += ds.units[u].n; allC += ds.units[u].c; });
    var everyGood = ds.order.every(function (u) { return ds.units[u].c / (ds.units[u].n || 1) >= 0.8; });
    var recSecs = [];
    var h = '<div class="card accent"><h3>Where to start for May</h3>';
    h += '<p style="margin-top:0">' + (everyGood
      ? "You did well across the board. Start with Unit " + ds.rec[0] + ", your lowest score, and use mixed test sets to keep every unit fresh."
      : "Start with " + ds.rec.map(function (u) { return "<b>Unit " + u + ": " + esc(UNITS[u]) + "</b>"; }).join(", then ") + ".") + '</p>';
    ds.rec.forEach(function (u) {
      var missed = (ds.missed[u] || []).filter(function (s, i, arr) { return arr.indexOf(s) === i; }).sort(function (a, b) { return a.split('.')[1] - b.split('.')[1]; });
      var weakHist = SECTIONS.filter(function (s) { var st = sectionStats(s), r = rated(st); return unitOf(s) === u && r != null && r < 60 && missed.indexOf(s) < 0; });
      var secs = missed.concat(weakHist);

  var PRED = (function () {

      [77, "C+", "77 to 79"], [73, "C", "73 to 76"], [70, "C-", "70 to 72"], [67, "D+", "67 to 69"], [65, "D", "65 to 66"], [60, "D-", "60 to 64"], [0, "F", "59 and below"]];

    function daaFrom(c) { for (var i = 0; i < DAA.length; i++) if (c >= DAA[i][0]) return DAA[i][1]; return 0; }
    function letterFrom(d) { for (var i = 0; i < LETTERS_.length; i++) if (d >= LETTERS_[i][0]) return LETTERS_[i][1]; return "F"; }
    function apFrom(l) {
      if (l === "A+" || l === "A") return 5;
      if (l === "A-" || l === "B+" || l === "B") return 4;
      if (l === "B-" || l === "C+" || l === "C") return 3;

      });
      numEl.addEventListener("blur", function () { var v = parseInt(numEl.value, 10); numEl.value = clamp(isNaN(v) ? 0 : v, 0, maxFn()); });
      rangeEl.addEventListener("input", function () { numEl.value = rangeEl.value; calc(); });
    }
    $("mcqRange").max = 100; $("frqRange").max = 100;
    $("mcqRange").value = st.mcq; $("frqRange").value = st.frq;
    ["mcqMax", "frqMax"].forEach(function (id) {
      $(id).addEventListener("input", applyMaxes);
      $(id).addEventListener("blur", function () { $(id).value = readMax($(id), id === "mcqMax" ? 15 : 7); applyMaxes(); });
    });
    numInput($("mcqNum"), $("mcqRange"), function () { return readMax($("mcqMax"), 15); });
    numInput($("frqNum"), $("frqRange"), function () { return readMax($("frqMax"), 7); });
    applyMaxes();
  }

  /* ---------- Help: how progress is saved ---------- */
  function renderHelp() {
    app.innerHTML = '<h2>How your progress is saved</h2><p class="lead">There are no accounts on this site. Your progress is saved automatically, right after every answer, in the browser you are using.</p>' +
      '<div class="card accent help"><h3 style="margin-top:0">What the site remembers</h3><ul>' +
      '<li>Every question you have answered, whether you got it right, and when.</li>' +
      '<li>Your accuracy for each unit and topic, which feeds your ratings and the "My weakest topics" button.</li>' +
      '<li>Your recent sets and your last choice of ingredients.</li>' +
      '<li>An unfinished set, so you can resume it from the home page.</li>' +
      '<li>Which questions you have already seen. This is how every new set is different from the last one.</li></ul>' +
      '<p>Your progress is stored only on your device. It is not sent to your teacher or anyone else.</p></div>' +
      '<div class="card help"><h3 style="margin-top:0">To keep your progress</h3><ul class="do">' +
      '<li>Use the same device and the same browser every time.</li>' +
      '<li>Open the site from the same link. Bookmark it.</li>' +
      '<li>Download a backup from My progress about once a week, and keep it in your school Google Drive.</li>' +
      '<li>Visit at least once a week if you use Safari on an iPhone, iPad or Mac. Safari can delete saved site data after 7 days without a visit.</li></ul>' +
      '<h3>Do NOT do these, or your progress can disappear</h3><ul class="dont">' +
      '<li>Do not clear your browsing history, cookies or site data.</li>' +
      '<li>Do not use a private or incognito window. Nothing is kept after you close it.</li>' +
      '<li>Do not switch to another browser or device without restoring a backup there. Each browser keeps its own separate progress.</li>' +
      '<li>Do not open a downloaded copy of this page from your computer instead of the website link. It counts as a different site.</li>' +
      '<li>Do not use a shared or lab computer that resets itself. Other students on it could also see or erase your progress.</li>' +
      '<li>Do not press "Erase my progress" unless you really mean it.</li></ul>' +
      '<h3>Moving to a new device</h3><ol><li>On your old device, go to My progress and press <b>Download a backup</b>.</li><li>Send the file to yourself (for example, save it to Google Drive).</li><li>On the new device, open this site, go to My progress and press <b>Restore from a backup</b>.</li></ol>' +
      '<div class="row" style="margin-top:12px"><button class="btn" data-go="progress">Go to My progress</button><button class="btn alt" data-go="build">Build a set</button></div></div>';
  }

  /* ---------- Test hooks (used by automated checks) ---------- */
  window.PracticeApp = { prepareSet: prepareSet, newRun: newRun, getRun: function () { return run; }, getStore: function () { return store; }, bankSize: BANK.length, sections: SECTIONS };

  /* ---------- Start ---------- */
  if (!BANK.length) { app.innerHTML = '<div class="notice"><b>The question bank did not load.</b> Please reload the page.</div>'; return; }
  var il = document.getElementById("indexLink");
  if (CONFIG.indexUrl) il.setAttribute("href", CONFIG.indexUrl); else il.remove();
  var start = { "#build": "build", "#progress": "progress", "#help": "help" }[location.hash];
  go(start || "home", { keepFocus: true });
})();
</script>
