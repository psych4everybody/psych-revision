<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AP Psychology Data-Analysis Bank</title>
<style>
  :root {
    --navy: #1F3864; --blue: #2E75B6; --light: #DEEAF1; --orange: #C55A11;
    --ink: #1a1a1a; --muted: #4a5563; --line: #c9d6e3; --bg: #f4f7fb;
    --good: #1e7b34; --good-bg: #e3f4e7; --bad: #a3242f; --bad-bg: #fbe7e9; --warn-bg: #fff4ea;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: var(--ink); background: var(--bg); line-height: 1.5; font-size: 17px; }
  a { color: var(--blue); }
  button { font: inherit; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 18px 16px 56px; }
  header.top { background: var(--navy); color: #fff; }
  header.top .wrap { padding-top: 14px; padding-bottom: 14px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header.top h1 { margin: 0; font-size: 22px; flex: 1 1 auto; }
  header.top h1 button { all: unset; cursor: pointer; }
  header.top h1 button:focus-visible { outline: 3px solid #ffb27a; outline-offset: 3px; }
  .navlinks { display: flex; gap: 8px; flex-wrap: wrap; }
  .navlinks a, .navlinks button { color: #fff; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.35); border-radius: 6px; padding: 7px 12px; text-decoration: none; font-size: 15px; font-weight: bold; cursor: pointer; }
  .navlinks a:hover, .navlinks button:hover { background: rgba(255,255,255,.25); }
  h2 { color: var(--navy); margin: 0 0 6px; font-size: 25px; }
  h3 { color: var(--navy); margin: 0 0 8px; font-size: 19px; }
  p.lead { color: var(--muted); margin: 0 0 18px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  .card.accent { border-top: 6px solid var(--blue); }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .tile { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 8px; }
  .tile h3 { margin: 0; }
  .tile p { margin: 0; color: var(--muted); flex: 1; }
  .tile .tag { align-self: flex-start; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: 7px; border: 2px solid var(--navy); background: var(--navy); color: #fff; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 16px; }
  .btn:hover:not([disabled]) { background: var(--blue); border-color: var(--blue); }
  .btn.alt { background: #fff; color: var(--navy); }
  .btn.alt:hover:not([disabled]) { background: var(--light); color: var(--navy); border-color: var(--navy); }
  .btn.warn { background: #fff; color: var(--bad); border-color: var(--bad); }
  .btn.warn:hover:not([disabled]) { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
  .btn.small { padding: 6px 11px; font-size: 14px; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .tag { display: inline-block; background: var(--light); color: var(--navy); border-radius: 12px; padding: 2px 10px; font-size: 13px; font-weight: bold; }
  .tag.soon { background: #ececec; color: #555; }
  .tag.orange { background: #fde9d9; color: var(--orange); }
  .notice { background: var(--warn-bg); border-left: 5px solid var(--orange); padding: 12px 14px; border-radius: 6px; margin-bottom: 16px; }
  .notice.info { background: var(--light); border-left-color: var(--blue); }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }

  /* Builder */
  .step { display: flex; gap: 12px; align-items: baseline; margin-bottom: 10px; }
  .step .num { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; background: var(--orange); color: #fff; font-weight: bold; text-align: center; line-height: 30px; }
  details.unit { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; background: #fbfdff; }
  details.unit summary { list-style: none; cursor: pointer; padding: 10px 12px; display: flex; gap: 10px; align-items: center; }
  details.unit summary::-webkit-details-marker { display: none; }
  details.unit summary .chev { margin-left: auto; color: var(--muted); font-size: 14px; }
  details.unit[open] summary .chev::after { content: "Hide topics"; }
  details.unit:not([open]) summary .chev::after { content: "Show topics"; }
  .unit-title { font-weight: bold; color: var(--navy); }
  .topics { padding: 2px 12px 10px 42px; display: grid; gap: 4px; }
  label.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; padding: 4px 0; }
  label.check input { width: 20px; height: 20px; margin-top: 2px; flex: 0 0 auto; accent-color: var(--navy); }
  .count { color: var(--muted); font-size: 14px; white-space: nowrap; }
  .acc { font-size: 12.5px; font-weight: bold; border-radius: 10px; padding: 1px 8px; white-space: nowrap; }
  .acc.lo { background: var(--bad-bg); color: var(--bad); }
  .acc.mid { background: var(--warn-bg); color: var(--orange); }
  .acc.hi { background: var(--good-bg); color: var(--good); }
  .acc.na { background: #eef1f4; color: #666; }
  .seg { display: inline-flex; border: 2px solid var(--navy); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
  .seg button { border: 0; border-right: 1px solid var(--line); background: #fff; color: var(--navy); padding: 10px 18px; font-weight: bold; cursor: pointer; min-width: 58px; }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--navy); color: #fff; }
  .choice { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
  .choice label { border: 2px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; background: #fff; }
  .choice label:has(input:checked) { border-color: var(--navy); background: #f2f6fb; }
  .choice input { accent-color: var(--navy); width: 18px; height: 18px; margin-top: 3px; flex: 0 0 auto; }
  .choice b { color: var(--navy); }
  .summary-bar { position: sticky; bottom: 0; background: #fff; border-top: 3px solid var(--navy); padding: 12px 16px; margin: 0 -16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; box-shadow: 0 -4px 12px rgba(0,0,0,.06); }
  .summary-bar .txt { flex: 1 1 260px; }

  /* Quiz */
  .qhead { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .bar { height: 8px; background: #e2e9f0; border-radius: 4px; overflow: hidden; margin-bottom: 16px; }
  .bar > div { height: 100%; background: var(--blue); transition: width .25s; }
  .timer { font-weight: bold; font-variant-numeric: tabular-nums; background: var(--light); color: var(--navy); border-radius: 6px; padding: 5px 10px; }
  .timer.low { background: var(--warn-bg); color: var(--orange); }
  .timer.crit { background: var(--bad-bg); color: var(--bad); }
  figure.stim { margin: 0 0 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fcfdff; font-size: 16px; }
  figure.stim table { border-collapse: collapse; width: 100%; font-size: 15px; }
  figure.stim th, figure.stim td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
  figure.stim th { background: var(--light); color: var(--navy); }
  figure.stim .cap { font-size: 14px; color: #333; margin-top: 6px; }
  .tablewrap { overflow-x: auto; }
  .stem { font-size: 19px; font-weight: bold; margin: 0 0 16px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  button.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; padding: 13px 14px; background: #fafcfe; border: 2px solid #9db3c9; border-radius: 9px; cursor: pointer; color: var(--ink); font-size: 17px; }
  button.opt:hover:not([disabled]) { background: var(--light); border-color: var(--blue); }
  button.opt .ltr { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; background: var(--navy); color: #fff; font-weight: bold; text-align: center; line-height: 30px; font-size: 15px; }
  button.opt[aria-pressed="true"] { border-color: var(--navy); background: #e8eff7; box-shadow: inset 0 0 0 1px var(--navy); }
  button.opt[aria-pressed="true"] .ltr { background: var(--orange); }
  button.opt.correct { background: var(--good-bg); border-color: var(--good); color: #10451d; }
  button.opt.correct .ltr { background: var(--good); }
  button.opt.wrong { background: var(--bad-bg); border-color: var(--bad); color: #5e1219; }
  button.opt.wrong .ltr { background: var(--bad); }
  button.opt.dim { opacity: .6; }
  button.opt[disabled] { cursor: default; }
  .feedback { margin-top: 16px; padding: 13px 15px; border-radius: 8px; border-left: 6px solid var(--bad); background: var(--bad-bg); }
  .feedback.good { border-left-color: var(--good); background: var(--good-bg); }
  .feedback .verdict { font-weight: bold; margin: 0 0 4px; }
  .feedback p { margin: 0; }
  .qnav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .navgrid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .navgrid button { width: 40px; height: 40px; border-radius: 7px; border: 2px solid var(--line); background: #fff; color: var(--navy); font-weight: bold; cursor: pointer; position: relative; font-size: 14px; }
  .navgrid button.done { background: var(--light); border-color: #9db3c9; }
  .navgrid button.cur { border-color: var(--navy); box-shadow: inset 0 0 0 1px var(--navy); }
  .navgrid button.flag::after { content: ""; position: absolute; top: -4px; right: -4px; width: 12px; height: 12px; border-radius: 50%; background: var(--orange); border: 2px solid #fff; }
  .flagbtn[aria-pressed="true"] { background: #fde9d9; color: var(--orange); border-color: var(--orange); }
  .keyhint { font-size: 13.5px; color: var(--muted); margin-top: 10px; }

  /* Results and progress */
  .bigscore { font-size: 46px; font-weight: bold; color: var(--navy); line-height: 1.1; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 14px 0; }
  .stat { background: #f2f6fb; border-radius: 8px; padding: 12px; text-align: center; }
  .stat b { display: block; font-size: 24px; color: var(--navy); }
  .stat span { font-size: 13.5px; color: var(--muted); }
  table.data { width: 100%; border-collapse: collapse; font-size: 15.5px; }
  table.data th, table.data td { padding: 8px 9px; border-bottom: 1px solid #dde5ee; text-align: left; vertical-align: middle; }
  table.data th { background: var(--light); color: var(--navy); }
  .mini { height: 10px; background: #e2e9f0; border-radius: 5px; overflow: hidden; min-width: 80px; }
  .mini > div { height: 100%; }
  .review { border: 1px solid var(--line); border-radius: 9px; padding: 14px 16px; margin-bottom: 12px; background: #fff; border-left: 6px solid var(--good); }
  .review.x { border-left-color: var(--bad); }
  .review.u { border-left-color: #999; }
  .review ol { list-style: none; padding: 0; margin: 8px 0; }
  .review li { padding: 5px 9px; border-radius: 6px; margin: 3px 0; }
  .review li.k { background: var(--good-bg); font-weight: bold; color: #10451d; }
  .review li.yx { background: var(--bad-bg); color: #5e1219; }
  .review .rat { background: #f7f9fb; border-left: 4px solid var(--orange); padding: 8px 11px; font-size: 15.5px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 14px; }
  .filters button[aria-pressed="true"] { background: var(--navy); color: #fff; }

  /* Modal */
  .modal-back { position: fixed; inset: 0; background: rgba(15,25,45,.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal { background: #fff; border-radius: 12px; max-width: 480px; width: 100%; padding: 22px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  .modal h3 { margin-top: 0; }

  .help h3 { margin-top: 18px; }
  .help ul { padding-left: 22px; margin: 6px 0; }
  .help li { margin: 4px 0; }
  .dont li::marker { content: "\2716  "; color: var(--bad); }
  .do li::marker { content: "\2714  "; color: var(--good); }

  /* Grade predictor */
  .pgrid { display: grid; grid-template-columns: 7fr 5fr; gap: 16px; align-items: start; }
  .pgrid .sticky { position: sticky; top: 12px; }
  .numrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
  .numrow input[type=number], .setup input { width: 84px; text-align: center; font: inherit; font-weight: bold; font-size: 18px; padding: 7px; border: 1px solid #9db3c9; border-radius: 7px; }
  .setup { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .setup label { font-size: 14.5px; font-weight: bold; color: var(--muted); }
  .setup input { width: 100%; margin-top: 4px; }
  input[type=range] { width: 100%; accent-color: var(--navy); height: 28px; }
  .ticks { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .apcircle { width: 124px; height: 124px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 56px; font-weight: bold; margin: 0 auto 6px; transition: background .25s, color .25s; }
  .ap5 { background: #dff3e4; color: #1e7b34; } .ap4 { background: #e3f2ee; color: #1f7a63; } .ap3 { background: #fff4d6; color: #9a6a00; }
  .ap2 { background: #fde9d9; color: var(--orange); } .ap1 { background: var(--bad-bg); color: var(--bad); }
  .trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
  .trio div { background: #f2f6fb; border-radius: 8px; padding: 10px 6px; text-align: center; }
  .trio b { display: block; font-size: 22px; color: var(--navy); }
  .trio span { font-size: 12.5px; color: var(--muted); font-weight: bold; text-transform: uppercase; letter-spacing: .03em; }
  .bandlist div { display: flex; justify-content: space-between; padding: 6px 9px; border-radius: 6px; border: 1px solid transparent; font-size: 15px; }
  .bandlist div.hl, .daatab div.hl { background: var(--light); border-color: #9db3c9; font-weight: bold; }
  .daatab { max-height: 240px; overflow-y: auto; border: 1px solid var(--line); border-radius: 7px; font-size: 14.5px; }
  .daatab div { display: grid; grid-template-columns: 1fr 1fr; padding: 4px 10px; border-bottom: 1px solid #eef2f6; border: 1px solid transparent; }
  .daatab div span:last-child { text-align: right; }
  .daatab .head { background: var(--light); color: var(--navy); font-weight: bold; position: sticky; top: 0; }
  footer { margin-top: 28px; font-size: 13px; color: var(--muted); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 720px) {
    body { font-size: 16px; }
    .grid3 { grid-template-columns: 1fr; }
    .choice { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .topics { padding-left: 14px; }
    .stem { font-size: 17.5px; }
    button.opt { font-size: 16px; }
    h2 { font-size: 22px; }
    .bigscore { font-size: 38px; }
    .hide-sm { display: none; }
    .pgrid { grid-template-columns: 1fr; }
    .pgrid .sticky { position: static; }
  }
</style>
</head>

<script>window.AP_BANK = [{"id":"U0-008","section":"2.2","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Average confidence and actual accuracy on three question sets","headers":["Question set","Average confidence that answer was correct (%)","Actual percentage correct (%)"],"rows":[["Set 1: Geography","90","61"],["Set 2: History","85","58"],["Set 3: Science","92","66"]]},"stem":"After answering each question in a general-knowledge quiz, students rated how confident they were that their answer was correct. Based on the data in the table, the students' judgments best illustrate which concept?","options":["Confirmation bias","Regression toward the mean","Hindsight bias","Overconfidence"],"answer":3,"rationale":"Across all three sets, students' average confidence was far higher than their actual accuracy, which is overconfidence. Hindsight bias would involve claiming after the fact that they knew the answers all along."},{"id":"U0-044","section":"0.5","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"table","caption":"Minutes spent reading for pleasure on one school night","headers":["Student","Minutes"],"rows":[["Aisha","25"],["Ben","90"],["Chen","15"],["Dalia","40"],["Emeka","10"],["Farah","30"],["Gabriel","15"],["Hina","35"],["Ivan","20"]]},"stem":"The table shows how many minutes nine students read for pleasure on a school night. Which statement about these data is accurate?","options":["The median is 25 minutes, and it describes a typical student better than the mean does because of one extreme score.","The mode is 20 minutes, which is the score that occurs most often.","The mean is 25 minutes, and it is the best summary because it uses every score.","The range is 70 minutes, which shows that the scores are closely clustered."],"answer":0,"rationale":"In order, the scores are 10, 15, 15, 20, 25, 30, 35, 40 and 90, so the median (middle score) is 25. The mean is 280 divided by 9, about 31.1, pulled upward by the outlier of 90. The mode is 15 and the range is 90 minus 10, which is 80."},{"id":"U0-045","section":"0.5","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"bar","title":"Hours of sleep before the test","xLabel":"Hours of sleep","yLabel":"Number of students","categories":["5","6","7","8","9"],"series":[{"name":"Students","values":[2,5,9,6,3]}],"yMax":10},"stem":"A class of 25 students reported how many hours they slept the night before a test. Based on the graph, which statement is accurate?","options":["The mode and the median are both 7 hours.","The mode is 9 hours, and the median is 7 hours.","The mode is 7 hours, and the range is 7 hours.","The mode is 7 hours, and the median is 8 hours."],"answer":0,"rationale":"The tallest bar is 7 hours (9 students), so the mode is 7. With 25 scores, the median is the 13th; counting up gives 2 students at 5 hours, 7 through 6 hours and 16 through 7 hours, so the 13th score is 7 hours. The range is 9 minus 5, which is 4 hours."},{"id":"U0-046","section":"0.5","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"bar","title":"Scores on the challenge test","xLabel":"Score range","yLabel":"Number of students","categories":["0-20","21-40","41-60","61-80","81-100"],"series":[{"name":"Students","values":[14,10,4,2,1]}]},"stem":"A teacher gave a very difficult challenge test to 31 students. The graph shows the distribution of scores. Which statement best describes this distribution?","options":["It is approximately normal, and the mean and median are likely equal.","It is negatively skewed, and the mean is likely higher than the median.","It is positively skewed, and the mean is likely lower than the median.","It is positively skewed, and the mean is likely higher than the median."],"answer":3,"rationale":"Most scores are bunched at the low end with a tail stretching toward the few high scores, which is a positive (right) skew. The small number of high scores pulls the mean upward, above the median."},{"id":"U0-047","section":"0.5","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"bar","title":"Time to solve the puzzle","xLabel":"Time (seconds)","yLabel":"Number of students","categories":["20-29","30-39","40-49","50-59","60-69","70-79"],"series":[{"name":"Students","values":[2,9,4,3,8,2]}]},"stem":"A researcher timed 28 students solving the same math puzzle. The graph shows how long the students took. Which term best describes this distribution, and what might it suggest?","options":["It is positively skewed, which suggests that most students finished more slowly than average.","It is bimodal, which may suggest that the students fall into two groups, such as those using two different strategies.","It is negatively skewed, which suggests that a few students finished very quickly.","It is a normal distribution, which suggests that most students finished near the mean time."],"answer":1,"rationale":"The graph has two separate peaks (30 to 39 seconds and 60 to 69 seconds), which makes it bimodal. Two peaks often mean the data combine two different subgroups."},{"id":"U0-048","section":"0.5","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"History test results","headers":["Class","Number of students","Mean score","Standard deviation"],"rows":[["Class X","24","75","3"],["Class Y","24","75","12"]]},"stem":"Two classes took the same history test. Based on the table, which statement is accurate?","options":["Scores in Class X vary more from the mean than scores in Class Y.","Because the means are equal, the two sets of scores must be distributed in the same way.","Scores in Class Y are more spread out around the mean than scores in Class X.","Students in Class Y scored higher on average than students in Class X."],"answer":2,"rationale":"Standard deviation measures how much scores vary around the mean. Both classes averaged 75, but Class Y's standard deviation of 12 is much larger than Class X's 3, so Class Y's scores are more spread out."},{"id":"U0-049","section":"0.5","skill":"Data Interpretation","difficulty":3,"stem":"Scores on a national reasoning test are normally distributed with a mean of 50 and a standard deviation of 10. Fatima scored 70. Approximately what percentage of test takers scored lower than Fatima?","options":["About 68 percent","About 98 percent","About 95 percent","About 84 percent"],"answer":1,"rationale":"A score of 70 is two standard deviations above the mean. In a normal curve, 50 percent of scores fall below the mean, 34 percent fall between the mean and one standard deviation above, and about 13.5 percent fall between one and two standard deviations above, for a total of about 97.5 percent. The 95 percent figure is the share within two standard deviations on both sides of the mean."},{"id":"U0-051","section":"0.5","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"table","caption":"Correlations with weekly hours of part-time work (N = 500)","headers":["Variable","Correlation coefficient with hours worked"],"rows":[["Grade point average","-0.48"],["Hours of sleep per night","-0.71"],["Money saved per month","+0.62"],["Number of school clubs joined","+0.05"]]},"stem":"A researcher surveyed 500 high school students who have part-time jobs. The table shows the correlation between the number of hours each student works per week and four other variables. Which statement is best supported by the data?","options":["Hours worked are more strongly related to sleep than to savings.","Hours worked are most strongly related to savings, because that correlation is positive.","Hours worked have a moderate positive relationship with the number of school clubs joined.","Working more hours causes students to earn lower grades."],"answer":0,"rationale":"The strength of a correlation depends on its absolute value, not its sign, so negative 0.71 (sleep) is stronger than positive 0.62 (savings). A correlation of 0.05 shows almost no relationship, and correlational data cannot show that working causes lower grades."},{"id":"U0-052","section":"0.5","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Practice time and performance errors","headers":["Pianist","Hours of practice","Number of errors"],"rows":[["Pianist 1","1","18"],["Pianist 2","2","17"],["Pianist 3","3","14"],["Pianist 4","4","15"],["Pianist 5","5","11"],["Pianist 6","6","9"],["Pianist 7","7","8"],["Pianist 8","8","5"]]},"stem":"Eight beginner pianists recorded how many hours they practiced a new piece and how many errors they made when performing it. If these data were plotted on a scatterplot, which description would best fit the relationship?","options":["No correlation","A strong positive correlation","A strong negative correlation","A weak negative correlation"],"answer":2,"rationale":"As practice hours rise from 1 to 8, errors fall fairly steadily from 18 to 5, so the points would cluster tightly around a line sloping downward. That pattern is a strong negative correlation."},{"id":"U0-055","section":"0.6","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"bar","title":"Mean words recalled on the final test","xLabel":"Group","yLabel":"Mean words recalled (out of 20)","categories":["Memory-training app","Puzzle game"],"series":[{"name":"Mean words recalled","values":[14.2,11.6]}],"yMax":20},"stem":"Researchers randomly assigned 80 students either to use a memory-training app for three weeks or to use a puzzle game for the same amount of time. The graph shows the mean number of words each group recalled on a final test. The difference between the groups was statistically significant (p = .01). Which interpretation is most accurate?","options":["The app improved memory for 99 percent of the students who used it.","The app had a very large effect, because the result was statistically significant.","The results prove that the app will improve memory for every person who uses it.","The difference between the groups is unlikely to have occurred by chance alone."],"answer":3,"rationale":"Statistical significance means the difference is unlikely to be due to chance. A p value of .01 does not describe what percentage of individuals improved, does not prove anything for everyone, and does not by itself show how large the effect is; that requires an effect size."},{"id":"U0-056","section":"0.6","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Effect sizes for two sleep programs","headers":["Program","Statistically significant?","Effect size"],"rows":[["Program A: sleep-tips emails","Yes","0.15"],["Program B: evening screen-free routine","Yes","0.90"]]},"stem":"Two school programs designed to improve students' sleep were each tested in a separate experiment. Both produced statistically significant improvements. Based on the table, which conclusion is most accurate?","options":["Both programs had medium effects, because both results were statistically significant.","Program A had a large effect, because its results were statistically significant.","Neither program was effective, because both effect sizes are below 1.0.","Program A had a small effect, and Program B had a large effect."],"answer":3,"rationale":"Effect size shows how big a difference is. By common guidelines, values around 0.2 are small and values of 0.8 or above are large, so 0.15 is small and 0.90 is large. Statistical significance alone does not tell how big an effect is."},{"id":"U0-060","section":"0.6","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"passage","text":"A technology company randomly assigned 20,000 users to type on either a standard keyboard or a new curved keyboard for one month. Users of the curved keyboard responded to on-screen prompts an average of 2 milliseconds faster. The difference was statistically significant (p < .05), and the effect size was 0.05."},"stem":"Which conclusion is best supported by the study described?","options":["Effect sizes cannot be calculated for experiments, so the effect size should be ignored.","Because the result is statistically significant, the effect of keyboard type must be large.","The difference must be due to chance, because the effect size is so small.","The difference is unlikely to be due to chance, but it is too small to matter much in practice."],"answer":3,"rationale":"With a very large sample, even a tiny difference can be statistically significant, meaning it is probably real rather than chance. The effect size of 0.05 shows the difference is very small, so it has little practical importance."},{"id":"U1-018","section":"1.1","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"bar","title":"Similarity of pitch-discrimination scores within pairs raised in the same home (hypothetical data)","xLabel":"Type of pair","yLabel":"Correlation between the two people's scores","categories":["Identical twins","Fraternal twins","Nontwin siblings","Adopted siblings"],"series":[{"name":"Correlation","values":[0.78,0.52,0.44,0.18]}],"yMax":1},"stem":"A music researcher measured the ability to tell apart two very similar musical notes in different types of pairs who were all raised in the same home. Which conclusion is best supported by the graph?","options":["The more genetically related a pair is, the more similar their scores tend to be.","Sharing a home has no effect on pitch-discrimination scores.","Identical twins have better pitch discrimination than people in the other groups.","Adopted siblings are more alike in pitch discrimination than nontwin siblings."],"answer":0,"rationale":"Similarity rises as genetic relatedness rises, from adopted siblings (no shared genes) up to identical twins (all genes shared). The graph shows correlations, which describe how alike the two members of a pair are, not how high anyone scored. Adopted siblings still show some similarity, so the shared home appears to matter a little."},{"id":"U1-029","section":"1.1","skill":"Data Interpretation","difficulty":2,"set":"u1_12_twins","stimulus":{"type":"table","caption":"Hypothetical study: 40 pairs of twins in which at least one twin was diagnosed with persistent childhood stuttering. Identical twins share all of their genes; fraternal twins share about half, like any pair of siblings.","headers":["Twin type","Pairs studied","Pairs in which both twins stutter","Percentage of pairs"],"rows":[["Identical","20","13","65%"],["Fraternal","20","3","15%"]]},"stem":"Which of the following conclusions is best supported by the data in the table?","options":["Stuttering in one twin causes the other twin to stutter through imitation.","Genetic similarity appears to be related to the likelihood that both twins stutter.","Genes are the only cause of persistent stuttering.","Shared home environment explains stuttering better than genes, because fraternal twins also grow up together."],"answer":1,"rationale":"Both twins stuttered in 65% of identical pairs but only 15% of fraternal pairs, so the more genetically similar twins were more often alike. Because the data are correlational, they cannot show that one twin causes the other's stuttering, and since identical pairs were not 100% alike, genes cannot be the only cause."},{"id":"U1-035","section":"5.3","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"bar","title":"Twin pairs in which both twins have ADHD (hypothetical data)","xLabel":"Twin type","yLabel":"Pairs in which both twins have the diagnosis (%)","categories":["Identical twins","Fraternal twins"],"series":[{"name":"Both twins diagnosed","values":[70,32]}],"yMax":100},"stem":"A research team studied twin pairs in which at least one twin has an ADHD diagnosis. Identical twins share all of their genes, while fraternal twins share about half. The pattern in the graph is most consistent with which psychological approach to explaining ADHD?","options":["Behavioral","Humanistic","Psychodynamic","Biological"],"answer":3,"rationale":"Identical twins, who share more genes, were much more likely than fraternal twins to share the diagnosis, which suggests a genetic contribution. Explaining a disorder in terms of genes and brain functioning is the focus of the biological approach."},{"id":"U1-118","section":"0.5","skill":"Data Interpretation","difficulty":1,"stem":"Sana tracks how many practice questions she completes each day over nine days: 4, 9, 12, 4, 7, 4, 15, 9, 20. What is the mode of this set of values?","options":["4","9","9.3","20"],"answer":0,"rationale":"The mode is the value that appears most often. The number 4 appears three times and 9 appears twice. The value 9 is the median, 9.3 is the mean (rounded to one decimal place), and 20 is simply the highest value in the set."},{"id":"U1-127","section":"1.3","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"line","title":"Membrane potential of one neuron after a strong stimulus is applied at 1 ms","xLabel":"Time (ms)","yLabel":"Membrane potential (mV)","series":[{"name":"Membrane potential","points":[[0,-70],[1,-70],[1.3,-55],[1.5,-10],[1.8,40],[2.2,25],[2.7,-30],[3.2,-80],[3.8,-76],[4.5,-70],[6,-70]]}],"bands":[{"from":1.3,"to":1.8,"label":"X"},{"from":1.8,"to":3.2,"label":"Y"},{"from":3.2,"to":4.5,"label":"Z"}],"hlines":[{"y":-55,"label":"Threshold"}]},"stem":"Which of the following is occurring during the interval labeled Y on the graph?","options":["Sodium ions are rapidly entering the axon, making the inside less negative.","The neuron is at rest, and the charge inside the cell equals the charge outside.","Neurotransmitters are being reabsorbed by the sending neuron.","Potassium ions are leaving the axon, moving the inside of the cell back toward its negative resting charge."],"answer":3,"rationale":"Interval Y is the fall from the peak, called repolarization, when potassium ions leave the axon and the inside of the cell becomes negative again. The sodium option describes depolarization (interval X). A resting neuron is negative inside, not equal to the outside. Reuptake happens in the synapse and does not appear on a graph of membrane potential."},{"id":"U1-222","section":"0.5","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Contralateral control quiz scores (out of 20)","headers":["Student","Score"],"rows":[["Aisha","6"],["Ben","7"],["Chidi","8"],["Dana","8"],["Emre","9"],["Fatima","10"],["Gabriel","19"]]},"stem":"Ms. Farah gives a 20-point quiz on contralateral control to seven students. The scores are shown in the table. Which statement best describes this set of scores?","options":["The distribution is negatively skewed because one unusually low score pulls the mean below the median.","The distribution is normal because the mean and the median are equal.","The distribution is positively skewed because one unusually high score pulls the mean above the median.","The median is higher than the mode, so the distribution is symmetrical."],"answer":2,"rationale":"The mean is about 9.6 and the median is 8, so the mean is higher than the median. A single extreme high score (19) pulls the mean upward, which creates a positive skew."},{"id":"U1-242","section":"0.5","skill":"Data Interpretation","difficulty":1,"stem":"Mr. Haddad gives 200 students a test on the lobes of the brain. The scores form a normal distribution. About how many students would be expected to score above the mean?","options":["50","100","68","136"],"answer":1,"rationale":"A normal distribution is symmetrical around the mean, so half of the scores fall above it and half fall below it. Half of 200 students is 100."},{"id":"U1-261","section":"1.4","skill":"Data Interpretation","difficulty":2,"stem":"A map of the somatosensory cortex shows that the lips and fingertips have very large areas of cortex devoted to them, while the back and thighs have much smaller areas, even though the back and thighs are much larger body parts. Which conclusion is best supported by this map?","options":["Larger body parts have more somatosensory cortex devoted to them.","Body parts with greater touch sensitivity have more somatosensory cortex devoted to them.","Body parts closer to the brain always have more somatosensory cortex devoted to them.","Body parts used least often have the most somatosensory cortex devoted to them."],"answer":1,"rationale":"The amount of somatosensory cortex devoted to a body part reflects its sensitivity, not its size. The fingertips are far from the brain yet have a large area, which rules out distance from the brain as the explanation."},{"id":"U1-262","section":"1.4","skill":"Data Interpretation","difficulty":3,"stem":"A split-brain patient stares at the center of a screen. When the word CUP is flashed to his right visual field, he reads it aloud easily. When the word PEN is flashed to his left visual field, he says he saw nothing, yet his left hand reaches under a cloth and picks out a pen by touch. Which conclusion is best supported by these results?","options":["In most people, the right hemisphere controls speech.","After split-brain surgery, information from each visual field still reaches both hemispheres.","The left hand is controlled mainly by the left hemisphere.","In most people, the left hemisphere controls speech, while the right hemisphere can still recognize objects without naming them."],"answer":3,"rationale":"Words in the right visual field reach the left hemisphere, which can name them, while words in the left visual field reach the right hemisphere, which cannot speak but can guide the left hand to pick the object by touch. This shows that language is mostly located in the left hemisphere."},{"id":"U1-264","section":"0.5","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Brain structures test results","headers":["Class","Number of students","Mean score","Standard deviation"],"rows":[["Class 1","25","78","3"],["Class 2","25","78","15"]]},"stem":"Two classes took the same test on brain structures. Based on the results in the table, which conclusion is most accurate?","options":["Students in Class 2 scored higher on average than students in Class 1.","The highest and lowest scores in Class 2 differ by exactly 15 points.","Scores in Class 2 are more strongly correlated with each other than scores in Class 1.","Scores in Class 2 are spread out farther from the mean than scores in Class 1."],"answer":3,"rationale":"Standard deviation measures how much scores in a group differ from the group's mean, so the larger value for Class 2 shows more spread. The means are equal, so neither class scored higher on average, and the difference between highest and lowest scores is the range, not the standard deviation."},{"id":"U1-305","section":"0.5","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Hours of Sleep and Driving-Simulator Errors","headers":["Driver","Hours of sleep","Number of errors"],"rows":[["1","4.5","14"],["2","5","12"],["3","5.5","13"],["4","6","9"],["5","6.5","8"],["6","7","8"],["7","8","5"],["8","9","3"]]},"stem":"A research team recorded how many hours each of eight teenage drivers slept the night before a driving-simulator test and how many errors each driver made during the test. Based on the data in the table, which of the following best describes the relationship between sleep and driving errors?","options":["A positive correlation","No relationship","A negative correlation","A perfect positive correlation"],"answer":2,"rationale":"As hours of sleep go up, the number of errors generally goes down, which is a negative correlation. It is not perfect because the points do not fall in an exact straight line (for example, the drivers who slept 6.5 and 7 hours made the same number of errors)."},{"id":"U1-323","section":"1.5","skill":"Data Interpretation","difficulty":2,"set":"u1c_hypnogram","stimulus":{"type":"line","title":"One Participant's Sleep Stages Across the Night","xLabel":"Hours since lights out","yLabel":"Sleep stage","series":[{"name":"Sleep stage","points":[[0,0],[0.1,1],[0.25,2],[0.45,3],[0.95,3],[1.1,2],[1.3,1],[1.5,1],[1.6,2],[1.85,3],[2.2,3],[2.4,2],[2.75,1],[3.05,1],[3.2,2],[3.5,3],[3.65,3],[3.85,2],[4.3,1],[4.75,1],[4.9,2],[5.6,2],[5.8,1],[6.4,1],[6.5,0],[6.6,2],[7.1,2],[7.25,1],[7.95,1],[8.0,0]]}],"bands":[{"from":1.3,"to":1.5,"label":"REM"},{"from":2.75,"to":3.05,"label":"REM"},{"from":4.3,"to":4.75,"label":"REM"},{"from":5.8,"to":6.4,"label":"REM"},{"from":7.25,"to":7.95,"label":"REM"}],"yTicks":[0,1,2,3],"yTickLabels":{"0":"Awake","1":"Stage 1 / REM","2":"Stage 2","3":"Stage 3"}},"stem":"The graph shows how one participant moved through the stages of sleep during a night in a sleep lab. Shaded intervals mark REM periods. If the researcher woke this participant at 7.5 hours after lights out rather than at 0.75 hours, the participant would most likely","options":["be in deep Stage 3 sleep and very hard to wake","be sleepwalking, because sleepwalking peaks near morning","report hypnagogic sensations such as the feeling of falling","report a vivid, story-like dream"],"answer":3,"rationale":"At 7.5 hours the participant is in the longest REM period of the night, and REM is when vivid dreaming usually occurs. At 0.75 hours the participant is in Stage 3, which is concentrated early in the night and is when sleepwalking is most likely."},{"id":"U1-324","section":"0.5","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Errors on the Attention Task","headers":["Participant","7.5-hour group","5-hour group"],"rows":[["1","6","9"],["2","3","11"],["3","5","8"],["4","4","12"],["5","7","10"],["6","5","7"],["7","5","13"]]},"stem":"Dr. Mensah studied how sleep restriction affects attention. Fourteen adults who usually sleep about 7.5 hours a night gave informed consent and were randomly assigned to sleep either 7.5 hours or 5 hours for one night. The next morning, each participant completed a computer attention task, and the number of errors was recorded, as shown in the table. What is the mean number of errors for the 5-hour group?","options":["5 errors","11 errors","13 errors","10 errors"],"answer":3,"rationale":"The 5-hour group's errors add up to 70 (9 + 11 + 8 + 12 + 10 + 7 + 13), and 70 divided by 7 participants is 10. Five errors is the mean of the 7.5-hour group, and 13 is simply the highest score."},{"id":"U1-325","section":"0.5","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Minutes Spent in Stage 3 and REM Sleep","headers":["Volunteer","Minutes in Stage 3","Minutes in REM"],"rows":[["Haruka","72","104"],["Kwame","95","96"],["Lucia","80","121"],["Rohan","88","110"],["Mariam","80","119"]]},"stem":"A sleep clinic recorded how many minutes five volunteers spent in Stage 3 sleep and in REM sleep during one night. Which statement about the data in the table is correct?","options":["The median time in Stage 3 sleep is 88 minutes.","The mean time in REM sleep is 110 minutes.","The range of time in Stage 3 sleep is 15 minutes.","The mode of time in REM sleep is 121 minutes."],"answer":1,"rationale":"The REM times add up to 550 minutes, and 550 divided by 5 is 110. The Stage 3 median is 80 (not 88), the Stage 3 range is 95 minus 72, or 23 minutes, and no REM value repeats, so there is no mode."},{"id":"U1-422","section":"1.6","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"line","title":"Smallest Detectable Increase in Weight","xLabel":"Weight of the original object (grams)","yLabel":"Extra weight needed to notice a difference (grams)","series":[{"name":"Just-noticeable difference","points":[[100,2],[200,4],[400,8],[600,12],[800,16],[1000,20]]}]},"stem":"Participants in a study compared a series of objects with slightly heavier versions of the same objects. The graph shows how much weight had to be added before participants noticed a difference. Which concept is best illustrated by the graph?","options":["Gate control theory","The absolute threshold","Sensory adaptation","Weber's law"],"answer":3,"rationale":"The extra weight needed is always 2% of the original weight, so the difference threshold grows in proportion to the starting stimulus, which is Weber's law. The absolute threshold would be a single minimum weight that can be detected at all, not a series of comparisons."},{"id":"U1-441","section":"0.5","skill":"Data Interpretation","difficulty":2,"stem":"Dr. Al Mansoori is studying whether listening to music changes pain perception. Ten volunteers held one hand in cold (but safe) water while music played and then rated their pain from 1 (no pain) to 10 (worst pain). The ratings were 2, 8, 5, 7, 3, 9, 5, 7, 4 and 6. What is the median pain rating?","options":["5","5.5","5.6","7"],"answer":1,"rationale":"In order, the ratings are 2, 3, 4, 5, 5, 6, 7, 7, 8, 9; with ten scores, the median is the average of the two middle scores (5 and 6), which is 5.5. The value 5.6 is the mean (56 divided by 10), not the median."},{"id":"U1-462","section":"1.6","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"line","title":"Detection of a Faint Light by One Participant","xLabel":"Light intensity (arbitrary units)","yLabel":"Percentage of trials on which the light was detected","series":[{"name":"Detection rate","points":[[1,2],[2,6],[3,18],[4,50],[5,82],[6,95],[7,99]]}],"hlines":[{"y":50,"label":"50% detection"}]},"stem":"In a dark room, a participant was shown flashes of light at different intensities and reported whether she saw each one. Based on the graph, which of the following is the best interpretation?","options":["Her absolute threshold is about 4 units of intensity.","Her absolute threshold is about 7 units, because that is where she detects nearly every flash.","Her just-noticeable difference is about 4 units of intensity.","The graph shows sensory adaptation, because detection increases as intensity increases."],"answer":0,"rationale":"The absolute threshold is the intensity detected on at least 50% of trials, and the curve crosses 50% at about 4 units. A just-noticeable difference would require comparing two stimuli, which this task did not do."},{"id":"U2-065","section":"0.5","skill":"Data Interpretation","difficulty":2,"set":"u2a_sunk","stimulus":{"type":"table","caption":"In a 10-round business decision game, researchers counted how many times each of nine participants kept investing in a failing project only because of the money they had already put into it (the sunk-cost fallacy). The results are shown in the table, listed in the order the participants were tested.","headers":["Participant","Number of sunk-cost decisions"],"rows":[["1","4"],["2","9"],["3","2"],["4","6"],["5","3"],["6","9"],["7","5"],["8","9"],["9","10"]]},"stem":"A participant whose score was at the mode of this data set would have made how many sunk-cost decisions?","options":["6","10","9","3"],"answer":2,"rationale":"The mode is the most frequent score. The value 9 appears three times, more often than any other value. The median of the data set is 6, a common mix-up."},{"id":"U2-066","section":"0.5","skill":"Data Interpretation","difficulty":2,"set":"u2a_sunk","stimulus":{"type":"table","caption":"In a 10-round business decision game, researchers counted how many times each of nine participants kept investing in a failing project only because of the money they had already put into it (the sunk-cost fallacy). The results are shown in the table, listed in the order the participants were tested.","headers":["Participant","Number of sunk-cost decisions"],"rows":[["1","4"],["2","9"],["3","2"],["4","6"],["5","3"],["6","9"],["7","5"],["8","9"],["9","10"]]},"stem":"What is the median number of sunk-cost decisions in this data set?","options":["3","6","9","8"],"answer":1,"rationale":"Ordered from lowest to highest, the scores are 2, 3, 4, 5, 6, 9, 9, 9, 10, so the middle (fifth) score is 6. The value 3 is the middle score only in the unsorted list, and 9 is the mode."},{"id":"U2-074","section":"0.5","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"bar","title":"Age at which 200 award-winning engineers produced their most influential invention","xLabel":"Age (years)","yLabel":"Number of engineers","categories":["20-24","25-29","30-34","35-39","40-44","45-49","50-54","55-59","60+"],"series":[{"name":"Engineers","values":[8,30,54,44,30,16,10,5,3]}]},"stem":"The graph shows the ages at which 200 award-winning engineers produced what is generally agreed to be their most influential invention. Which of the following conclusions is supported by the graph?","options":["More than half of the engineers produced their most influential invention after age 40.","The most common age group for engineers' most influential inventions is 30 to 34.","More engineers produced their most influential invention at ages 25 to 29 than at ages 40 to 44.","The data show that growing older causes engineers to become less inventive."],"answer":1,"rationale":"The tallest bar is at ages 30 to 34 (54 engineers), so that is the modal age group. Only 64 of the 200 engineers (32 percent) were over 40, the 25 to 29 and 40 to 44 groups are equal at 30, and descriptive data like these cannot show that age causes a change in inventiveness."},{"id":"U2-076","section":"0.6","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"table","caption":"A psychologist studied the availability heuristic. In a small first trial, 5 volunteers were randomly assigned to watch a documentary about shark attacks and 5 to watch a documentary about coral reefs. Each volunteer then rated the chance of being attacked by a shark on their next beach trip. The mean ratings were unusually extreme.","headers":["Group","Mean rated chance of a shark attack"],"rows":[["Watched shark attack documentary (n = 5)","85%"],["Watched coral reef documentary (n = 5)","2%"]]},"stem":"The psychologist now plans to randomly assign many more volunteers to each group. As more volunteers provide ratings, which of the following results should the psychologist most reasonably expect?","options":["Both group means will stay exactly the same, because the independent variable has not changed.","The shark-documentary group's mean will probably fall and the coral-documentary group's mean will probably rise, so both become less extreme.","The difference between the groups will grow, because larger samples always produce larger effects.","The results will become less trustworthy, because adding participants increases random error."],"answer":1,"rationale":"Extreme means from very small samples tend to move toward more typical values as more data are added, a pattern called regression toward the mean. Larger samples reduce, not increase, the influence of random error, and they do not automatically enlarge an effect."},{"id":"U2-089","section":"2.2","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"line","title":"Zainab's estimated chance of landing on gold before each spin","xLabel":"Spin number","yLabel":"Estimated chance of gold (%)","series":[{"name":"Zainab's estimate","points":[[1,10],[2,12],[3,15],[4,20],[5,25],[6,30],[7,40],[8,50]]}],"hlines":[{"y":10,"label":"Actual chance (10%)"}]},"stem":"A game spinner is divided into 10 equal sections, and only 1 of them is gold. Before each spin, Zainab estimates her chance of landing on gold. She does not land on gold on any of the first eight spins. The graph shows her estimates. The pattern in Zainab's thinking reflects which psychological phenomenon?","options":["Hindsight bias","The availability heuristic","The gambler's fallacy","The sunk-cost fallacy"],"answer":2,"rationale":"Each spin is independent, so the true chance stays at 10 percent, yet Zainab's estimates climb toward 50 percent after each miss. Believing that past misses make a win more likely is the gambler's fallacy."},{"id":"U2-211","section":"2.6","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"bar","title":"Interpretations of Ambiguous Shapes by Group","xLabel":"Category of interpretation","yLabel":"Percent of responses","categories":["Sea creatures","Vehicles","Faces","Plants"],"series":[{"name":"Group 1 (ocean podcast)","values":[62,12,14,12]},{"name":"Group 2 (no podcast)","values":[18,28,30,24]}],"yMax":70},"stem":"Dr. Kamau studies perception and judgment. Participants in Group 1 listened to a ten-minute podcast about life on a coral reef. Participants in Group 2 did not listen to a podcast. All participants then viewed a series of ambiguous shapes and wrote down what each shape looked like. Their responses were sorted into categories, as shown in the graph. Which of the following concepts best explains the results for Group 1?","options":["Inattentional blindness","Priming","Framing","Change blindness"],"answer":1,"rationale":"Hearing about reef life activated ocean-related ideas, which made Group 1 more likely to interpret the ambiguous shapes as sea creatures. Framing refers to how a choice is worded, and the shapes were presented in the same way to both groups."},{"id":"U2-215","section":"0.5","skill":"Data Interpretation","difficulty":2,"set":"u2b-burglary","stimulus":{"type":"line","title":"Perceived Versus Actual Burglary Rate, 2010 to 2022","xLabel":"Year","yLabel":"Burglaries per 1,000 homes","series":[{"name":"Actual rate","points":[[2010,30],[2012,28],[2014,26],[2016,24],[2018,22],[2020,19],[2022,18]]},{"name":"Average perceived rate","points":[[2010,41],[2012,43],[2014,42],[2016,44],[2018,45],[2020,44],[2022,46]]}]},"stem":"Researchers randomly selected 400 adults in a large city and asked them to estimate the burglary rate for each year from 2010 to 2022. The researchers compared these estimates with the official burglary rate, as shown in the graph. Which of the following conclusions is best supported by the overall results?","options":["Participants' estimates closely followed the downward trend in the actual burglary rate.","The gap between perceived and actual burglary rates grew wider over the period studied.","The actual burglary rate rose and fell unpredictably from 2010 to 2022.","In at least one year, participants underestimated the burglary rate."],"answer":1,"rationale":"The actual rate fell from 30 to 18 while the perceived rate rose from 41 to 46, so the gap widened from 11 to 28 burglaries per 1,000 homes. Participants overestimated the rate in every year, so they never underestimated it."},{"id":"U2-220","section":"0.5","skill":"Data Interpretation","difficulty":2,"set":"u2b-alt-uses","stimulus":{"type":"table","caption":"Number of alternative uses generated in five minutes","headers":["Volunteer","Brick","Spoon","Shoelace"],"rows":[["Volunteer 1","2","4","1"],["Volunteer 2","6","9","5"],["Volunteer 3","10","7","8"],["Volunteer 4","1","5","0"],["Volunteer 5","8","11","6"],["Volunteer 6","5","3","7"],["Volunteer 7","7","6","9"]]},"stem":"Dr. Okafor studied creativity. Seven volunteers were shown three everyday objects, one at a time, and were asked to list as many different uses for each object as they could in five minutes. The table shows the number of uses each volunteer generated. What is the median number of alternative uses generated for the spoon?","options":["5","6","6.4","8"],"answer":1,"rationale":"Ordered from lowest to highest, the spoon values are 3, 4, 5, 6, 7, 9 and 11, so the middle value is 6. The mean is about 6.4 and the range is 8, which are different measures."},{"id":"U2-232","section":"0.5","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Scores on a typing-skill test (out of 20)","headers":["Student","Sunday (Test 1)","Thursday (Test 2)"],"rows":[["1","4","5"],["2","6","6"],["3","7","9"],["4","9","8"],["5","10","11"],["6","12","12"],["7","13","15"],["8","15","14"]]},"stem":"Eight students took a typing-skill test that measures procedural memory on Sunday (Test 1), and the same students took the same test again on Thursday (Test 2). Their scores are shown in the table. Which of the following correlation coefficients was most likely obtained from the two sets of scores?","options":["-.95","+.10","+1.00","+.95"],"answer":3,"rationale":"Students who scored high on Test 1 generally scored high on Test 2, which shows a strong positive correlation. It is not a perfect +1.00 because some students' ranks switched slightly, such as Students 3 and 4."},{"id":"U2-242","section":"0.5","skill":"Data Interpretation","difficulty":3,"set":"u2b-lop-data","stimulus":{"type":"table","caption":"Number of words recalled (out of 25) by each participant","headers":["Structural group","Semantic group"],"rows":[["2","15"],["5","16"],["7","17"],["9","17"],["14","17"],["15","18"],["18","19"]]},"stem":"In a memory study, participants in the structural group studied a list of 25 words by deciding whether each word was printed in bold type. Participants in the semantic group studied the same list by deciding whether each word fit into a given sentence. The table shows the number of words each participant later recalled. Based on the data, which of the following statements is true?","options":["Scores in the structural group are more spread out than scores in the semantic group.","The structural group's median is higher than its mean.","The semantic group has a larger range than the structural group.","The two groups have the same median."],"answer":0,"rationale":"Structural scores spread from 2 to 18, while semantic scores cluster between 15 and 19, so the structural group shows much more variability. The structural group's median (9) is lower than its mean (10), and the semantic group's range (4) is smaller than the structural range (16)."},{"id":"U2-243","section":"0.5","skill":"Data Interpretation","difficulty":2,"set":"u2b-lop-data","stimulus":{"type":"table","caption":"Number of words recalled (out of 25) by each participant","headers":["Structural group","Semantic group"],"rows":[["2","15"],["5","16"],["7","17"],["9","17"],["14","17"],["15","18"],["18","19"]]},"stem":"In a memory study, participants in the structural group studied a list of 25 words by deciding whether each word was printed in bold type. Participants in the semantic group studied the same list by deciding whether each word fit into a given sentence. The table shows the number of words each participant later recalled. What is the mean number of words recalled by the structural group?","options":["9","14","16","10"],"answer":3,"rationale":"The structural scores add up to 70, and 70 divided by 7 participants equals 10. The value 9 is the median, and 16 is the range."},{"id":"U2-244","section":"0.5","skill":"Data Interpretation","difficulty":1,"set":"u2b-lop-data","stimulus":{"type":"table","caption":"Number of words recalled (out of 25) by each participant","headers":["Structural group","Semantic group"],"rows":[["2","15"],["5","16"],["7","17"],["9","17"],["14","17"],["15","18"],["18","19"]]},"stem":"In a memory study, participants in the structural group studied a list of 25 words by deciding whether each word was printed in bold type. Participants in the semantic group studied the same list by deciding whether each word fit into a given sentence. The table shows the number of words each participant later recalled. What is the range of the semantic group's scores?","options":["2","17","4","19"],"answer":2,"rationale":"The range is the highest score minus the lowest score: 19 minus 15 equals 4. The value 17 is the mode and median, not the range."},{"id":"U2-259","section":"0.5","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Digit span (number of digits held in short-term memory)","headers":["Participant","Digits recalled"],"rows":[["1","5"],["2","9"],["3","6"],["4","7"],["5","4"],["6","8"],["7","7"],["8","10"],["9","6"],["10","5"]]},"stem":"Researchers measured the short-term memory capacity of 10 participants by reading strings of digits aloud and recording the longest string each participant could repeat back correctly. The results are shown in the table. What is the median number of digits held in participants' short-term memory?","options":["6","6.5","6.7","7"],"answer":1,"rationale":"Arranged in order, the scores are 4, 5, 5, 6, 6, 7, 7, 8, 9 and 10. With an even number of scores, the median is the mean of the two middle values, 6 and 7, which is 6.5. The value 6.7 is the mean, not the median."},{"id":"U2-263","section":"2.4","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"bar","title":"Percent of Words Recalled by Encoding Task","xLabel":"Encoding task","yLabel":"Percent of words recalled","categories":["Bold type? (structural)","Rhymes with \"train\"? (phonemic)","Fits the sentence? (semantic)"],"series":[{"name":"Recall","values":[18,42,71]}],"yMax":100},"stem":"In a memory study, participants answered a different question about each word on a list. For some words they judged whether the word was printed in bold type, for others whether it rhymed with \"train,\" and for others whether it fit into a given sentence. A surprise recall test followed. Which of the following conclusions is best supported by the graph?","options":["Recall rose with each deeper level of processing, from structural to phonemic to semantic.","Phonemic encoding produced the highest recall because it is the deepest level of processing.","The gain in recall from phonemic to semantic encoding was smaller than the gain from structural to phonemic encoding.","More than half of the words were recalled in each of the three conditions."],"answer":0,"rationale":"Recall climbed from 18 percent (structural) to 42 percent (phonemic) to 71 percent (semantic), matching the levels of processing model. The phonemic to semantic gain (29 points) was actually larger than the structural to phonemic gain (24 points)."},{"id":"U2-267","section":"0.5","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Weekly minutes using a retrieval-practice app and math quiz scores","headers":["Student","Minutes per week","Quiz score (%)"],"rows":[["1","10","52"],["2","20","55"],["3","30","61"],["4","40","60"],["5","50","68"],["6","60","72"],["7","70","75"],["8","80","81"]]},"stem":"A cognitive psychologist is interested in whether the amount of time students spend using a new retrieval-practice app is related to their scores on a math quiz. The data are shown in the table. Which description of a scatterplot best represents these data?","options":["Points that rise from the lower left to the upper right, clustered closely around a straight line","Points that fall from the upper left to the lower right, clustered closely around a straight line","Points scattered widely with no visible pattern","Points that rise and then fall, forming an upside-down U shape"],"answer":0,"rationale":"Quiz scores generally increase as app minutes increase, with only one small dip, so the data show a strong positive correlation. A pattern falling from upper left to lower right would indicate a negative correlation."},{"id":"U2-271","section":"2.6","skill":"Data Interpretation","difficulty":2,"set":"u2b-inventions","stimulus":{"type":"line","title":"Percent of Students Recalling Each Invention by List Position","xLabel":"Position in list","yLabel":"Percent of students recalling","series":[{"name":"Recall","points":[[1,88],[2,80],[3,72],[4,60],[5,38],[6,30],[7,26],[8,24],[9,22],[10,85],[11,24],[12,20],[13,22],[14,25],[15,28],[16,35],[17,50],[18,62],[19,74],[20,84]]}],"bands":[{"from":1,"to":4,"label":"Segment I"},{"from":5,"to":9,"label":"Segment II"},{"from":9.5,"to":10.5,"label":"Segment III"},{"from":11,"to":16,"label":"Segment IV"},{"from":17,"to":20,"label":"Segment V"}]},"stem":"Researchers at a science museum play the same recorded audio tour to two visiting school groups. The tour names 20 inventions in the order they were invented, from the wheel to the smartphone, and the 10th invention named is the airplane. A group of 12-year-olds hears the tour at 9 a.m., and a group of 16-year-olds hears it at 3 p.m. Each student then writes down as many of the inventions as possible. The graph shows recall for both groups combined. The results in Segment I of the graph are consistent with which of the following?","options":["The recency effect","The spacing effect","The primacy effect","The misinformation effect"],"answer":2,"rationale":"Segment I covers the first items on the list, which were recalled well, showing the primacy effect. The recency effect is the high recall at the end of the list in Segment V."},{"id":"U2-272","section":"2.6","skill":"Data Interpretation","difficulty":3,"set":"u2b-inventions","stimulus":{"type":"line","title":"Percent of Students Recalling Each Invention by List Position","xLabel":"Position in list","yLabel":"Percent of students recalling","series":[{"name":"Recall","points":[[1,88],[2,80],[3,72],[4,60],[5,38],[6,30],[7,26],[8,24],[9,22],[10,85],[11,24],[12,20],[13,22],[14,25],[15,28],[16,35],[17,50],[18,62],[19,74],[20,84]]}],"bands":[{"from":1,"to":4,"label":"Segment I"},{"from":5,"to":9,"label":"Segment II"},{"from":9.5,"to":10.5,"label":"Segment III"},{"from":11,"to":16,"label":"Segment IV"},{"from":17,"to":20,"label":"Segment V"}]},"stem":"Researchers at a science museum play the same recorded audio tour to two visiting school groups. The tour names 20 inventions in the order they were invented, from the wheel to the smartphone, and the 10th invention named is the airplane. A group of 12-year-olds hears the tour at 9 a.m., and a group of 16-year-olds hears it at 3 p.m. Each student then writes down as many of the inventions as possible. The graph shows recall for both groups combined. The results in which segment of the graph are inconsistent with the serial position effect?","options":["Segment I","Segment II","Segment III","Segment IV"],"answer":2,"rationale":"The serial position effect predicts poor recall in the middle of a list, but the airplane in Segment III was recalled by most students, likely because it is especially familiar and distinctive. Segment I shows the expected primacy effect, and Segments II and IV show the expected low recall for middle items."},{"id":"U2-275","section":"2.6","skill":"Data Interpretation","difficulty":1,"stimulus":{"type":"bar","title":"Average Recall by Position in a 21-Word List","xLabel":"Position of words in list","yLabel":"Percent recalled","categories":["Words 1 to 3","Words 4 to 6","Words 7 to 9","Words 10 to 12","Words 13 to 15","Words 16 to 18","Words 19 to 21"],"series":[{"name":"Percent recalled","values":[76,48,31,26,30,52,81]}],"yMax":100},"stem":"Participants heard a list of 21 unrelated words and immediately wrote down as many as they could remember. The graph shows the average percent recalled for words in each part of the list. The graph illustrates which of the following psychological concepts?","options":["Proactive interference","Chunking","Forgetting curve","Serial position effect"],"answer":3,"rationale":"Recall is highest at the beginning and end of the list and lowest in the middle, the U-shaped pattern of the serial position effect. The forgetting curve shows memory declining over time, not across list positions."},{"id":"U2-279","section":"2.4","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"bar","title":"Percent of Material Recalled by Practice Type and Test Delay","xLabel":"Time of test","yLabel":"Percent recalled","categories":["Immediately after studying","One week later"],"series":[{"name":"Massed practice","values":[78,28]},{"name":"Distributed practice","values":[74,55]}],"yMax":100},"stem":"Students learned the same material either in one long session (massed practice) or in several shorter sessions over a week (distributed practice). They were tested immediately after their final session and again one week later. Based on the data in the graph, what is the most appropriate conclusion?","options":["Massed practice produced better recall than distributed practice on both tests.","Distributed practice produced much better recall than massed practice on the immediate test.","Both groups forgot about the same amount of material over the week.","Distributed practice led to much less forgetting over the week than massed practice did."],"answer":3,"rationale":"The massed group dropped from 78 to 28 percent (a 50-point loss), while the distributed group dropped only from 74 to 55 percent (a 19-point loss), which is the spacing effect. On the immediate test the groups were similar, with massed practice slightly ahead."},{"id":"U2-283","section":"2.5","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"line","title":"Probability of Recall by Position in a 15-Item List","xLabel":"Position in list","yLabel":"Probability of recall","series":[{"name":"Recall","points":[[1,0.82],[2,0.7],[3,0.58],[4,0.45],[5,0.36],[6,0.31],[7,0.28],[8,0.27],[9,0.29],[10,0.32],[11,0.38],[12,0.48],[13,0.6],[14,0.72],[15,0.86]]}]},"stem":"Participants studied a 15-item list of grocery items and then tried to recall them immediately. The graph shows the probability of recall for each position in the list. The high recall for items 13 to 15 is best explained by which of the following?","options":["These items were still held in short-term memory when recall began.","These items received more rehearsal than any other items on the list.","These items were encoded semantically, while earlier items were not.","These items were retrieved using cues from the testing room."],"answer":0,"rationale":"The last items on a list are still in short-term memory at the moment of immediate recall, which produces the recency effect. Extra rehearsal explains the high recall of the first items (primacy), not the last ones."},{"id":"U2-287","section":"0.5","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Average number of participants (out of 40) who recalled each word","headers":["Words read","Average number recalling each word"],"rows":[["Words 1 to 4","31"],["Words 5 to 8","19"],["Words 9 to 12","12"],["Words 13 to 16","13"],["Words 17 to 20","29"]]},"stem":"To study whether a word's place in a sequence affects how well it is remembered, a researcher played a recording of 20 unrelated words to 40 participants, with one new word every three seconds. Participants then wrote down every word they could remember. The table shows the average number of participants who recalled each word in each part of the list. Which conclusion is best supported by the data?","options":["Words at the start and the end of the list were each recalled by more than twice as many participants as words 9 to 12.","Recall declined steadily from the first words to the last words.","The recency effect was stronger than the primacy effect in this study.","Words in the middle of the list were recalled by more than half of the participants."],"answer":0,"rationale":"Words 1 to 4 (31) and words 17 to 20 (29) were each recalled by more than twice as many participants as words 9 to 12 (12), the U-shaped pattern of the serial position effect. Recall for the first words was slightly higher than for the last, so recency was not stronger than primacy."},{"id":"U2-702","section":"2.7","skill":"Data Interpretation","difficulty":1,"stimulus":{"type":"line","title":"Percent of Studied Facts Retained Over 30 Days","xLabel":"Days since learning","yLabel":"Percent retained","series":[{"name":"Retention","points":[[0,100],[1,46],[2,39],[4,34],[7,30],[14,27],[30,24]]}]},"stem":"Volunteers at a science museum learned 50 facts about desert wildlife. Each volunteer was tested once, after one of several delays. The graph shows the average percent of facts retained at each delay. Which conclusion is best supported by the graph?","options":["Retention decreased by about the same amount each day across the 30 days","Most of the forgetting occurred within the first day, after which the rate of forgetting slowed","Forgetting did not begin until after the first week","Participants had forgotten nearly all of the facts by day 30"],"answer":1,"rationale":"Retention fell from 100 to 46 percent in the first day but only from 30 to 24 percent between day 7 and day 30. This rapid early drop that then levels off is the forgetting curve, and about a quarter of the facts were still retained at day 30."},{"id":"U2-716","section":"2.7","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"table","caption":"Mean number of French words recalled (out of 25) after each 30-minute activity","headers":["Group","Activity after studying the French words","Mean French words recalled"],"rows":[["1","Rested quietly","19"],["2","Solved math problems","17"],["3","Studied Italian vocabulary words","10"]]},"stem":"Dr. Lim randomly assigned students to three groups. All groups studied the same 25 French vocabulary words in the same way, spent 30 minutes on a different activity, and were then tested on the French words. Which conclusion is best supported by the results in the table?","options":["Learning similar new material after studying caused the most forgetting of the original material, consistent with retroactive interference","Earlier learning of French interfered with later learning of Italian, consistent with proactive interference","Any mental activity after studying produces the same amount of forgetting","Group 3 recalled fewer words because they failed to encode the French words in the first place"],"answer":0,"rationale":"All groups studied the French words the same way, so the differences reflect what happened afterward. Group 3, who learned similar new words, recalled far fewer French words than the other groups, showing that new learning disrupts recall of older learning, especially when the material is similar."},{"id":"U2-717","section":"2.7","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"bar","title":"Mean Recall of the Bird-Name List","xLabel":"Group","yLabel":"Bird names recalled (out of 20)","categories":["Studied fish names, then bird names","Studied bird names only"],"series":[{"name":"Mean recall","values":[9,15]}],"yMax":20},"stem":"In a memory study, one group of participants studied a list of 20 fish names and then a list of 20 bird names. A second group studied only the bird names. Both groups were then tested on the bird names. The graph shows the results. The difference between the groups best illustrates","options":["retroactive interference","encoding failure","proactive interference","source amnesia"],"answer":2,"rationale":"The group that learned fish names first recalled fewer of the later bird names, so earlier learning disrupted recall of newer learning. That is proactive interference; retroactive interference would require the later list to disrupt recall of the earlier one."},{"id":"U2-808","section":"2.8","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"table","caption":"Correlations for the New Reasoning Test (NRT)","headers":["Comparison","Correlation (r)"],"rows":[["NRT scores and NRT scores from the same students three weeks later","+0.89"],["Scores on odd-numbered items and scores on even-numbered items","+0.86"],["NRT scores and first-year university grades","+0.08"]]},"stem":"A university is deciding whether to use the New Reasoning Test (NRT) to select applicants who will earn high grades in their first year. A psychologist collects the data shown in the table. Which conclusion is best supported?","options":["The test has strong predictive validity but weak reliability","The test has weak reliability and weak predictive validity","The test is not standardized, because its correlations differ from one another","The test is reliable but has weak predictive validity for first-year grades"],"answer":3,"rationale":"The high test-retest and split-half correlations show the test gives consistent results, so it is reliable. The near-zero correlation with first-year grades shows it does not predict university success, so it lacks predictive validity for this purpose; a test can be reliable without being valid."},{"id":"U2-811","section":"2.8","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"bar","title":"Mean Puzzle Score by Instructions Given","xLabel":"Instructions before the puzzles","yLabel":"Mean score (out of 30)","categories":["Practice activity instructions","Natural talent instructions"],"series":[{"name":"Mean score","values":[21,15]}],"yMax":30},"stem":"Dr. Mbeki randomly assigns students from the same school to two conditions before they complete identical logic puzzles. One group is told the puzzles are a practice activity. The other group is told the puzzles measure natural talent and that students from their school usually score poorly. The graph shows the results. Which concept best explains the difference between the groups?","options":["Stereotype lift","Stereotype threat","The Flynn effect","Growth mindset"],"answer":1,"rationale":"Stereotype threat occurs when worry about confirming a negative stereotype about one's own group lowers performance. The students warned that their school usually scores poorly did worse on identical puzzles; stereotype lift is a boost from hearing that a different group is expected to do poorly."},{"id":"U2-816","section":"2.8","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Scores on the same standardized intelligence test, 500 students per town","headers":["Town","Mean score","Lowest score","Highest score"],"rows":[["Town P","101","68","134"],["Town Q","97","70","131"]]},"stem":"A researcher gives the same standardized intelligence test to 500 students in each of two towns. Town P has well-funded schools, while Town Q has fewer school resources and more families living in poverty. Which conclusion is best supported by the results in the table?","options":["The variation in scores within each town is much larger than the difference between the two town averages","The difference between the towns proves that students in Town Q have less inborn ability","Most students in Town P scored higher than most students in Town Q","The test cannot be reliable, because scores in both towns covered a wide range"],"answer":0,"rationale":"Scores within each town span more than 60 points, while the two means differ by only 4 points, so scores vary more within groups than between them. Because the towns also differ in poverty and school resources, the small gap cannot be attributed to inborn ability."},{"id":"U3-005","section":"0.5","skill":"Data Interpretation","difficulty":2,"set":"u3a_hand","stimulus":{"type":"table","caption":"Dr. Okafor's data: hand length and reading speed of children aged 5 to 11","headers":["Child","Hand length (cm)","Reading speed (words per minute)"],"rows":[["1","11.0","20"],["2","11.8","34"],["3","12.5","41"],["4","13.1","55"],["5","13.9","62"],["6","14.6","78"],["7","15.2","85"],["8","16.0","97"]]},"stem":"Dr. Okafor measured the hand length and the reading speed of 8 children between the ages of 5 and 11 during a single school visit. She did not change anything about the children's lives or classes. Her data are shown in the table. Which of the following best describes the relationship shown in the data?","options":["A positive correlation","A negative correlation","No correlation","A bimodal distribution"],"answer":0,"rationale":"As hand length increases, reading speed also increases, so the two variables move in the same direction, which is a positive correlation. A negative correlation would require one variable to fall as the other rises."},{"id":"U3-015","section":"3.2","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"line","title":"Average hearing threshold by sound frequency and age group","xLabel":"Sound frequency (Hz)","yLabel":"Hearing threshold (decibels needed to detect the tone)","series":[{"name":"Ages 20 to 29","points":[[250,5],[500,5],[1000,5],[2000,6],[4000,8],[8000,10]]},{"name":"Ages 50 to 59","points":[[250,8],[500,9],
