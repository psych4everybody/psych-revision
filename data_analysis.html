[1000,10],[2000,15],[4000,25],[8000,35]]},{"name":"Ages 75 to 84","points":[[250,15],[500,18],[1000,22],[2000,30],[4000,45],[8000,60]]}]},"stem":"Audiologists measured hearing thresholds, the softest level in decibels at which a tone can be detected, for adults in three age groups. A higher threshold means a louder sound is needed before the person can hear it. Which conclusion is best supported by the graph?","options":["Adults aged 20 to 29 need louder sounds than adults aged 75 to 84 to detect an 8,000 Hz tone.","Hearing at 250 Hz is completely unaffected by age.","Adults aged 75 to 84 are unable to hear any 8,000 Hz tone, no matter how loud it is.","The difference between the age groups is largest at the highest frequencies."],"answer":3,"rationale":"At 250 Hz the groups differ by only 10 decibels, but at 8,000 Hz the oldest group needs 50 more decibels than the youngest, showing that age-related hearing loss mainly affects high-pitched sounds. The oldest group can still hear an 8,000 Hz tone if it reaches about 60 decibels."},{"id":"U3-018","section":"0.5","skill":"Data Interpretation","difficulty":1,"stem":"For 500 newborns, Dr. Lim records how many cigarettes each mother smoked per day during pregnancy and the baby's birth weight. To display the relationship between these two measures, Dr. Lim should use a","options":["histogram","pie chart","scatterplot","frequency polygon"],"answer":2,"rationale":"A scatterplot shows each participant as a point on two variables, which displays a correlation. Histograms and frequency polygons show how often scores occur on a single variable."},{"id":"U3-042","section":"0.5","skill":"Data Interpretation","difficulty":2,"stem":"Dr. Kapoor studies adults between the ages of 30 and 80. She predicts that as age increases, scores on a balance-and-agility test will decrease, and that this pattern will be very consistent across participants. Which correlation coefficient would best match her prediction?","options":["+0.85","-0.10","+0.05","-0.85"],"answer":3,"rationale":"A strong negative correlation has a coefficient close to -1.00, showing that as one variable rises the other falls consistently. A coefficient of +0.85 is equally strong but in the wrong direction, and values near zero show almost no relationship."},{"id":"U3-046","section":"0.5","skill":"Data Interpretation","difficulty":2,"stem":"A researcher examines whether the month in which children were born is related to their scores on a puzzle-solving task at age 10. Which of the following descriptions of a scatterplot would represent the weakest possible correlation between these variables?","options":["The points cluster tightly around a line that rises from left to right.","The points cluster tightly around a line that falls from left to right.","The points cluster loosely around a line that falls gently from left to right.","The points are spread evenly across the graph, and the line of best fit is flat."],"answer":3,"rationale":"When points are scattered with no pattern and the best-fit line is flat, the correlation coefficient is near zero, the weakest possible relationship. Tight clustering around any sloped line, rising or falling, indicates a strong correlation."},{"id":"U3-048","section":"0.5","skill":"Data Interpretation","difficulty":2,"stem":"On a quiz about Piaget's stages of cognitive development, most students in a class earned high scores, while only a few students earned low scores. The distribution of quiz scores is best described as","options":["normally distributed","positively skewed","negatively skewed","bimodal"],"answer":2,"rationale":"In a negatively skewed distribution, most scores are bunched at the high end and the tail stretches toward the few low scores. A positive skew would have most scores at the low end."},{"id":"U3-071","section":"3.4","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"line","title":"Average fluid and crystallized intelligence scores by age","xLabel":"Age (years)","yLabel":"Average score (0 to 100)","series":[{"name":"Fluid intelligence","points":[[10,40],[20,70],[30,75],[40,68],[50,60],[60,52],[70,44],[80,36]]},{"name":"Crystallized intelligence","points":[[10,30],[20,55],[30,68],[40,74],[50,78],[60,80],[70,79],[80,76]]}]},"stem":"Researchers compared average fluid and crystallized intelligence scores of people at different ages, as shown in the graph. Which conclusion is best supported by the data?","options":["Fluid intelligence reaches its highest level after age 60.","Both types of intelligence decline at the same rate after age 40.","Crystallized intelligence reaches its highest level at age 20.","From age 40 onward, crystallized intelligence scores are higher than fluid intelligence scores."],"answer":3,"rationale":"Fluid scores peak around age 30 and then fall, while crystallized scores keep rising until about 60 and stay high, so crystallized scores exceed fluid scores at every age from 40 to 80. The two lines clearly decline at different rates after 40."},{"id":"U3-210","section":"3.6","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"bar","title":"Peer Social Competence at Age 7 by Infant Attachment Group","xLabel":"Attachment group","yLabel":"Mean social competence score (1 to 10)","categories":["Group W","Group X","Group Y","Group Z"],"series":[{"name":"Mean score","values":[4.3,7.9,3.6,2.7]}],"yMax":10},"stem":"A researcher rated the social competence of 7-year-olds who had been classified by attachment style as infants. Higher scores mean the child cooperated, shared and resolved conflicts with peers more successfully. The attachment group labels were removed from the graph. Based on research on attachment, which attachment style does Group X most likely represent?","options":["Avoidant","Secure","Anxious","Disorganized"],"answer":1,"rationale":"Group X has by far the highest social competence score, and secure attachment in infancy predicts better social competence later in childhood. The insecure styles (avoidant, anxious and disorganized) are associated with weaker peer relationships."},{"id":"U3-239","section":"0.5","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Parental Warmth Scores (1 to 20)","headers":["Parent","Score"],"rows":[["1","14"],["2","9"],["3","17"],["4","6"],["5","12"],["6","15"],["7","11"],["8","18"],["9","8"],["10","13"]]},"stem":"Ten parents completed a questionnaire measuring parental warmth. Scores can range from 1 (very low warmth) to 20 (very high warmth). The table shows each parent's score. What is the range of the scores?","options":["12.5","18","12","6"],"answer":2,"rationale":"The range is the highest score minus the lowest score: 18 minus 6 equals 12. A value of 12.5 is the median (the average of the two middle scores, 12 and 13), and 18 and 6 are just the highest and lowest scores."},{"id":"U3-243","section":"0.5","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"bar","title":"Weekly Hours at Part-Time Jobs (Graduating Seniors)","xLabel":"Hours per week","yLabel":"Number of seniors","categories":["0 to 4","5 to 9","10 to 14","15 to 19","20 to 24","25 or more"],"series":[{"name":"Seniors","values":[48,31,17,9,5,2]}]},"stem":"Students in a psychology class asked graduating seniors how many hours per week they work at part-time jobs. The results, shown in the graph, form a positively skewed distribution. Which statistic can be identified precisely from the graph without doing any calculations?","options":["Mean","Median","Mode","Standard deviation"],"answer":2,"rationale":"The mode is the most frequent score, so it can be read directly as the category with the highest frequency (0 to 4 hours here). The mean, median and standard deviation all require counting or calculating from the full set of scores."},{"id":"U3-273","section":"0.5","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Mean Fear Ratings During an Elevator Ride (1 to 10)","headers":["Point in ride","Control group","Counterconditioning group"],"rows":[["Before entering","5","5"],["Doors closing","8","4"],["Rising","9","3"],["Stopping","8","3"],["Exiting","6","2"]]},"stem":"A therapist tests a relaxation-based counterconditioning program for people who are afraid of elevators. One group completes the program and a control group does not. The table shows each group's mean fear rating (1 to 10, higher numbers mean more fear) at five points during an elevator ride. Which statement is accurate based on the data in the table?","options":["The mode of the control group's ratings is 9.","The median of the control group's ratings is 9.","The range of the counterconditioning group's ratings is 5.","The mean of the counterconditioning group's ratings is 3.4."],"answer":3,"rationale":"The counterconditioning group's ratings sum to 17 (5 + 4 + 3 + 3 + 2), and 17 divided by 5 is 3.4. The control group's mode and median are both 8, and the counterconditioning group's range is 5 minus 2, which is 3."},{"id":"U3-276","section":"3.7","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"line","title":"Strength of Conditioned Eye-Blink Response","xLabel":"Trial","yLabel":"Response strength (0 to 10)","series":[{"name":"Conditioned response","points":[[1,1],[2,3],[3,5],[4,7],[5,8],[6,9],[7,9.5],[8,10],[9,9],[10,7],[11,5],[12,3.5],[13,2],[14,1.5],[15,1],[16,0.5],[17,5],[18,3],[19,1.5],[20,0.5]]}],"bands":[{"from":1,"to":8,"label":"Phase 1"},{"from":9,"to":16,"label":"Phase 2"},{"from":17,"to":20,"label":"Phase 3"}]},"stem":"A researcher measured the strength of a conditioned eye-blink response across 20 trials in three phases. In Phase 1 a tone was paired with a puff of air; in Phase 2 the tone was presented alone; Phase 3 began after a 24-hour rest, with the tone again presented alone. Which sequence of concepts does the graph show across the three phases?","options":["Acquisition, extinction, spontaneous recovery","Generalization, extinction, higher-order conditioning","Acquisition, habituation, discrimination","Extinction, acquisition, generalization"],"answer":0,"rationale":"The response grows while the tone is paired with the air puff (acquisition), weakens when the tone is presented alone (extinction), and then partly reappears after a rest before fading again (spontaneous recovery)."},{"id":"U3-812","section":"3.8","skill":"Data Interpretation","difficulty":1,"stimulus":{"type":"table","caption":"Reward rules for four phone apps","headers":["App","Reward rule"],"rows":[["StepUp","A badge is earned for the first step counted after each full hour has passed"],["LuckySpin","A prize is won after an unpredictable number of spins, about 1 in every 20 on average"],["NewsPing","A new article becomes available at unpredictable times and is seen on the next check"],["SnackStop","A free snack is earned after every 6 purchases"]]},"stem":"The table describes the reward rules for four phone apps. Which app uses a fixed-ratio schedule of reinforcement?","options":["StepUp","LuckySpin","NewsPing","SnackStop"],"answer":3,"rationale":"SnackStop gives a reward after a set number of responses (every 6 purchases), which is a fixed-ratio schedule. LuckySpin is also based on the number of responses, but the number is unpredictable, which makes it variable-ratio."},{"id":"U3-816","section":"3.8","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"line","title":"Cumulative lever presses during one 15-minute session","xLabel":"Time (minutes)","yLabel":"Cumulative lever presses","series":[{"name":"Cumulative presses","points":[[0,0],[1,2],[2,5],[3,12],[4,25],[5,45],[6,46],[7,49],[8,55],[9,66],[10,83],[11,85],[12,89],[13,98],[14,115],[15,145]]}],"bands":[{"from":4.9,"to":5.1,"label":"R"},{"from":9.9,"to":10.1,"label":"R"},{"from":14.9,"to":15.0,"label":"R"}]},"stem":"A researcher recorded the cumulative number of lever presses made by a rat during a 15-minute session. The shaded bands labeled R mark the moments when a food pellet was delivered. Based on the pattern of responding in the graph, which reinforcement schedule was the rat most likely on?","options":["Fixed-interval","Fixed-ratio","Variable-ratio","Variable-interval"],"answer":0,"rationale":"Pellets came at equal time intervals while the number of presses between them varied, and the line flattens right after each pellet and then curves upward more and more steeply until the next one, producing the scalloped shape typical of a fixed-interval schedule. Variable schedules produce a fairly straight, steady line because the next reward cannot be predicted."},{"id":"U3-817","section":"3.8","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"bar","title":"Pecking rate by reinforcement schedule","xLabel":"Training schedule","yLabel":"Responses per hour","categories":["Continuous","Fixed-ratio 10","Variable-ratio 10"],"series":[{"name":"Final training session","values":[300,900,1100]},{"name":"First hour of extinction","values":[60,250,700]}],"yMax":1200},"stem":"Dr. Haddad trained three groups of pigeons to peck a key for grain, each on a different schedule. The graph shows each group's response rate in the final training session and in the first hour of extinction, when pecking no longer produced grain. Which conclusion is best supported by the data?","options":["Continuous reinforcement produced the highest response rate during training","The variable-ratio group lost the largest number of responses per hour when extinction began","Partial reinforcement, especially on a variable-ratio schedule, produced pecking that was more resistant to extinction than continuous reinforcement","The fixed-ratio group kept a larger share of its training response rate during extinction than the variable-ratio group"],"answer":2,"rationale":"During extinction the variable-ratio group kept about 64 percent of its training rate (700 of 1,100), compared with about 28 percent for fixed-ratio and 20 percent for continuous, showing the partial reinforcement effect. The fixed-ratio group, not the variable-ratio group, had the largest raw drop (650 responses per hour)."},{"id":"U3-818","section":"3.8","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Homework assignments completed (out of 5)","headers":["Student","Week before tokens","Week with tokens"],"rows":[["Aisha","2","4"],["Bilal","1","4"],["Carlos","3","5"],["Dina","2","3"],["Eun-ji","2","4"]]},"stem":"Ms. Bautista introduced a classroom system in which students earn tokens for each homework assignment they complete, and tokens can later be exchanged for extra free-reading time. The table shows the number of assignments (out of 5) that five students completed in a week before and a week during the system. Which statement best describes and interprets the data?","options":["The mean rose from 2.0 to 4.0, which shows that the tokens acted as primary reinforcers","The mean rose from 2.0 to 4.0, which is consistent with the tokens acting as secondary reinforcers that strengthened homework completion","The mean rose from 2.0 to 3.0, which is consistent with the tokens acting as secondary reinforcers","The mean stayed the same, but the range of scores became smaller during the token week"],"answer":1,"rationale":"The before scores total 10 and the during scores total 20, so the means are 2.0 and 4.0. Tokens have no value on their own and gain it through what they can be exchanged for, which makes them secondary reinforcers rather than primary ones."},{"id":"U3-908","section":"3.9","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"bar","title":"Teens who used the model's shortcut","xLabel":"What happened to the model in the video","yLabel":"Percentage of teens (%)","categories":["Praised","No consequences","Criticized"],"series":[{"name":"Used the shortcut","values":[78,52,18]}],"yMax":100},"stem":"Dr. Ferreira showed three groups of teenagers a video of a peer solving a puzzle using an unusual shortcut. In one version the peer was praised, in another the peer was criticized for not following the standard steps, and in the third there were no consequences. Each teen then solved a similar puzzle. Which conclusion is best supported by the graph?","options":["The teens in the criticized condition were directly punished, which lowered their use of the shortcut","Observing the consequences a model received changed how often the teens copied the model's method","Use of the shortcut was about the same in every group, so the model's consequences had little effect","Imitation was highest when the model received no consequences at all"],"answer":1,"rationale":"Shortcut use was highest after seeing the model praised (78 percent) and lowest after seeing the model criticized (18 percent), which fits vicarious reinforcement and vicarious punishment. The teens themselves received no consequences, so this was not direct punishment."},{"id":"U3-914","section":"3.9","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"line","title":"Mean maze errors per day","xLabel":"Day","yLabel":"Mean number of errors","series":[{"name":"Food every day","points":[[1,10],[2,8.5],[3,7],[4,6],[5,5],[6,4.2],[7,3.6],[8,3.2],[9,3],[10,2.8],[11,2.7],[12,2.6]]},{"name":"Never food","points":[[1,10],[2,9.5],[3,9],[4,8.6],[5,8.2],[6,7.9],[7,7.6],[8,7.4],[9,7.2],[10,7],[11,6.9],[12,6.8]]},{"name":"Food from day 7","points":[[1,10],[2,9.4],[3,9],[4,8.5],[5,8.1],[6,7.8],[7,7.5],[8,3],[9,2.8],[10,2.7],[11,2.6],[12,2.5]]}]},"stem":"Dr. Nakamura ran three groups of mice through the same maze once a day. One group found food at the end every day, one never found food, and one first found food at the end of the day 7 run. Which explanation best accounts for the sharp drop in errors for the third group on day 8?","options":["The food on day 7 acted as a primary reinforcer that taught the mice the whole maze in a single trial","The mice suddenly gained insight into the maze without having learned anything earlier","The mice had learned the layout of the maze on the unrewarded days, but showed it only once food gave them a reason to","The mice in the third group were copying the mice that had found food every day"],"answer":2,"rationale":"The third group's errors fell almost at once to the level of the always-rewarded group, which is too fast to be new learning from one reward. This shows latent learning: the mice had formed a cognitive map earlier and used it once there was an incentive."},{"id":"U3-915","section":"3.9","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"table","caption":"Number of the model's 15 building steps copied by each child","headers":["Child","Same-age model group","Adult model group"],"rows":[["1","6","2"],["2","7","3"],["3","5","15"],["4","8","2"],["5","6","3"],["6","7","2"]]},"stem":"Dr. Siddiqui showed children a video of either a same-age child or an adult building a tower using 15 specific steps. She then counted how many of the 15 steps each child copied. Which statement is best supported by the data in the table?","options":["The adult-model group had the higher mean, which suggests adults are more effective models for children","The two groups have the same range, so the variability of the scores does not differ","The adult-model group has a mode of 3, which is higher than its median","The median is a better summary of the adult-model group because of one extreme score, and both the mean and the median show more imitation of the same-age model"],"answer":3,"rationale":"The same-age group has a mean and median of 6.5, while the adult group has a mean of 4.5 and a median of 2.5; the score of 15 pulls the adult mean up, so the median describes that group better. Either way, children copied the more similar model more, as social learning theory predicts."},{"id":"U4-012","section":"0.5","skill":"Data Interpretation","difficulty":2,"set":"U4A-SWIM","stimulus":{"type":"passage","text":"Dr. Okafor, a sport psychologist, studied 10 members of a university swim team. Each swimmer completed an Attribution Questionnaire (scores from 10 to 50) about what they think determines their race results: their own training and effort, or outside factors such as luck, lane assignment and the officials. A low score means a swimmer mostly credits their own training and effort; a high score means the swimmer mostly credits outside factors. Dr. Okafor then compared each swimmer's score with the number of personal-best times the swimmer set during the season. Results (questionnaire score, personal bests): 14, 8; 18, 9; 21, 6; 25, 7; 28, 5; 32, 6; 35, 3; 39, 4; 43, 2; 47, 3."},"stem":"Based on the study described, which correlation coefficient is most consistent with the relationship between Attribution Questionnaire scores and the number of personal-best times?","options":["+0.88","-0.06","-0.35","-0.90"],"answer":3,"rationale":"As questionnaire scores rise, personal bests fall fairly consistently, which indicates a strong negative correlation, so -0.90 fits best. A value of -0.35 would describe a weak negative trend with much more scatter, and a value near zero would mean no relationship."},{"id":"U4-013","section":"0.6","skill":"Data Interpretation","difficulty":2,"set":"U4A-SWIM","stimulus":{"type":"passage","text":"Dr. Okafor, a sport psychologist, studied 10 members of a university swim team. Each swimmer completed an Attribution Questionnaire (scores from 10 to 50) about what they think determines their race results: their own training and effort, or outside factors such as luck, lane assignment and the officials. A low score means a swimmer mostly credits their own training and effort; a high score means the swimmer mostly credits outside factors. Dr. Okafor then compared each swimmer's score with the number of personal-best times the swimmer set during the season. Results (questionnaire score, personal bests): 14, 8; 18, 9; 21, 6; 25, 7; 28, 5; 32, 6; 35, 3; 39, 4; 43, 2; 47, 3."},"stem":"Based on the study described, which of the following is the most accurate interpretation of the results?","options":["Believing that luck and officials determine race results causes swimmers to set fewer personal bests.","Swimmers who more strongly attributed their results to outside factors tended to set fewer personal bests.","Swimmers who set more personal bests trained more hours than swimmers who set fewer personal bests.","Attribution scores and personal bests were unrelated, because each swimmer trained a different amount."],"answer":1,"rationale":"The data show a negative correlation: higher external attribution scores go with fewer personal bests. Because this is a correlational study, it cannot show that the beliefs cause the poorer results, and training hours were never measured."},{"id":"U4-028","section":"4.1","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"bar","title":"Explanations Given in Reviews of Late Deliveries","xLabel":"Type of explanation","yLabel":"Percentage of reviews","categories":["Dispositional","Situational"],"series":[{"name":"Reviews","values":[78,22]}],"yMax":100},"stem":"Dr. Mensah analyzed 500 online customer reviews written about late food deliveries in her city. She coded each reviewer's explanation for the lateness as either dispositional (for example, \"the driver is lazy\") or situational (for example, \"traffic was heavy\"). Based on the graph of her findings, which of the following concepts is being demonstrated by the reviewers?","options":["Self-serving bias","Optimistic explanatory style","Fundamental attribution error","Belief perseverance"],"answer":2,"rationale":"Most reviewers explained the drivers' lateness with personal traits rather than circumstances, which is the fundamental attribution error. The self-serving bias would apply to how reviewers explain their own outcomes, not a driver's."},{"id":"U4-029","section":"0.6","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Pessimism Scores and Stress Symptoms","headers":["Participant","Pessimism score (1 to 10)","Stress symptoms in one month"],"rows":[["1","2","1"],["2","3","3"],["3","4","2"],["4","5","4"],["5","6","6"],["6","7","5"],["7","8","7"],["8","9","8"]]},"stem":"A researcher measured explanatory style in eight adults. Higher pessimism scores mean the person tends to explain bad events as permanent, personal and affecting all areas of life. She also counted each person's stress-related symptoms over one month. Which conclusion is best supported by the data in the table?","options":["People who explain bad events more pessimistically tend to report fewer stress symptoms.","Pessimism and stress symptoms are unrelated, because two participants do not fit a perfect pattern.","People who explain bad events more pessimistically tend to report more stress symptoms.","Becoming more pessimistic causes people to develop more stress symptoms."],"answer":2,"rationale":"As pessimism scores rise, the number of symptoms generally rises too, which is a strong positive correlation even though a couple of participants break the exact pattern. Correlational data like these cannot show that pessimism causes the symptoms."},{"id":"U4-047","section":"4.1","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"bar","title":"Mean Liking Rating by Number of Exposures","xLabel":"Number of times the logo appeared in the slideshow","yLabel":"Mean liking rating (1 to 7)","categories":["0","2","5","10","25"],"series":[{"name":"Mean liking","values":[3.1,3.6,4.2,4.8,5.3]}],"yMax":7},"stem":"In a laboratory study, Dr. Nakamura showed participants a rapid slideshow of made-up company logos that none of them had seen before. Each logo appeared 0, 2, 5, 10 or 25 times. Afterward, participants rated how much they liked each logo on a scale from 1 (dislike very much) to 7 (like very much). The results are shown in the graph. Which of the following best explains the pattern of results?","options":["The door-in-the-face technique","The mere-exposure effect","Sensory adaptation","Social facilitation"],"answer":1,"rationale":"Liking ratings rise steadily as the number of exposures increases, which is the mere-exposure effect. Sensory adaptation would make participants respond less to a repeated stimulus, not like it more."},{"id":"U4-048","section":"4.1","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"table","caption":"Percentage of Riders Who Agree with Each Statement","headers":["Statement","Company X riders (n = 120)","Company Y riders (n = 120)"],"rows":[["I can choose which shifts I work.","82%","21%"],["How much I earn depends mainly on how hard I work.","76%","30%"],["Whether I get a bonus is mostly a matter of luck.","18%","71%"],["I feel exhausted by my job in most weeks.","24%","68%"]]},"stem":"An industrial-organizational psychologist surveyed food-delivery riders at two companies about their jobs. The results are shown in the table. Which of the following concepts best accounts for the pattern of responses from Company Y riders?","options":["Social loafing","Optimistic explanatory style","External locus of control","Self-serving bias"],"answer":2,"rationale":"Company Y riders believe their shifts, pay and bonuses are controlled by luck or by the company rather than by their own actions, which reflects an external locus of control. Feeling a lack of control is linked to higher stress and burnout, which matches their higher exhaustion."},{"id":"U4-051","section":"0.5","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"bar","title":"Implicit Attitude Scores in Three Samples of First-Year Students","xLabel":"Implicit attitude score (1 = strong preference for own university's teams, 7 = strong preference for rival university's teams)","yLabel":"Number of students","categories":["1","2","3","4","5","6","7"],"series":[{"name":"Sample A","values":[0,2,8,20,8,2,0]},{"name":"Sample B","values":[5,6,6,6,6,6,5]},{"name":"Sample C","values":[0,1,6,26,6,1,0]}],"yMax":30},"stem":"A researcher measured implicit attitudes toward the sports teams of a rival university in three samples of 40 first-year students each. The frequency distributions are shown in the graph, and all three samples have a mean of 4. Which sample has the smallest standard deviation?","options":["Sample A","Sample B","Sample C","The standard deviations are equal, because all three samples have the same mean."],"answer":2,"rationale":"Sample C has the most scores packed at the center (26 of 40 students scored 4), so its scores vary least around the mean. Sample B is spread almost evenly across the scale, and having the same mean says nothing about how spread out scores are."},{"id":"U4-074","section":"4.2","skill":"Data Interpretation","difficulty":2,"set":"U4A-GIFT","stimulus":{"type":"table","caption":"Mean Desirability Ratings (1 = not desirable, 10 = very desirable)","headers":["Water bottle","Rating before the choice","Rating after the choice"],"rows":[["Bottle the participant chose","6.2","7.9"],["Bottle the participant gave up","6.0","4.6"]]},"stem":"Dr. Lindqvist recruited 12 volunteers, all members of one university hiking club. Each volunteer rated eight reusable water bottle designs. The researcher then offered each volunteer a free bottle, but only as a choice between two designs that the volunteer had rated almost equally. Immediately after choosing, volunteers rated those two designs again. The table shows the mean ratings. These results are best explained by which of the following?","options":["Cognitive dissonance","The mere-exposure effect","The halo effect","Belief perseverance"],"answer":0,"rationale":"After choosing between two similar options, volunteers rated the chosen bottle higher and the rejected bottle lower, which reduces the dissonance of giving up an attractive option. Volunteers rerated the bottles immediately, with no extra exposure to the chosen one, so the mere-exposure effect cannot explain the change."},{"id":"U4-100","section":"4.3","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"table","caption":"Percentage of Darts Hitting the Target Zone","headers":["Group","Throwing alone","Throwing while four people watch"],"rows":[["Experienced players","68%","77%"],["Beginner players","34%","22%"]]},"stem":"A sport psychologist records how accurately experienced and beginner darts players throw, first while practicing alone and then while four spectators watch closely. The results are shown in the table. Which of the following principles best accounts for these results?","options":["Social facilitation","Obedience","Social loafing","Groupthink"],"answer":0,"rationale":"The presence of others increases arousal, which improves performance on well-learned tasks but worsens performance on tasks that are not yet mastered. That is why experienced players improved while beginners got worse in front of spectators."},{"id":"U4-212","section":"0.5","skill":"Data Interpretation","difficulty":3,"set":"u4b_homeaway","stimulus":{"type":"bar","title":"Number of Wins at Home and Away, by Team","xLabel":"Team","yLabel":"Number of wins","categories":["Volleyball","Cricket","Handball"],"series":[{"name":"Home matches","values":[15,12,7]},{"name":"Away matches","values":[9,10,9]}]},"stem":"Dr. Mensah, a sports psychologist, attended every match played by three teams at a secondary school during one season. Without interacting with the players, she recorded whether each match was played at home or away and whether the team won. Her results are shown in the graph. Which statement about the graph is accurate?","options":["Every team won more matches at home than away.","The teams won more matches away in total than at home.","The volleyball team shows the largest gap between its home wins and its away wins.","The median number of away wins across the three teams is 10."],"answer":2,"rationale":"Volleyball's gap is 6 (15 home, 9 away), compared with 2 for cricket and 2 for handball. Handball won more away matches than home matches, the teams won 34 home matches versus 28 away in total, and away wins of 9, 9 and 10 have a median of 9."},{"id":"U4-231","section":"4.3","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"bar","title":"Average Pulling Force per Person in a Rope-Pulling Task","xLabel":"Number of people pulling together","yLabel":"Force per person (% of solo effort)","categories":["1","2","4","8"],"series":[{"name":"Force per person","values":[100,89,76,64]}],"yMax":100},"stem":"In a study, blindfolded participants pulled on a rope either alone or in teams, and the researchers measured how hard each person pulled. Which concept does the pattern in the graph illustrate?","options":["Social loafing","Social facilitation","Deindividuation","Groupthink"],"answer":0,"rationale":"Each person's effort falls as the team grows, which is social loafing: people exert less effort when their individual contribution is pooled with others. Social facilitation would show improved performance in the presence of others."},{"id":"U4-232","section":"4.3","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"line","title":"Words Written per Person on a Shared Report","xLabel":"Number of people on the team","yLabel":"Average words written per person","series":[{"name":"Only team total credited","points":[[1,600],[2,540],[3,470],[4,420],[5,380],[6,350]]},{"name":"Each person's work credited","points":[[1,600],[2,595],[3,600],[4,590],[5,598],[6,594]]}]},"stem":"Students wrote sections of a shared report in teams of different sizes. In one condition, only the team's total was credited; in the other, each person's section was credited separately. Which principle is best represented in the graph?","options":["Deindividuation","Conformity","Social facilitation","Social loafing"],"answer":3,"rationale":"Effort per person drops as teams grow only when individual work is not identifiable, which is the hallmark of social loafing. When each person's contribution was credited, effort stayed level."},{"id":"U4-233","section":"4.3","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"line","title":"Conformity by Size of the Unanimous Majority (Hypothetical Replication)","xLabel":"Number of people giving the same wrong answer","yLabel":"Percentage of trials on which participant conformed","series":[{"name":"Conformity","points":[[1,3],[2,13],[3,31],[4,35],[5,34],[6,35],[7,34],[8,35]]}]},"stem":"A research team repeated a line-judgment conformity task, varying how many confederates unanimously gave the same wrong answer before the participant responded. Which is the best interpretation of the results in the graph?","options":["Conformity rises steadily with every additional person in the majority.","Conformity rises as the majority grows to about three or four people and then levels off.","Participants conformed on most trials once the majority reached four people.","Conformity decreases once the majority grows beyond two people."],"answer":1,"rationale":"The line climbs from one to about four confederates and then stays flat near 35 percent, so adding more people has little extra effect, and conformity never reaches a majority of trials. This matches the classic finding that conformity levels off after a small majority."},{"id":"U4-234","section":"4.3","skill":"Data Interpretation","difficulty":1,"stimulus":{"type":"bar","title":"Participants Who Helped Within Two Minutes","xLabel":"Number of other people present","yLabel":"Percentage who helped","categories":["0","1","4"],"series":[{"name":"Helped","values":[85,62,31]}],"yMax":100},"stem":"Participants heard someone in the next room fall and cry out in pain. The graph shows how often participants helped depending on how many other people were present. Which concept does the graph illustrate?","options":["Social facilitation","The reciprocity norm","The bystander effect","The false consensus effect"],"answer":2,"rationale":"Helping becomes less likely as more people are present, which is the bystander effect. The reciprocity norm concerns returning favors, not the number of onlookers."},{"id":"U4-235","section":"4.2","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"New Gym Memberships Signed per Month","headers":["Month","Reem's memberships","Pablo's memberships"],"rows":[["January","42","25"],["February","38","29"],["March","45","22"],["April","40","27"]]},"stem":"Reem and Pablo sell gym memberships. Reem first asks each visitor to commit to a two-year premium membership; when the visitor refuses, she offers a three-month basic plan. Pablo hangs posters of a famous athlete around the gym and lets visitors decide on their own. Based on the table, which persuasion technique was the more successful strategy?","options":["The foot-in-the-door technique","The peripheral route to persuasion","The door-in-the-face technique","The central route to persuasion"],"answer":2,"rationale":"Reem signed more members every month, and her method of following a large refused request with a smaller one is the door-in-the-face technique. Pablo's celebrity posters use the peripheral route, which produced fewer sign-ups."},{"id":"U4-236","section":"0.5","skill":"Data Interpretation","difficulty":2,"set":"u4b_helptime","stimulus":{"type":"table","caption":"Food Court Spill Observations","headers":["Trial","Diners seated nearby","Seconds until someone helped"],"rows":[["1","2","8"],["2","9","47"],["3","1","5"],["4","6","31"],["5","4","19"],["6","12","64"],["7","3","14"],["8","7","36"]]},"stem":"Psychology students carried out a field study in a mall food court. On each of eight trials, a team member \"accidentally\" spilled a tray of drinks beside a table, and observers counted how many diners were seated nearby and timed how long it took before any diner offered to help. The results are shown in the table. What is the range of the helping times across all eight trials?","options":["28 seconds","59 seconds","64 seconds","25 seconds"],"answer":1,"rationale":"The range is the highest value minus the lowest value: 64 minus 5 equals 59 seconds. Twenty-eight seconds is the mean helping time, and 25 seconds is the median."},{"id":"U4-238","section":"4.3","skill":"Data Interpretation","difficulty":1,"set":"u4b_helptime","stimulus":{"type":"table","caption":"Food Court Spill Observations","headers":["Trial","Diners seated nearby","Seconds until someone helped"],"rows":[["1","2","8"],["2","9","47"],["3","1","5"],["4","6","31"],["5","4","19"],["6","12","64"],["7","3","14"],["8","7","36"]]},"stem":"Psychology students carried out a field study in a mall food court. On each of eight trials, a team member \"accidentally\" spilled a tray of drinks beside a table, and observers counted how many diners were seated nearby and timed how long it took before any diner offered to help. The results are shown in the table. Which concept best explains the pattern in the table?","options":["Deindividuation","Diffusion of responsibility","Social facilitation","The reciprocity norm"],"answer":1,"rationale":"As more diners were present, each one felt less personally responsible for acting, so help came more slowly. Social facilitation is improved performance on well-learned tasks in front of others, and deindividuation is a loss of self-awareness and restraint in a crowd, not delayed helping."},{"id":"U4-239","section":"0.5","skill":"Data Interpretation","difficulty":2,"set":"u4b_skew","stimulus":{"type":"bar","title":"Quiz Scores on Group Influence","xLabel":"Score (out of 10)","yLabel":"Number of students","categories":["3","4","5","6","7","8","9","10"],"series":[{"name":"Students","values":[1,1,2,3,5,8,10,12]}]},"stem":"The graph shows the scores of 42 students on a 10-point quiz about how groups influence individual behavior. Given the shape of this distribution, which measure of central tendency would best represent a typical score?","options":["Mean","Median","Mode","Range"],"answer":1,"rationale":"The few very low scores pull the mean down to about 8.2, while the median of 9 resists extreme scores, so it best represents a typical score in a skewed distribution. The mode of 10 sits at the very top of the scale, and the range measures variability, not central tendency."},{"id":"U4-240","section":"0.5","skill":"Data Interpretation","difficulty":2,"set":"u4b_skew","stimulus":{"type":"bar","title":"Quiz Scores on Group Influence","xLabel":"Score (out of 10)","yLabel":"Number of students","categories":["3","4","5","6","7","8","9","10"],"series":[{"name":"Students","values":[1,1,2,3,5,8,10,12]}]},"stem":"The graph shows the scores of 42 students on a 10-point quiz about how groups influence individual behavior. Which type of distribution is shown?","options":["Positively skewed","Normal","Negatively skewed","Bimodal"],"answer":2,"rationale":"Most scores cluster at the high end with a tail stretching toward the low scores, which is a negative skew. A positive skew would have its tail toward the high scores."},{"id":"U4-241","section":"0.6","skill":"Data Interpretation","difficulty":2,"stem":"In an obedience study, researchers report that participants obeyed significantly more often when the experimenter wore a uniform than when the experimenter wore casual clothes (p < .05). This means the difference","options":["is large enough to matter in everyday life","proves that uniforms cause obedience in all people","means most participants in the uniform condition obeyed","is unlikely to have occurred by chance alone"],"answer":3,"rationale":"Statistical significance means the result is unlikely to be due to chance. It does not prove a claim for everyone, it does not show that an effect is large or practically important, and it says nothing about what share of participants obeyed."},{"id":"U4-242","section":"0.6","skill":"Data Interpretation","difficulty":2,"stem":"An industrial-organizational psychologist finds a correlation of +.45 between employees' scores on a teamwork questionnaire and their supervisor ratings one year later. Which conclusion is justified?","options":["Employees with higher teamwork scores tend to receive higher supervisor ratings, though other factors could explain the link.","An employee with a low teamwork score will definitely receive a low supervisor rating.","Training that raises teamwork scores is guaranteed to raise supervisor ratings.","This correlation is stronger than a correlation of -.60 between absences and supervisor ratings."],"answer":0,"rationale":"A positive correlation means the two variables tend to rise together, but it does not establish cause or guarantee any individual's outcome. Strength depends on distance from zero, so -.60 is a stronger relationship than +.45."},{"id":"U4-243","section":"0.6","skill":"Data Interpretation","difficulty":2,"stem":"Dr. Nakamura compares conformity rates between participants who answered aloud and participants who answered privately. She then calculates whether the difference is large and reliable enough to generalize from her sample to the wider population. This type of analysis is","options":["descriptive","a measure of variability","qualitative","inferential"],"answer":3,"rationale":"Inferential statistics, such as significance tests and effect sizes, are used to draw conclusions beyond the sample about whether the independent variable affected the dependent variable. Descriptive statistics, including measures of variability, only summarize the data collected."},{"id":"U4-261","section":"4.3","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"bar","title":"Average Support for a Stricter School Phone Ban (1 = strongly oppose, 10 = strongly support)","xLabel":"Type of discussion group","yLabel":"Average support rating","categories":["Groups that leaned in favor","Groups that leaned against"],"series":[{"name":"Before discussion","values":[6.2,3.8]},{"name":"After discussion","values":[8.1,1.9]}],"yMax":10},"stem":"Students who mostly agreed with one another were placed in small discussion groups and rated their support for a stricter phone ban before and after a 30-minute discussion. Which concept is best illustrated by the results in the graph?","options":["Deindividuation","Groupthink","The just-world phenomenon","Group polarization"],"answer":3,"rationale":"After discussion, each group moved further in the direction it already leaned, which is group polarization. Groupthink concerns members suppressing doubts to reach a harmonious but poor decision, which these ratings do not show."},{"id":"U4-273","section":"4.3","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Students' Estimates of How Many Classmates Skip Breakfast (actual rate: 25%)","headers":["Student group","Number of students","Average estimate of classmates who skip breakfast"],"rows":[["Students who usually skip breakfast","40","68%"],["Students who usually eat breakfast","120","22%"]]},"stem":"A school nurse asked 160 students whether they usually skip breakfast and what percentage of their classmates they thought skip it. The actual rate was 25 percent. The pattern in the table best illustrates","options":["the halo effect","the just-world phenomenon","the false consensus effect","the self-fulfilling prophecy"],"answer":2,"rationale":"Students who skip breakfast estimated that far more classmates do so than actually do, overestimating how common their own habit is; this is the false consensus effect. The halo effect involves letting one positive trait shape an overall impression of a person."},{"id":"U4-315","section":"0.5","skill":"Data Interpretation","difficulty":1,"set":"u4b_selfesteem","stem":"Ten participants in a confidence-building program rated their self-esteem on a scale from 1 (very low) to 10 (very high). Their ratings were: 2, 4, 4, 6, 6, 6, 7, 8, 9, 9. What is the mode of these ratings?","options":["4","6.1","6","9"],"answer":2,"rationale":"The mode is the score that occurs most often, and 6 appears three times. The ratings 4 and 9 each appear only twice, and 6.1 is the mean."},{"id":"U4-316","section":"0.5","skill":"Data Interpretation","difficulty":2,"set":"u4b_selfesteem","stem":"Ten participants in a confidence-building program rated their self-esteem on a scale from 1 (very low) to 10 (very high). Their ratings were: 2, 4, 4, 6, 6, 6, 7, 8, 9, 9. What is the mean of these ratings?","options":["6.1","6","6.5","5.5"],"answer":0,"rationale":"The ratings add up to 61, and 61 divided by 10 participants equals 6.1. The value 6 is both the median and the mode, not the mean."},{"id":"U4-516","section":"4.5","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Factor loadings from a hypothetical personality questionnaire (higher numbers mean an item is more strongly related to that factor)","headers":["Questionnaire item","Factor 1","Factor 2"],"rows":[["I make plans and stick to them","0.12","0.81"],["I start conversations with strangers","0.79","0.08"],["I finish tasks on time","0.05","0.77"],["I feel energized at large events","0.83","0.10"],["I keep my belongings neat and organized","0.09","0.74"],["I enjoy being the center of attention","0.76","0.14"]]},"stem":"A researcher gave a personality questionnaire to 500 students and used factor analysis to group the items. Based on the table, which labels best fit the two factors?","options":["Factor 1 is conscientiousness, and Factor 2 is extraversion.","Factor 1 is extraversion, and Factor 2 is conscientiousness.","Factor 1 is agreeableness, and Factor 2 is openness to experience.","Factor 1 is extraversion, and Factor 2 is emotional stability."],"answer":1,"rationale":"Items about starting conversations, feeling energized at events and enjoying attention load highly on Factor 1, which fits extraversion. Items about planning, finishing on time and neatness load highly on Factor 2, which fits conscientiousness. Factor analysis groups items whose responses are strongly correlated."},{"id":"U4-518","section":"4.5","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"line","title":"Average trait scores by age group (hypothetical cross-sectional study)","xLabel":"Age group (years)","yLabel":"Average score (1 to 5 scale)","series":[{"name":"Emotional stability","points":[[20,3.0],[30,3.2],[40,3.4],[50,3.6],[60,3.7]]},{"name":"Openness to experience","points":[[20,3.8],[30,3.7],[40,3.6],[50,3.5],[60,3.4]]}]},"stem":"Researchers gave the same personality inventory, at one point in time, to adults in five different age groups. Which conclusion is best supported by the graph and the study design?","options":["Each participant's emotional stability rose by 0.7 points as they aged from 20 to 60.","Openness to experience dropped sharply after age 40, while emotional stability stayed the same.","Aging causes people to become less open to new experiences.","Older groups scored higher on emotional stability and slightly lower on openness, though these differences might partly reflect generational differences between the groups."],"answer":3,"rationale":"Across age groups, emotional stability rises from 3.0 to 3.7 and openness falls gradually from 3.8 to 3.4. Because this cross-sectional design compares different people of different ages, it cannot show how any individual changed, and the differences could partly be cohort effects."},{"id":"U4-520","section":"4.5","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"bar","title":"Noor's Big Five inventory results","xLabel":"Trait","yLabel":"Percentile score","categories":["Openness","Conscientiousness","Extraversion","Agreeableness","Emotional stability"],"series":[{"name":"Noor","values":[88,22,85,60,55]}],"yMax":100},"stem":"Noor completed a Big Five personality inventory, and her percentile scores are shown in the graph. Based on these results, which description of Noor is most likely accurate?","options":["She is quiet and reserved, but very organized and careful with deadlines.","She worries constantly and has difficulty trusting other people.","She enjoys new ideas and lively social events, but she may have trouble staying organized and finishing tasks on time.","She prefers familiar routines and avoids unfamiliar activities, but she is very dependable."],"answer":2,"rationale":"High openness (88th percentile) and high extraversion (85th) suggest curiosity and enjoyment of social activity, while low conscientiousness (22nd) suggests difficulty with organization and deadlines. Her agreeableness and emotional stability are near average, so claims about distrust or constant worry are not supported."},{"id":"U4-616","section":"4.6","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"line","title":"Ghrelin levels across one day for a participant who ate at 8:00, 13:00 and 19:00 (hypothetical)","xLabel":"Time of day (hour, 24-hour clock)","yLabel":"Ghrelin level (relative units)","series":[{"name":"Ghrelin","points":[[6,55],[7,70],[8,82],[9,40],[10,45],[11,60],[12,75],[13,85],[14,42],[15,45],[16,55],[17,65],[18,78],[19,88],[20,45],[21,50]]}],"bands":[{"from":8,"to":9,"label":"Breakfast"},{"from":13,"to":14,"label":"Lunch"},{"from":19,"to":20,"label":"Dinner"}]},"stem":"A researcher measured a participant's blood ghrelin levels throughout one day. Which conclusion is best supported by the graph?","options":["Ghrelin was highest just after each meal, consistent with a role in signaling fullness.","Ghrelin stayed constant across the day, so time of day does not affect hunger signals.","Ghrelin rose steadily from morning to night and never decreased.","Ghrelin rose in the hours before each meal and dropped after eating, consistent with its role in signaling hunger."],"answer":3,"rationale":"The graph peaks at the start of each meal (8, 13 and 19 hours) and falls right after eating. Ghrelin, released mainly by the stomach, increases hunger, so rising before meals and dropping afterward fits that role."},{"id":"U4-617","section":"4.6","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"bar","title":"Average accuracy by arousal level and task difficulty (hypothetical)","xLabel":"Arousal level","yLabel":"Percentage correct","categories":["Low","Moderate","High"],"series":[{"name":"Simple task","values":[70,84,90]},{"name":"Difficult task","values":[60,80,48]}],"yMax":100},"stem":"Participants completed either a simple task (crossing out every letter E on a page) or a difficult task (solving multistep logic problems) under low, moderate or high arousal created by increasing time pressure. Which conclusion is best supported by the results?","options":["High arousal helped performance on the simple task but hurt performance on the difficult task, consistent with the Yerkes-Dodson law.","Higher arousal improved performance on both tasks, so arousal should always be as high as possible.","Arousal level had no effect on performance for either task.","Low arousal produced the best performance on both tasks, consistent with drive-reduction theory."],"answer":0,"rationale":"On the simple task, accuracy kept rising up to high arousal (90 percent), but on the difficult task it peaked at moderate arousal (80 percent) and fell at high arousal (48 percent). The Yerkes-Dodson law predicts that the best level of arousal is lower for difficult tasks than for simple ones."},{"id":"U4-618","section":"4.6","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"bar","title":"Average minutes spent on origami during free time (hypothetical)","xLabel":"Phase of study","yLabel":"Minutes","categories":["Week 1 (before any rewards)","Week 4 (after rewards ended)"],"series":[{"name":"Reward group","values":[18,8]},{"name":"No-reward group","values":[17,16]}],"yMax":20},"stem":"Dr. Haddad selected students who already enjoyed making origami models and randomly assigned them to two groups. During weeks 2 and 3, the reward group earned a gift card for each model completed, while the no-reward group received nothing. All rewards then stopped. Which conclusion is best supported by the results and self-determination theory?","options":["The rewards strengthened the reward group's interest, so they spent more free time on origami after rewards stopped.","The external rewards appear to have reduced the reward group's intrinsic motivation, so they spent less free time on origami once the rewards ended.","The no-reward group lost interest in origami because they had no incentive to continue.","Because both groups started at similar levels, the rewards had no effect on behavior."],"answer":1,"rationale":"Both groups started at about 17 to 18 minutes, but only the reward group dropped (to 8 minutes) after rewards stopped. Adding external rewards to an already enjoyable activity can shift the reason for doing it from intrinsic to extrinsic, so interest falls once the rewards are removed."},{"id":"U4-620","section":"4.6","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Rafael's scores on a sensation-seeking scale (each subscale scored 0 to 10)","headers":["Subscale","Score"],"rows":[["Thrill and adventure seeking","2"],["Experience seeking","9"],["Disinhibition","3"],["Boredom susceptibility","4"]]},"stem":"Rafael completed a sensation-seeking scale during a careers and interests workshop. Based on his scores in the table, which weekend plan would Rafael most likely find most appealing?","options":["Bungee jumping from a tall bridge with a group of friends","Rewatching his favorite film at home, as he does most weekends","A noisy, crowded celebration where he can drop his usual social restraints","Visiting an unfamiliar city to explore its street food, unusual music and local art"],"answer":3,"rationale":"Rafael scores highest on experience seeking, the desire for new sensations through travel, art, music and unfamiliar ways of living. His low thrill and adventure seeking and disinhibition scores make bungee jumping and an uninhibited celebration less appealing, and rewatching a familiar film offers no novelty."},{"id":"U4-708","section":"4.7","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"bar","title":"Mean Pleasantness Ratings of Photographs in Three Laboratories","xLabel":"Laboratory","yLabel":"Mean pleasantness rating (1 to 10)","categories":["Lab 1","Lab 2","Lab 3"],"series":[{"name":"Smile-like position","values":[6.9,6.1,5.8]},{"name":"Frown-like position","values":[5.3,5.9,6.0]}],"yMax":10},"stem":"Three laboratories ran the same study testing whether holding a smile-like or a frown-like facial position changes how pleasant people find a set of photographs. Their results are shown in the graph. Which conclusion is best supported by the data?","options":["Holding a smile-like position strongly raised pleasantness ratings in all three laboratories","Holding a frown-like position raised pleasantness ratings in every laboratory","Support for the facial-feedback hypothesis was inconsistent across laboratories, with a clear effect in only one","Facial position had no effect in any laboratory, so the facial-feedback hypothesis is disproven"],"answer":2,"rationale":"Lab 1 shows a clear difference (6.9 versus 5.3), Lab 2 shows only a tiny difference, and Lab 3 shows a slight reversal. This pattern matches the mixed results reported in research on the facial-feedback hypothesis, and one set of studies cannot fully disprove it."},{"id":"U4-711","section":"4.7","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Mean number of different solutions listed after each film clip","headers":["Film clip condition","Mean number of different solutions"],"rows":[["Amusing clip","11.2"],["Neutral clip","8.4"],["Frightening clip","5.9"]]},"stem":"Students were randomly assigned to watch an amusing, a neutral or a frightening film clip. Each student then listed as many different solutions as possible to the problem of an overcrowded school cafeteria. The results are shown in the table. Which conclusion is best supported by the data?","options":["Compared with the neutral clip, the amusing clip was followed by more solutions and the frightening clip by fewer","The frightening clip produced the widest range of solutions because fear increases alertness","Emotion had no effect, because all three conditions produced roughly the same number of solutions","The amusing clip reduced the number of solutions compared with the neutral clip"],"answer":0,"rationale":"The amusing condition (11.2) is above the neutral condition (8.4), and the frightening condition (5.9) is below it. This pattern fits the broaden-and-build theory: positive emotions broaden thinking and negative emotions narrow it."},{"id":"U5-015","section":"0.6","skill":"Data Interpretation","difficulty":2,"set":"u5a_breath","stimulus":{"type":"bar","title":"Mean Tension Ratings Before and After the 10-Minute Break","xLabel":"Group","yLabel":"Mean tension rating (0 to 10)","categories":["Breathing app group","Magazine group"],"series":[{"name":"Before break","values":[7.8,7.6]},{"name":"After break","values":[2.9,6.1]}],"yMax":10},"stem":"Dr. Wanjiru tests whether a guided-breathing phone app reduces tension. Twenty-four university students each give a short speech to a panel of strangers and then rate their tension from 0 (none) to 10 (extreme). Half of the students are randomly assigned to use the guided-breathing app for 10 minutes; the other half read a printed travel magazine for 10 minutes. All students then rate their tension again. The group means are shown in the graph. Which of the following statements is best supported by the results?","options":["The magazine group became more tense after the break than before it.","The breathing app group was less tense than the magazine group before the break began.","After the break, every student in the breathing app group rated tension below 3.","Both groups became less tense, but the breathing app group's drop was larger than the magazine group's."],"answer":3,"rationale":"The app group dropped from 7.8 to 2.9 (4.9 points), while the magazine group dropped from 7.6 to 6.1 (1.5 points), so both fell but the app group fell more. The graph shows only group means, so it cannot show that every individual student scored below 3."},{"id":"U5-022","section":"0.5","skill":"Data Interpretation","difficulty":3,"set":"u5a_resid","stimulus":{"type":"passage","text":"A public health team studied 120 trainees at an air traffic control academy during the final month of their certification course, a period known for intense pressure. Each trainee completed a job-pressure scale scored from 0 to 50, and, with the trainees' consent, the team counted how many times each trainee had visited the academy clinic for minor illnesses such as colds or stomach upsets during that month. Trainees with higher job-pressure scores tended to have made more clinic visits. The team leader told a newspaper that certification pressure makes trainees sick."},"stem":"If the team graphed the trainees' job-pressure scores, which prediction about the shape of the distribution is most reasonable?","options":["Most scores would cluster near the high end of the scale, with a tail of a few low scores (a negatively skewed distribution).","Scores would form a symmetrical, bell-shaped normal distribution.","Most scores would cluster near the low end of the scale, with a tail of a few high scores (a positively skewed distribution).","Scores would form two equal clusters, one at each end of the scale."],"answer":0,"rationale":"Trainees in the final, high-pressure month of certification would mostly report high pressure, so scores pile up at the top with a few low outliers, producing a negative skew. A positive skew would mean most trainees felt little pressure."},{"id":"U5-030","section":"0.5","skill":"Data Interpretation","difficulty":2,"stem":"A positive psychology class asks eight students to rate how satisfied they are with their lives this week on a scale from 1 to 10. Their ratings are 6, 2, 9, 4, 7, 9, 3, 8. What is the median rating?","options":["6","7","6.5","9"],"answer":2,"rationale":"Ordered, the ratings are 2, 3, 4, 6, 7, 8, 9, 9. With an even number of scores, the median is the average of the two middle scores, 6 and 7, which is 6.5. The mean is 6, and the mode is 9."},{"id":"U5-033","section":"0.5","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Weekly social contacts and stress scores for ten participants","headers":["Participant","Close social contacts per week","Stress score (out of 40)"],"rows":[["1","1","36"],["2","8","10"],["3","3","30"],["4","6","17"],["5","2","33"],["6","9","8"],["7","5","22"],["8","4","25"],["9","7","14"],["10","2","35"]]},"stem":"Researchers studying well-being asked ten adults to record how many times per week they spent meaningful time with close friends or family. Each participant also completed a stress inventory scored from 0 to 40, with higher scores meaning more stress. The results are shown in the table. Which statement most accurately describes these data?","options":["There is a strong negative correlation between social contacts and stress scores.","There is a strong positive correlation between social contacts and stress scores.","Social contacts and stress scores show no clear relationship.","Spending more time with friends and family causes stress to decrease."],"answer":0,"rationale":"Participants with more weekly contacts consistently have lower stress scores, so the variables move in opposite directions in a tight pattern: a strong negative correlation. Because the data are correlational, they cannot show that social contact causes lower stress."},{"id":"U5-035","section":"0.5","skill":"Data Interpretation","difficulty":2,"stem":"A study of hospital staff finds a negative correlation between scores on the character strength of perseverance and the number of workdays missed per year. Which conclusion is best supported by this finding?","options":["Developing perseverance causes staff to miss fewer workdays.","Staff with higher perseverance scores tend to miss fewer workdays.","Perseverance and missed workdays are unrelated, because a negative correlation means there is no relationship.","Staff with higher perseverance scores tend to miss more workdays."],"answer":1,"rationale":"A negative correlation means that as one variable increases, the other tends to decrease, which is still a relationship. It does not show which variable, if either, causes the other."},{"id":"U5-037","section":"0.5","skill":"Data Interpretation","difficulty":2,"set":"u5a_points","stimulus":{"type":"table","caption":"Mei Ling's unforced errors in eight squash matches this season","headers":["Match","Unforced errors"],"rows":[["1","12"],["2","7"],["3","15"],["4","10"],["5","4"],["6","18"],["7","10"],["8","13"]]},"stem":"Mei Ling, a member of her school's squash team, has started practicing a pre-match breathing routine with the school counselor to manage her nerves. She records the number of unforced errors she makes in each match this season, as shown in the table. What is the median number of unforced errors?","options":["10","12","13","11"],"answer":3,"rationale":"Ordered, the scores are 4, 7, 10, 10, 12, 13, 15, 18. The two middle scores are 10 and 12, so the median is 11. The value 10 is the mode."},{"id":"U5-038","section":"0.5","skill":"Data Interpretation","difficulty":1,"set":"u5a_points","stimulus":{"type":"table","caption":"Mei Ling's unforced errors in eight squash matches this season","headers":["Match","Unforced errors"],"rows":[["1","12"],["2","7"],["3","15"],["4","10"],["5","4"],["6","18"],["7","10"],["8","13"]]},"stem":"Mei Ling, a member of her school's squash team, has started practicing a pre-match breathing routine with the school counselor to manage her nerves. She records the number of unforced errors she makes in each match this season, as shown in the table. What is the range of Mei Ling's unforced errors?","options":["14","11","18","8"],"answer":0,"rationale":"The range is the highest score minus the lowest score: 18 minus 4 equals 14. The value 18 is only the highest score, and 8 is the number of matches."},{"id":"U5-042","section":"0.5","skill":"Data Interpretation","difficulty":1,"stem":"Over one school term, Aiko recorded the number of hours of homework assigned each day at her school and the average mood rating students gave in a quick daily poll. She found that on days with more homework, mood ratings tended to be lower. Which term best describes the relationship between these two variables?","options":["Positive correlation","Negative correlation","Zero correlation","Cause-and-effect relationship"],"answer":1,"rationale":"In a negative correlation, one variable tends to go up as the other goes down. Aiko only measured the variables, so she cannot claim that homework caused the lower moods."},{"id":"U5-043","section":"0.5","skill":"Data Interpretation","difficulty":2,"stem":"A team of researchers measures adults' scores on the signature strength of kindness and their scores on a hostility questionnaire. Which of the following correlation coefficients would indicate the strongest relationship between these two variables?","options":["-0.78","+0.61","-0.42","+0.09"],"answer":0,"rationale":"The strength of a correlation is shown by how close the coefficient is to 1 or -1, regardless of sign. At 0.78, the coefficient -0.78 is farther from zero than any of the others."},{"id":"U5-066","section":"5.3","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"bar","title":"Adults Diagnosed With a Depressive Disorder in the Past Year, by Employment Status","xLabel":"Employment status","yLabel":"Percent diagnosed","categories":["Employed","Unemployed less than 1 year","Unemployed more than 1 year"],"series":[{"name":"Percent diagnosed","values":[6,11,19]}],"yMax":25},"stem":"A national health survey reports the percentage of adults diagnosed with a depressive disorder in the past year, grouped by employment status, as shown in the graph. These results most directly support which perspective on the origins of psychological disorders?","options":["Psychodynamic","Evolutionary","Biological","Sociocultural"],"answer":3,"rationale":"The graph links rates of depressive disorders to employment status, an economic and social circumstance, which is the focus of the sociocultural perspective. The data say nothing about unconscious conflicts, survival value or physiology."},{"id":"U5-070","section":"5.3","skill":"Data Interpretation","difficulty":3,"stimulus":{"type":"line","title":"Mean Skin Conductance Response During Extinction Trials","xLabel":"Extinction trial","yLabel":"Mean skin conductance response (microsiemens)","series":[{"name":"Spider pictures","points":[[1,0.82],[2,0.78],[3,0.75],[4,0.71],[5,0.69],[6,0.66]]},{"name":"Flower pictures","points":[[1,0.8],[2,0.52],[3,0.31],[4,0.19],[5,0.13],[6,0.1]]}]},"stem":"In a conditioning study, Dr. Mwangi's participants first saw pictures of spiders and pictures of flowers, each followed by an unpleasant burst of loud noise, until both kinds of pictures produced similar fear responses. In the extinction phase shown in the graph, the pictures were presented with no noise. These results best support which perspective on the origins of phobias?","options":["Sociocultural","Humanistic","Evolutionary","Psychodynamic"],"answer":2,"rationale":"Fear of the spider pictures barely declines across trials, while fear of the flower pictures fades quickly, suggesting humans are prepared to learn and keep fears of ancestral threats. Ordinary conditioning alone would predict similar extinction for both kinds of pictures."},{"id":"U5-088","section":"5.3","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"bar","title":"Hypothetical Rates of Schizophrenia Diagnosis by Household Income Group","xLabel":"Household income group","yLabel":"Percent diagnosed","categories":["Lowest","Lower middle","Middle","Upper middle","Highest"],"series":[{"name":"Percent diagnosed","values":[1.6,1.0,0.8,0.6,0.5]}],"yMax":2},"stem":"The graph shows hypothetical percentages of people diagnosed with schizophrenia in five household income groups. A researcher argues that the steady rise in diagnoses from the highest to the lowest income group suggests that social and economic conditions may contribute to the disorder. This argument most clearly reflects which perspective?","options":["Cognitive","Humanistic","Evolutionary","Sociocultural"],"answer":3,"rationale":"Income reflects socioeconomic status, a social and economic condition, which the sociocultural perspective examines as a factor in psychological disorders. The graph contains no information about thinking, personal growth or survival value."},{"id":"U5-093","section":"5.3","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"bar","title":"Hypothetical Concordance Rates for Bipolar Disorder in Twin Pairs","xLabel":"Type of twin pair","yLabel":"Percent of pairs in which both twins are diagnosed","categories":["Identical twins","Fraternal twins"],"series":[{"name":"Concordance rate","values":[55,8]}],"yMax":100},"stem":"The graph shows hypothetical concordance rates for bipolar disorder, meaning the percentage of twin pairs in which both twins are diagnosed. Identical twins share nearly all of their genes, while fraternal twins share about half, like ordinary siblings. These data are most consistent with which approach to explaining bipolar disorder?","options":["Humanistic","Biological","Behavioral","Sociocultural"],"answer":1,"rationale":"Identical twins, who share more genes, are far more likely to share the diagnosis than fraternal twins, which points to a genetic contribution emphasized by the biological approach. Both kinds of twins usually grow up in similar environments, so environment alone does not explain the gap."},{"id":"U5-295","section":"0.5","skill":"Data Interpretation","difficulty":2,"set":"u5b_panic_trial","stimulus":{"type":"table","caption":"Calmness ratings after eight weeks","headers":["Participant","Group 1 (new program)","Group 2 (standard program)"],"rows":[["1","8","5"],["2","4","3"],["3","9","6"],["4","7","4"],["5","8","5"],["6","5","6"],["7","9","2"],["8","6","5"],["9","8","4"],["10","7","6"]]},"stem":"Researchers randomly assigned 20 adults diagnosed with panic disorder to one of two conditions for eight weeks. Group 1 attended a new group program combining breathing training with exposure exercises. Group 2 attended the clinic's standard program. At the end, each participant rated how calm they felt in everyday situations on a scale from 1 (not at all calm) to 10 (completely calm). What is the median calmness rating for Group 1?","options":["7.0","7.1","7.5","8.0"],"answer":2,"rationale":"Ordered, Group 1's ratings are 4, 5, 6, 7, 7, 8, 8, 8, 9, 9. With ten scores, the median is the mean of the fifth and sixth scores: (7 + 8) / 2 = 7.5. The mean is 7.1 and the mode is 8."},{"id":"U5-303","section":"0.5","skill":"Data Interpretation","difficulty":2,"stem":"A health psychologist records the resting heart rates (in beats per minute) of 50 employees before a stress-management workshop. She later learns that the monitor read every value exactly 4 beats per minute too low, so she adds 4 to every recorded value. Compared with the original data, the corrected data set will have","options":["a higher median and the same standard deviation","a higher median and a larger standard deviation","the same median and a larger standard deviation","the same median and the same standard deviation"],"answer":0,"rationale":"Adding the same constant to every score shifts measures of central tendency, such as the median and mean, up by that amount. The distance between scores does not change, so the standard deviation and range stay the same."},{"id":"U5-304","section":"0.5","skill":"Data Interpretation","difficulty":2,"stem":"Dr. Nkemelu finds a correlation of -0.62 between hours of weekly exercise and scores on a depression questionnaire in a sample of 300 adults. Which conclusion is supported by this finding?","options":["Exercising more causes people to become less depressed.","As hours of exercise increase, depression scores tend to decrease.","As hours of exercise increase, depression scores tend to increase.","The relationship is weak because the correlation is negative."],"answer":1,"rationale":"A negative correlation means that as one variable increases, the other tends to decrease, and -0.62 is a moderately strong relationship because strength depends on the size of the number, not its sign. A correlation alone cannot show that exercise causes lower depression."},{"id":"U5-305","section":"0.6","skill":"Data Interpretation","difficulty":2,"stem":"A school counselor compares students with test anxiety who completed biofeedback training with similar students who did not. The biofeedback group had lower average heart rates during exams, and the difference was statistically significant (p < .05). Which statement about this result is true?","options":["The difference is likely due to chance.","The difference is unlikely to be due to chance alone.","The result proves biofeedback will work for every student with test anxiety.","The result shows a positive correlation between biofeedback and heart rate."],"answer":1,"rationale":"Statistical significance means the observed difference is unlikely to have occurred by chance alone. It does not guarantee that the treatment works for every individual."},{"id":"U5-306","section":"0.5","skill":"Data Interpretation","difficulty":2,"stem":"A researcher creates four scatterplots relating adults' average nightly hours of sleep to the number of headaches they report each month. Which description shows the strongest relationship between the two variables?","options":["Points fall almost exactly along a straight line that slopes downward.","Points form a loose, wide cloud that slopes slightly upward.","Points are scattered with no visible pattern.","Points form a moderately tight band that slopes upward."],"answer":0,"rationale":"The strength of a correlation depends on how closely points cluster around a line, not on whether the line slopes up or down. Points falling almost exactly on a line show the strongest relationship, here a strong negative one."},{"id":"U5-515","section":"5.2","skill":"Data Interpretation","difficulty":2,"set":"add_d_gratitude_aziz","stimulus":{"type":"bar","title":"Mean Life Satisfaction After Six Weeks","xLabel":"Condition","yLabel":"Mean life satisfaction score (1 to 10)","categories":["Weekly thank-you messages","Weekly log of daily tasks","No writing"],"series":[{"name":"Life satisfaction","values":[7.4,6.1,6.0]}],"yMax":10},"stem":"Students were randomly assigned to send one thank-you message each week to someone who had helped them, to write a weekly log of their daily tasks, or to do no writing. After six weeks, all students rated their life satisfaction. Which conclusion is best supported by the results in the graph?","options":["Any kind of weekly writing raised life satisfaction by about the same amount","Logging daily tasks produced the highest life satisfaction of the three conditions","Life satisfaction was nearly identical in all three conditions","Sending thank-you messages led to higher life satisfaction than either comparison condition, while logging daily tasks made little difference compared with no writing"],"answer":3,"rationale":"The thank-you group (7.4) scored well above the task-log group (6.1) and the no-writing group (6.0), which barely differed from each other. Because students were randomly assigned, the results support the claim that expressing gratitude increases subjective well-being."},{"id":"U5-518","section":"5.2","skill":"Data Interpretation","difficulty":2,"stimulus":{"type":"table","caption":"Mean scores of adults recovering from serious injuries at three points after the injury","headers":["Time since injury","Mean growth score (0 to 100)","Mean distress score (0 to 40)"],"rows":[["3 months","22","28"],["12 months","38","19"],["24 months","47","15"]]},"stem":"Dr. Kowalski follows the same group of adults who are recovering from serious injuries and measures posttraumatic growth and psychological distress at three points in time. Which statement is best supported by the data in the table?","options":["Rising growth scores caused the drop in distress scores","Mean growth scores rose over time while distress fell, although some distress remained at 24 months","Growth scores were highest at 3 months and declined over time","Distress had completely disappeared by 24 months"],"answer":1,"rationale":"Growth rose from 22 to 47 while distress fell from 28 to 15, but a mean distress score of 15 shows that distress had not disappeared. Because nothing was manipulated, the data cannot show that growth caused distress to fall."},{"id":"DA-G1-01","section":"3.4","skill":"Data Interpretation","difficulty":1,"stimulus":{"type":"table","caption":"Mean looking time in the experimental condition (hidden box present)","headers":["Event","Mean looking time (seconds)","Standard deviation (seconds)"],"rows":[["Impossible event (screen rotates the full 180 degrees)","29.2","20.6"],["Possible event (screen stops at the box, 112 degrees)","17.7","13.1"]]},"stem":"In an experiment, 24 infants aged about 4 to 5 months watched a screen rotate toward a hidden box. Researchers predicted that infants who know a hidden object still exists will look longer at an impossible event than at a possible one. According to the table, how much longer did infants in the experimental condition look, on average, at the impossible event than at the possible event?","options":["11.5 seconds longer","46.9 seconds longer","7.5 seconds longer","1.65 seconds longer"],"answer":0,"rationale":"The difference between the two means is 29.2 mi
