<script>
// ==============================================================
// TERMS DATABASE
// ==============================================================
const termsDB = {
  "2.1": [
    {term:"Top-Down Processing",def:"Perception guided by prior knowledge, expectations, context, and schemas. Fast and efficient but can produce errors when expectations override actual input."},
    {term:"Bottom-Up Processing",def:"Perception built from raw sensory data upward, without relying on prior knowledge. Used when stimuli are unfamiliar or unexpected. Slower but less error-prone."},
    {term:"Schema",def:"A mental framework built from past experience that organises and guides perception and interpretation of new information. Schemas make processing faster but can cause biased perception."},
    {term:"Perceptual Set",def:"A mental readiness to perceive stimuli in a particular way, shaped by expectations, emotions, and context. More temporary than a schema; influenced by recent experience."},
    {term:"Selective Attention",def:"Focusing conscious awareness on a specific stimulus while filtering out others. Efficient but creates blind spots for unattended information."},
    {term:"Cocktail Party Effect",def:"The ability to follow a specific conversation in a noisy environment and to notice personally relevant information (such as one's own name) from the background noise."},
    {term:"Inattentional Blindness",def:"Failure to notice a fully visible stimulus in the visual field because attention is directed elsewhere. The stimulus is present but goes entirely unregistered."},
    {term:"Change Blindness",def:"Failure to detect significant changes in a visual scene when the change occurs alongside a visual interruption or when attention is divided."},
    {term:"Figure and Ground",def:"The Gestalt principle that the visual system separates a focal object (figure) from its surrounding background (ground). The same image can switch between figure and ground."},
    {term:"Closure",def:"The Gestalt principle that the brain fills in missing information to perceive an incomplete image as a whole, recognisable object."},
    {term:"Continuity",def:"The Gestalt principle that the eye naturally follows smooth, continuous lines or curves rather than abrupt directional changes."},
    {term:"Proximity",def:"The Gestalt principle that objects physically close together tend to be perceived as belonging to the same group."},
    {term:"Similarity",def:"The Gestalt principle that objects sharing visual features (colour, shape, size) tend to be perceived as belonging to the same group."},
    {term:"Depth Perception",def:"The ability to perceive the relative distance of objects in the visual field. Depends on both binocular and monocular depth cues."},
    {term:"Binocular Depth Cues",def:"Depth cues that require input from both eyes working together. Include retinal disparity and convergence."},
    {term:"Retinal Disparity",def:"The difference between the images received by the left and right retinas. Greater disparity signals a closer object. The primary binocular depth cue."},
    {term:"Convergence",def:"The inward turning of the eyes when focusing on a close object. The degree of muscle tension signals distance to the brain."},
    {term:"Monocular Depth Cues",def:"Depth cues available with only one eye. Include relative size, linear perspective, interposition, texture gradient, and relative clarity."},
    {term:"Relative Size",def:"Objects that appear smaller in the visual field are perceived as farther away. A monocular depth cue."},
    {term:"Linear Perspective",def:"Parallel lines appear to converge as they recede into the distance. A monocular depth cue."},
    {term:"Interposition",def:"When one object partially blocks another, the blocked object is perceived as farther away. A monocular depth cue."},
    {term:"Perceptual Constancy",def:"The tendency to perceive objects as stable and unchanged in size, shape, brightness, and colour despite changes in sensory input."},
    {term:"Color Constancy",def:"Perceiving familiar objects as retaining their colour under varying lighting conditions, even when the wavelengths reaching the eye change."},
    {term:"Perceptual Adaptation",def:"The ability to adjust perception in response to an artificially altered visual field. After adjustment, removing the alteration requires re-adaptation."},
    {term:"Phi Phenomenon",def:"The perception of smooth motion created by a rapid sequence of slightly different static images. The basis of film and animation. Also called stroboscopic movement."},
    {term:"Autokinetic Effect",def:"The apparent movement of a single stationary point of light in a completely dark room, caused by small involuntary eye movements with no frame of reference."}
  ],
  "2.2": [
    {term:"Concepts",def:"Mental categories that group objects, events, or ideas sharing common features. Concepts allow efficient thinking by letting us apply prior knowledge to new instances."},
    {term:"Prototypes",def:"The most typical or representative example of a concept. We judge new instances by how closely they match the prototype of a category."},
    {term:"Assimilation",def:"Interpreting new information by fitting it into an existing schema, without changing the schema itself."},
    {term:"Accommodation",def:"Modifying an existing schema, or creating a new one, to incorporate new information that does not fit the current schema."},
    {term:"Algorithm",def:"A systematic, step-by-step procedure that guarantees a correct solution if followed precisely. Slower than heuristics but eliminates error."},
    {term:"Heuristic",def:"A mental shortcut or rule of thumb that allows quick judgments and decisions. Faster than algorithms but can produce errors and biases."},
    {term:"Representativeness Heuristic",def:"Judging the probability of something by how closely it resembles a typical case or prototype, regardless of base-rate probabilities."},
    {term:"Availability Heuristic",def:"Judging the likelihood of an event by how easily relevant examples come to mind. Vivid or recent events feel more probable than they may actually be."},
    {term:"Insight",def:"A sudden, seemingly spontaneous realisation of a problem's solution. Associated with Wolfgang Kohler's research with chimpanzees."},
    {term:"Mental Set",def:"The tendency to approach a new problem using the same strategies that have worked in the past, even when a different approach would be more effective."},
    {term:"Fixation",def:"An inability to see a problem from a new perspective. Includes functional fixedness and mental set."},
    {term:"Functional Fixedness",def:"A cognitive bias in which a person can only conceive of an object in terms of its conventional use, blocking creative problem-solving."},
    {term:"Confirmation Bias",def:"The tendency to search for, interpret, and recall information in a way that confirms pre-existing beliefs while ignoring contradictory evidence."},
    {term:"Belief Perseverance",def:"The tendency to hold on to an initial belief even after it has been clearly disproven by new evidence."},
    {term:"Overconfidence",def:"The tendency to overestimate the accuracy of one's knowledge and judgments. A pervasive bias in everyday decision-making."},
    {term:"Framing",def:"The way information is presented influences how it is perceived and the decisions that result. The same information framed differently leads to different choices."},
    {term:"Gambler's Fallacy",def:"The false belief that previous random events affect the probability of future random events. Example: believing a coin is 'due' to land heads after several tails."},
    {term:"Sunk-Cost Fallacy",def:"Continuing a course of action because of resources already invested, even when stopping would be the more rational choice."},
    {term:"Intuition",def:"An automatic, fast judgment or feeling that bypasses deliberate conscious reasoning. Can be accurate when based on expertise but is prone to bias."},
    {term:"Nudge",def:"A subtle change in how choices are presented that steers behaviour toward a desired option without restricting freedom of choice."},
    {term:"Divergent Thinking",def:"Generating multiple creative and original ideas when approaching a problem. Associated with creativity and open-ended thinking."},
    {term:"Convergent Thinking",def:"Narrowing multiple possibilities down to identify the single best or correct solution. Associated with logic and analytical problem-solving."},
    {term:"Creativity",def:"The ability to produce ideas or solutions that are both novel and useful. Involves divergent thinking, flexible thinking, and the ability to combine ideas in new ways."},
    {term:"Executive Functions",def:"Higher-order cognitive processes managed by the prefrontal cortex: planning, decision-making, impulse control, attention management, and working memory use."}
  ],
  "2.3": [
    {term:"Memory",def:"The process of encoding, storing, and retrieving information. Memory is not a recording but an active, reconstructive process prone to distortion."},
    {term:"Encoding",def:"The first stage of memory: converting incoming information into a form that can be stored. Encoding quality depends on depth and method of processing."},
    {term:"Storage",def:"The retention of encoded information over time. Different memory systems store different types of information for different durations."},
    {term:"Retrieval",def:"The process of accessing and bringing stored information back into conscious awareness. Retrieval is reconstructive, not merely playback."},
    {term:"Multi-Store Model",def:"Atkinson and Shiffrin's model proposing memory flows through three sequential stores: sensory memory, short-term memory, and long-term memory."},
    {term:"Sensory Memory",def:"A brief, automatic storage of sensory information before conscious processing. Lasts less than a second for visual input and a few seconds for auditory input."},
    {term:"Iconic Memory",def:"Visual sensory memory. Stores a rapid snapshot of visual information for about half a second. Named by George Sperling."},
    {term:"Echoic Memory",def:"Auditory sensory memory. Stores a brief echo of sounds for approximately 1 to 4 seconds."},
    {term:"Short-Term Memory",def:"A temporary memory store with limited capacity (roughly 7 plus or minus 2 items, per George Miller) and short duration (about 20 seconds without rehearsal)."},
    {term:"Working Memory",def:"An active memory system that holds and manipulates information for use in current cognitive tasks. Includes the central executive, phonological loop, and visuospatial sketchpad."},
    {term:"Central Executive",def:"The control centre of working memory. Manages attention, coordinates the other components, and links working memory to long-term memory."},
    {term:"Phonological Loop",def:"The component of working memory that handles verbal and auditory information. Replays sounds and words in a mental loop."},
    {term:"Visuospatial Sketchpad",def:"The component of working memory that processes and temporarily holds visual and spatial information, such as mental maps and images."},
    {term:"Long-Term Memory",def:"A relatively permanent memory store with apparently unlimited capacity. Divided into explicit (declarative) and implicit (non-declarative) memory."},
    {term:"Explicit Memory",def:"Memory that requires conscious effort to recall. Includes semantic memory (facts) and episodic memory (personal experiences). Also called declarative memory."},
    {term:"Episodic Memory",def:"A type of explicit memory for specific personal experiences tied to a particular time and place in one's own life."},
    {term:"Semantic Memory",def:"A type of explicit memory for general facts and conceptual knowledge that is not tied to personal experience or context."},
    {term:"Implicit Memory",def:"Memory that influences behaviour without conscious awareness or deliberate effort. Includes procedural memory and priming effects."},
    {term:"Procedural Memory",def:"A type of implicit memory for learned skills, habits, and sequences of actions. Once learned, these operate automatically without conscious attention."},
    {term:"Long-Term Potentiation",def:"The strengthening of synaptic connections following repeated stimulation. Considered the cellular mechanism underlying learning and long-term memory formation."},
    {term:"Hippocampus",def:"A brain structure in the limbic system critical for forming new explicit long-term memories. Damage prevents new explicit memories from forming but does not erase existing ones."},
    {term:"Parallel Processing",def:"Processing multiple aspects of a problem or sensory input simultaneously rather than sequentially. Much of memory encoding and retrieval occurs through parallel processing."},
    {term:"Automatic Processing",def:"Encoding that occurs without conscious effort or attention. Examples: encoding the location of events, the sequence of a day, or familiar background information."},
    {term:"Effortful Processing",def:"Encoding that requires deliberate, conscious attention and rehearsal. Used when learning new material that is not yet automatic."}
  ],
  "2.4": [
    {term:"Levels of Processing Model",def:"Craik and Lockhart's model proposing that memory retention depends on the depth at which information is processed. Deeper processing produces stronger, more durable memories."},
    {term:"Shallow Processing",def:"Encoding based on surface features of a stimulus: its appearance (structural encoding) or its sound (phonemic encoding). Produces weaker, shorter-lasting memories."},
    {term:"Deep Processing",def:"Encoding based on the meaning of information (semantic encoding). Produces stronger, more durable memories than shallow processing."},
    {term:"Elaborative Encoding",def:"Connecting new information to existing knowledge, personal experience, or vivid imagery during encoding. A form of deep processing that significantly improves retention."},
    {term:"Mnemonic Devices",def:"Memory aids that use associations, patterns, or imagery to link new information to existing knowledge. Examples include acronyms, rhymes, and the method of loci."},
    {term:"Method of Loci",def:"A mnemonic strategy that associates items to be remembered with specific, familiar locations along an imagined route. Also called the memory palace technique."},
    {term:"Chunking",def:"Grouping individual items of information into larger, meaningful units to expand effective working memory capacity. Example: remembering a phone number as groups of digits."},
    {term:"Spacing Effect",def:"The finding that distributed practice over multiple sessions produces better long-term retention than an equal amount of massed practice in a single session."},
    {term:"Distributed Practice",def:"Spreading study sessions over time to exploit the spacing effect. More effective than cramming for long-term retention."},
    {term:"Massed Practice",def:"Concentrating all studying into one session (cramming). Produces rapid short-term retention but poor long-term recall."},
    {term:"Testing Effect",def:"The finding that actively retrieving information during practice (self-testing) produces better long-term retention than simply re-reading or reviewing. Also called retrieval practice."},
    {term:"Interleaving",def:"Mixing different types of problems or topics within a study session, rather than blocking by type. Increases difficulty during practice but produces better long-term retention and transfer."},
    {term:"Serial Position Effect",def:"The tendency to recall items at the beginning and end of a list better than items in the middle. Results from the primacy effect and recency effect combined."},
    {term:"Primacy Effect",def:"Better recall for items at the beginning of a list, because they received more rehearsal and have been transferred to long-term memory."},
    {term:"Recency Effect",def:"Better recall for items at the end of a list, because they are still active in working memory at the time of recall."}
  ],
  "2.5": [
    {term:"Maintenance Rehearsal",def:"Repeating information over and over to keep it active in short-term memory without processing its meaning. Does not reliably produce long-term retention."},
    {term:"Elaborative Rehearsal",def:"Linking new information to existing knowledge or personal experience during rehearsal. More effective than maintenance rehearsal for building long-term memories."},
    {term:"Flashbulb Memory",def:"A vivid, detailed, and long-lasting memory for the context surrounding a surprising, emotionally significant event. Feels accurate but can still contain errors."},
    {term:"Memory Consolidation",def:"The process by which a newly formed memory trace is stabilised and transferred from short-term to long-term storage. Occurs largely during sleep."},
    {term:"Reconsolidation",def:"The process by which a retrieved memory becomes temporarily labile and must be re-stabilised. Each retrieval is an opportunity for the memory to be updated or distorted."},
    {term:"Retrograde Amnesia",def:"Loss of memory for events that occurred before a brain injury or trauma. Older memories are typically more resistant to loss than recent ones."},
    {term:"Anterograde Amnesia",def:"Inability to form new explicit long-term memories following brain injury. Old memories remain intact, but new information cannot be consolidated into long-term storage."},
    {term:"Infantile Amnesia",def:"The inability of adults to recall events from the first two to three years of life, due to incomplete hippocampal development and the absence of a verbal framework for memory encoding."},
    {term:"Autobiographical Memory",def:"Memory for the personal events and experiences of one's own life. Combines episodic memory (specific events) and semantic memory (personal facts)."},
    {term:"Basal Ganglia",def:"Brain structures involved in the storage of procedural (habit-based) implicit memories. Patients with basal ganglia damage lose procedural learning while retaining explicit memory."}
  ],
  "2.6": [
    {term:"Recall",def:"Retrieving information from memory without external cues. The most demanding form of retrieval. Example: writing essay answers or free-recall tasks."},
    {term:"Recognition",def:"Identifying a previously encountered item from among alternatives. Less demanding than recall because retrieval cues are present. Example: multiple-choice tests."},
    {term:"Relearning",def:"A sensitive measure of memory: learning previously studied material again takes less time than learning it for the first time. Demonstrates savings even when recall fails entirely."},
    {term:"Retrieval Cues",def:"Any stimulus (internal or external) associated with a memory at encoding that helps activate and retrieve that memory later."},
    {term:"Encoding Specificity Principle",def:"Memory retrieval is most effective when the context and cues at retrieval match those present during encoding."},
    {term:"Context-Dependent Memory",def:"The finding that memory retrieval is enhanced when the physical environment at recall matches the environment at encoding."},
    {term:"State-Dependent Memory",def:"The finding that memory retrieval is enhanced when the individual's internal physiological or psychological state at recall matches the state during encoding."},
    {term:"Mood-Congruent Memory",def:"The tendency to recall memories that match one's current emotional state. Positive moods facilitate recall of positive memories; negative moods facilitate recall of negative ones."},
    {term:"Priming",def:"Exposure to a stimulus activates related information in memory, making it more accessible for subsequent processing. Priming operates without conscious awareness."},
    {term:"Deja Vu",def:"The eerie feeling of having already experienced a current situation. Thought to result from a momentary mismatch between new perceptual input and familiar memory traces."},
    {term:"Metacognition",def:"Awareness and monitoring of one's own cognitive processes, including how well one understands and remembers material. Accurate metacognition supports effective study habits."}
  ],
  "2.7": [
    {term:"Forgetting Curve",def:"Ebbinghaus's finding that forgetting is most rapid immediately after learning, then levels off. Most forgetting occurs within the first few hours; what survives tends to be stable."},
    {term:"Encoding Failure",def:"Information is never stored in long-term memory because it was not attended to or processed sufficiently during encoding. The most common cause of everyday forgetting."},
    {term:"Storage Decay",def:"Gradual weakening of a memory trace over time when it is not retrieved or rehearsed. Also called trace decay."},
    {term:"Proactive Interference",def:"Previously learned information interferes with the encoding or retrieval of new information. Old memories compete with new ones."},
    {term:"Retroactive Interference",def:"Newly learned information interferes with the retrieval of previously learned information. New memories compete with old ones."},
    {term:"Tip-of-the-Tongue Phenomenon",def:"The feeling of being on the verge of recalling a word or name that cannot quite be retrieved. Demonstrates that storage and retrieval are distinct processes."},
    {term:"Repression",def:"In psychodynamic theory, the unconscious blocking of anxiety-provoking memories from conscious awareness. Highly debated in contemporary memory research."},
    {term:"Misinformation Effect",def:"The tendency to incorporate misleading post-event information into one's memory of the original event, distorting the original memory. Documented extensively by Elizabeth Loftus."},
    {term:"Source Amnesia",def:"The inability to recall where, when, or how a piece of information was originally acquired, even when the information itself is remembered."},
    {term:"Constructive Memory",def:"The tendency to reconstruct memories at retrieval using current knowledge, expectations, and beliefs, rather than simply playing back a stored record. Memories can be altered each time they are retrieved."},
    {term:"Imagination Inflation",def:"Repeatedly imagining an event that never occurred can increase a person's confidence that the event actually happened, potentially producing a false memory."},
    {term:"Reconsolidation",def:"Each time a memory is retrieved, it becomes temporarily unstable and must be re-stored. This process creates a window during which the memory can be distorted or updated by new information."}
  ],
  "2.8": [
    {term:"Intelligence",def:"The ability to learn from experience, solve problems, and adapt effectively to new situations. A contested construct with no single agreed definition."},
    {term:"General Intelligence (g)",def:"Charles Spearman's proposal that a single underlying factor (g) accounts for positive correlations across diverse cognitive ability tests. Measured using factor analysis."},
    {term:"Factor Analysis",def:"A statistical technique that identifies clusters of correlated variables. Used by Spearman to argue for general intelligence (g) and by Thurstone to argue for multiple specific abilities."},
    {term:"Fluid Intelligence (Gf)",def:"The ability to reason, solve novel problems, and think flexibly without relying on accumulated knowledge. Tends to peak in early adulthood and decline with age."},
    {term:"Crystallised Intelligence (Gc)",def:"Accumulated knowledge and verbal skills gained through experience and education. Tends to remain stable or increase across the lifespan."},
    {term:"Cattell-Horn-Carroll (CHC) Theory",def:"A comprehensive psychometric model of intelligence integrating fluid intelligence, crystallised intelligence, and multiple specific cognitive abilities into a hierarchical structure."},
    {term:"Howard Gardner",def:"Proposed the theory of multiple intelligences, arguing that humans possess at least eight distinct intelligences rather than a single general ability."},
    {term:"Multiple Intelligences",def:"Gardner's theory that intelligence is not a single factor but a set of relatively independent abilities: linguistic, logical-mathematical, spatial, musical, bodily-kinesthetic, interpersonal, intrapersonal, and naturalist."},
    {term:"Savant Syndrome",def:"A rare condition in which a person with overall limited cognitive ability demonstrates extraordinary skill in one specific domain (such as mental calculation, drawing, or music)."},
    {term:"Robert Sternberg",def:"Proposed the triarchic theory of intelligence, identifying three distinct types: analytical, creative, and practical intelligence."},
    {term:"Triarchic Theory",def:"Sternberg's model proposing three types of intelligence: analytical (academic problem-solving), creative (generating novel ideas), and practical (navigating real-world situations)."},
    {term:"Analytical Intelligence",def:"The type of intelligence assessed by traditional academic tests. Involves logical reasoning, problem decomposition, and identifying correct solutions."},
    {term:"Creative Intelligence",def:"The ability to adapt to novel situations and generate original ideas. Goes beyond what conventional IQ tests measure."},
    {term:"Practical Intelligence",def:"The ability to manage everyday tasks that may be ill-defined and have multiple acceptable solutions. Sometimes called 'street smarts.'"},
    {term:"Emotional Intelligence",def:"The ability to perceive, understand, manage, and use emotions effectively in oneself and in relationships with others."},
    {term:"Grit",def:"Angela Duckworth's concept describing perseverance and sustained passion toward long-term goals. A predictor of achievement beyond IQ alone."},
    {term:"Intelligence Quotient (IQ)",def:"Originally calculated as mental age divided by chronological age, multiplied by 100. Modern IQ scores are standardised relative to a normative population, with a mean of 100."},
    {term:"Mental Age",def:"A measure of cognitive performance expressed as the age level at which a person is performing. Used in the original IQ formula developed by Alfred Binet."},
    {term:"Stanford-Binet",def:"The American adaptation of Binet's intelligence test, developed by Lewis Terman at Stanford. One of the most widely used individual intelligence tests."},
    {term:"Wechsler Adult Intelligence Scale (WAIS)",def:"An individually administered intelligence test developed by David Wechsler. Measures a range of verbal and performance abilities and is widely used with adults."},
    {term:"Psychometrics",def:"The science of psychological measurement, including the design, administration, and interpretation of tests of intelligence, personality, and aptitude."},
    {term:"Standardisation",def:"The process of establishing uniform testing procedures and a normative reference group so that individual scores can be meaningfully compared to the population."},
    {term:"Reliability",def:"The consistency of a test: whether it produces the same results across repeated administrations (test-retest reliability) or across different halves of the same test (split-half reliability)."},
    {term:"Validity",def:"The extent to which a test measures what it claims to measure. Includes content validity, construct validity, and predictive validity."},
    {term:"Achievement Test",def:"An assessment measuring knowledge and skills that have already been learned or acquired."},
    {term:"Aptitude Test",def:"An assessment designed to predict a person's future potential or performance in a specific domain."},
    {term:"Flynn Effect",def:"The documented rise in average IQ scores across generations observed across many countries. Attributed to improved nutrition, education, and increased familiarity with abstract reasoning."},
    {term:"Stereotype Threat",def:"The anxiety-producing concern about confirming a negative stereotype associated with one's group, which can disrupt performance on evaluative tasks."},
    {term:"Fixed Mindset",def:"Carol Dweck's term for the belief that intelligence and abilities are innate and fixed. Associated with avoidance of challenges and fear of failure."},
    {term:"Growth Mindset",def:"Carol Dweck's term for the belief that intelligence and abilities can be developed through effort, effective strategies, and persistence. Associated with greater resilience and achievement."}
  ]
};

    {q:"People often report extremely detailed, confident memories for where they were and what they were doing when they first heard news of a major unexpected event that had great personal significance. These memories are called:",opts:["Semantic memories - general facts about significant public events are stored in semantic long-term memory","Procedural memories - the emotional arousal during significant events converts them into automatic memory traces","Flashbulb memories - vivid, detailed memories for the personal context surrounding emotionally significant events","Constructive memories - the details are reconstructed from cultural knowledge rather than direct encoding"],answer:2,skill:"Skill 1"},

  "2.6": [
    {q:"A student recalls a specific fact much more easily when she studies in the same classroom where the exam will be held than when she studies in her bedroom. This best illustrates:",opts:["State-dependent memory - the student's internal emotional state during study matches her state during the exam","Mood-congruent memory - the student's positive mood in the familiar classroom aids recall of positive academic material","Context-dependent memory - the physical environment at retrieval matches the environment at encoding, enhancing recall","The encoding specificity principle applied to internal rather than external cues"],answer:2,skill:"Skill 2"},

    {q:"Eyewitness research by Elizabeth Loftus showed that participants who witnessed a simulated accident and were later asked 'How fast were the cars going when they smashed into each other?' estimated higher speeds than participants asked about cars that 'contacted' each other. Many participants also later falsely remembered seeing broken glass that was not present. This best illustrates:",opts:["Source amnesia - participants could not recall whether they saw the glass or merely heard about it","Encoding failure - the word 'smashed' caused participants not to encode the absence of broken glass during the original event","The misinformation effect - post-event language influenced the reconstruction of the original memory, incorporating details that were not present","Imagination inflation - participants repeatedly imagined the crash and thereby generated a false memory of glass"],answer:2,skill:"Skill 2"},

};

// ==============================================================
// HELPERS
// ==============================================================
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function getTerms(t){return t==="all"?Object.values(termsDB).flat():(termsDB[t]||[]);}
function getPractice(t){return t==="all"?Object.values(practiceDB).flat():(practiceDB[t]||[]);}
function skillClass(s){return s.includes("4")?"skill-4":s.includes("3")?"skill-3":s.includes("2")?"skill-2":"skill-1";}
function pBar(idx,total,score){return `<div class="progress-row"><span>Question ${idx+1} of ${total}</span><span>Score: ${score} / ${idx}</span></div><div class="progress-bar-track"><div class="progress-bar-fill" style="width:${total>0?(idx/total)*100:0}%"></div></div>`;}

// Logs one attempt for the session review panel and the printable answer key.
function logAttempt(type,stem,studentAnswer,correctAnswer,correct){
  S.log.push({type:type,stem:stem,studentAnswer:studentAnswer,correctAnswer:correctAnswer,correct:correct});
}
// Builds the on-screen "Terms to review" panel plus the Print Summary button, shown on every completion screen.
function buildReviewBlock(){
  const missed=S.log.filter(function(r){return !r.correct;});
  let html="";
  if(missed.length){
    html+='<div class="review-block"><div class="review-header">Terms to Review ('+missed.length+')</div>';
    html+=missed.map(function(r){return '<div class="review-item"><strong>'+r.stem+'</strong><span class="review-correct">Correct answer: '+r.correctAnswer+'</span></div>';}).join("");
    html+='</div>';
  }
  html+='<button class="btn-restart btn-print" onclick="printSummary()">Print Summary</button>';
  return html;
}
// Builds and opens the printable, teacher-checkable answer key in its own tab, so printing
// does not depend on window.print() working inside whatever frame this page is embedded in.
function printSummary(){
  const total=S.log.length;
  const correctCount=S.log.filter(function(r){return r.correct;}).length;
  const scoreText=total?(correctCount+" / "+total+" ("+Math.round((correctCount/total)*100)+"%)"):"No graded items this session";
  let rows=S.log.map(function(r,i){
    return '<tr><td style="border:1px solid #999;padding:6px;">'+(i+1)+'</td>'+
      '<td style="border:1px solid #999;padding:6px;">'+String(r.stem).replace(/\n/g," ")+'</td>'+
      '<td style="border:1px solid #999;padding:6px;">'+r.studentAnswer+'</td>'+
      '<td style="border:1px solid #999;padding:6px;">'+r.correctAnswer+'</td>'+
      '<td style="border:1px solid #999;padding:6px;">'+(r.correct?"Correct":"Review")+'</td></tr>';
  }).join("");
  if(!rows){rows='<tr><td colspan="5" style="border:1px solid #999;padding:6px;">No graded items in this session.</td></tr>';}
  let mistakesHTML="";
  if(S.topic!=="all"&&mistakesDB[S.topic]){
    mistakesHTML='<h2 style="font-size:15px;margin-top:18px;border-bottom:1px solid #999;">Common Mistakes for This Topic</h2><ul style="font-size:12px;line-height:1.6;">'+
      mistakesDB[S.topic].map(function(m){return '<li style="margin-bottom:6px;">'+m+'</li>';}).join("")+'</ul>';
  }
  const reportBody=
    '<h1 style="font-size:20px;border-bottom:2px solid #000;padding-bottom:8px;">AP Psychology Unit 2: Cognition</h1>'+
    '<p style="font-size:13px;">Revision Session Summary</p>'+
    '<table style="width:100%;font-size:13px;margin:14px 0;"><tr><td>Name: ___________________________</td><td>Date: ___________________</td></tr></table>'+
    '<p style="font-size:13px;">Topic: '+(S.topicLabel||"All Topics")+' &nbsp;|&nbsp; Activity: '+(S.modeLabel||"")+' &nbsp;|&nbsp; Score: '+scoreText+'</p>'+
    '<h2 style="font-size:15px;margin-top:18px;border-bottom:1px solid #999;">Answer Key and Review</h2>'+
    '<table style="width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;">'+
    '<tr style="background:#eee;"><th style="border:1px solid #999;padding:6px;text-align:left;">#</th><th style="border:1px solid #999;padding:6px;text-align:left;">Question / Term</th><th style="border:1px solid #999;padding:6px;text-align:left;">Your Answer</th><th style="border:1px solid #999;padding:6px;text-align:left;">Correct Answer</th><th style="border:1px solid #999;padding:6px;text-align:left;">Result</th></tr>'+
    rows+'</table>'+mistakesHTML+
    '<p class="no-print" style="margin-top:22px;font-size:12px;color:#666;">If the print dialog did not open automatically, use your browser\'s print command (Ctrl+P or Cmd+P) on this tab.</p>';
  const fullDoc='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Unit 2 Revision Summary</title>'+
    '<style>body{font-family:Arial,Helvetica,sans-serif;color:#000;padding:20px;max-width:800px;margin:0 auto;}'+
    '@media print{.no-print{display:none;}}</style></head><body>'+reportBody+'</body></html>';
  const win=window.open("","_blank");
  if(!win){
    alert("Your browser blocked the new tab needed to print. Please allow pop-ups for this page and click Print Summary again.");
    return;
  }
  win.document.open();
  win.document.write(fullDoc);
  win.document.close();
  win.focus();
  setTimeout(function(){
    try{win.print();}catch(e){/* user can still print manually from the new tab */}
  },250);
}

// ==============================================================
// STATE
// ==============================================================
const S={mode:null,topic:"all",topicLabel:"All Topics",modeLabel:"",terms:[],practice:[],idx:0,score:0,hWord:"",hGuessed:[],hMistakes:0,hAttempted:new Set(),hActive:false,hCurrentTerm:null,_matchSet:[],log:[]};

// ==============================================================
// START
// ==============================================================
document.getElementById("startBtn").addEventListener("click",function(){
  S.topic=document.getElementById("topicSelect").value;
  S.mode=document.getElementById("modeSelect").value;
  const topicSel=document.getElementById("topicSelect");
  const modeSel=document.getElementById("modeSelect");
  S.topicLabel=topicSel.options[topicSel.selectedIndex].text;
  S.modeLabel=modeSel.options[modeSel.selectedIndex].text;
  S.idx=0;S.score=0;S.hActive=false;S.hAttempted=new Set();S.log=[];
  if(S.mode==="mistakes"){renderMistakes();return;}
  if(S.mode==="practice"){
    S.practice=shuffle(getPractice(S.topic));
    if(!S.practice.length){setQA('<div class="placeholder-text">No practice questions for this topic yet.</div>');return;}
    renderPractice();
  } else {
    S.terms=shuffle(getTerms(S.topic));
    if(!S.terms.length){setQA('<div class="placeholder-text">No terms found for this selection.</div>');return;}
    if(S.mode==="flash")renderFlash();
    else if(S.mode==="mcq")renderMCQ();
    else if(S.mode==="tf")renderTF();
    else if(S.mode==="match")renderMatch();
    else if(S.mode==="hangman"){S.hActive=true;renderHangman();}
  }
});
function setQA(html){document.getElementById("quizArea").innerHTML=html;}

// ==============================================================
// COMMON MISTAKES
// ==============================================================
function renderMistakes(){
  let html='<p style="text-align:center;color:#4a6080;font-size:13px;margin-bottom:18px;">Common mix-ups students make on this material. Review these before you test yourself.</p>';
  const topicsToShow=(S.topic==="all")?Object.keys(mistakesDB):[S.topic];
  topicsToShow.forEach(function(tKey){
    if(!mistakesDB[tKey])return;
    if(S.topic==="all"){html+='<div class="mistake-topic-header">Topic '+tKey+'</div>';}
    mistakesDB[tKey].forEach(function(m){html+='<div class="mistake-item">'+m+'</div>';});
  });
  setQA(html);
}

// ==============================================================
// FLASHCARDS
// ==============================================================
function renderFlash(){
  if(S.idx>=S.terms.length){setQA(`<div class="score-screen"><div class="big-score">${S.terms.length}</div><div class="score-label">cards reviewed</div><div class="score-message">All done!</div>${buildReviewBlock()}<br><button class="btn-restart" onclick="S.idx=0;S.log=[];renderFlash()">Start Over</button></div>`);return;}
  const t=S.terms[S.idx];const pct=(S.idx/S.terms.length)*100;
  setQA(`<div class="progress-row"><span>Card ${S.idx+1} of ${S.terms.length}</span><span style="font-size:12px;color:#7a90b5;">Click to flip</span></div><div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div><div class="flashcard-wrapper" onclick="this.classList.toggle('flipped')"><div class="flashcard-inner"><div class="flashcard-face flashcard-front"><div class="face-label">Term</div><div class="face-term">${t.term}</div></div><div class="flashcard-face flashcard-back"><div class="face-label">Definition</div><div class="face-def">${t.def}</div></div></div></div><div class="flashcard-hint">Tap the card to reveal the definition, then rate yourself honestly</div><div class="flashcard-nav"><button class="self-rate-review" onclick="rateFlash(false)">Review again</button><button class="self-rate-good" onclick="rateFlash(true)">Got it</button></div><div class="flashcard-nav" style="margin-top:8px;"><button onclick="S.idx=Math.max(0,S.idx-1);renderFlash()">Previous</button></div>`);
}
function rateFlash(gotIt){
  const t=S.terms[S.idx];
  logAttempt("Flashcards",t.term,gotIt?"Marked: Got it":"Marked: Review again",t.def,gotIt);
  S.idx++;
  renderFlash();
}

// ==============================================================
// VOCABULARY MCQ
// ==============================================================
function renderMCQ(){
  if(S.idx>=S.terms.length){showVocabScore();return;}
  const cur=S.terms[S.idx];
  const opts=shuffle([cur,...shuffle(S.terms.filter(function(t){return t!==cur;})).slice(0,3)]);
  const letters=["A","B","C","D"];S._mcqOpts=opts;S._mcqCorrect=cur;S._mcqDef=cur.def;
  let optsHTML=opts.map(function(o,i){return `<button class="option-btn" data-idx="${i}"><span class="letter">${letters[i]}</span><span>${o.term}</span></button>`;}).join("");
  setQA(`${pBar(S.idx,S.terms.length,S.score)}<div class="question-text"><span class="stem-label">Definition</span>${cur.def}</div><p style="font-size:12px;color:#4a6080;margin-bottom:10px;font-weight:600;">Which term matches this definition?</p><div class="options-list" id="mcqOpts">${optsHTML}</div><div id="mcqFb"></div>`);
  document.querySelectorAll("#mcqOpts .option-btn").forEach(function(btn){btn.addEventListener("click",function(){handleMCQ(parseInt(this.dataset.idx));});});
}
function handleMCQ(si){
  if(document.querySelector(".option-btn.correct,.option-btn.incorrect"))return;
  const opts=S._mcqOpts;const correct=S._mcqCorrect;const ci=opts.indexOf(correct);
  document.querySelectorAll(".option-btn").forEach(function(b){b.disabled=true;if(parseInt(b.dataset.idx)===ci)b.classList.add("revealed");});
  const isRight=(si===ci);const btn=document.querySelector('[data-idx="'+si+'"]');
  if(btn){btn.classList.remove("revealed");btn.classList.add(isRight?"correct":"incorrect");}
  if(isRight)S.score++;
  logAttempt("Vocabulary MCQ",S._mcqDef,opts[si].term,correct.term,isRight);
  S.idx++;
  document.getElementById("mcqFb").innerHTML=`<div class="feedback-box ${isRight?"correct":"incorrect"}">${isRight?"Correct!":"Not quite. The correct answer is highlighted above."}</div><button class="btn-next" onclick="renderMCQ()">Next</button>`;
}

// ==============================================================
// TRUE / FALSE
// ==============================================================
function renderTF(){
  if(S.idx>=S.terms.length){showVocabScore();return;}
  const cur=S.terms[S.idx];const isTrue=Math.random()>0.5;let disp=cur.def;
  if(!isTrue&&S.terms.length>1){let w=S.terms[Math.floor(Math.random()*S.terms.length)];while(w.term===cur.term)w=S.terms[Math.floor(Math.random()*S.terms.length)];disp=w.def;}
  S._tfIsTrue=isTrue;S._tfTerm=cur.term;S._tfDisp=disp;
  setQA(`${pBar(S.idx,S.terms.length,S.score)}<div class="question-text">Is this the correct definition of <strong>${cur.term}</strong>?</div><div style="background:#f4f6fb;padding:13px 15px;border-radius:8px;font-style:italic;border-left:4px solid #b0c4de;margin-bottom:18px;font-size:14px;line-height:1.65;">"${disp}"</div><div class="options-list" style="flex-direction:row;gap:14px;"><button class="option-btn" id="tfT" style="justify-content:center;"><span class="letter" style="color:#28a745;">T</span>True</button><button class="option-btn" id="tfF" style="justify-content:center;"><span class="letter" style="color:#dc3545;">F</span>False</button></div><div id="tfFb"></div>`);
  document.getElementById("tfT").addEventListener("click",function(){handleTF(true);});
  document.getElementById("tfF").addEventListener("click",function(){handleTF(false);});
}
function handleTF(userTrue){
  if(document.querySelector(".option-btn.correct,.option-btn.incorrect"))return;
  document.querySelectorAll(".option-btn").forEach(function(b){b.disabled=true;});
  const right=(S._tfIsTrue===userTrue);const btn=userTrue?document.getElementById("tfT"):document.getElementById("tfF");
  if(btn)btn.classList.add(right?"correct":"incorrect");
  if(right)S.score++;
  logAttempt("True/False",'"'+S._tfDisp+'" - definition of '+S._tfTerm+'?',userTrue?"True":"False",S._tfIsTrue?"True":"False",right);
  S.idx++;
  document.getElementById("tfFb").innerHTML=`<div class="feedback-box ${right?"correct":"incorrect"}">${right?"Correct!":"Not quite. The answer was: "+(S._tfIsTrue?"True":"False")}</div><button class="btn-next" onclick="renderTF()">Next</button>`;
}

// ==============================================================
// MATCH'EM UP
// ==============================================================
function renderMatch(){
  const chunk=S.terms.slice(0,Math.min(6,S.terms.length));S._matchSet=chunk;
  const shuffledDefs=shuffle(chunk.map(function(t,i){return {termIdx:i,def:t.def};}));
  const termsHTML=chunk.map(function(t,i){return `<div class="match-term" draggable="true" data-tidx="${i}">${t.term}</div>`;}).join("");
  const defsHTML=shuffledDefs.map(function(d){return `<div class="match-def" data-correct="${d.termIdx}" data-dropped="-1"><div class="match-def-text" style="font-size:12px;line-height:1.5;">${d.def}</div></div>`;}).join("");
  setQA(`<p style="text-align:center;color:#4a6080;font-size:13px;margin-bottom:18px;">Drag each <strong>term</strong> from the left onto its matching <strong>definition</strong> on the right.</p><div class="match-grid"><div><div class="match-col-label">Terms</div><div class="match-terms" id="matchTerms">${termsHTML}</div></div><div><div class="match-col-label">Definitions</div><div class="match-defs" id="matchDefs">${defsHTML}</div></div></div><button class="match-check-btn" onclick="checkMatch()">Check Answers</button><div id="matchFb" style="margin-top:14px;"></div>`);
  document.querySelectorAll(".match-term").forEach(function(el){
    el.addEventListener("dragstart",function(e){e.dataTransfer.setData("text",this.dataset.tidx);this.classList.add("dragging");});
    el.addEventListener("dragend",function(){this.classList.remove("dragging");});
  });
  document.querySelectorAll(".match-def").forEach(function(el){
    el.addEventListener("dragover",function(e){e.preventDefault();this.classList.add("drag-over");});
    el.addEventListener("dragleave",function(){this.classList.remove("drag-over");});
    el.addEventListener("drop",function(e){
      e.preventDefault();this.classList.remove("drag-over");const tidx=e.dataTransfer.getData("text");this.dataset.dropped=tidx;
      let lbl=this.querySelector(".match-dropped");
      if(!lbl){lbl=document.createElement("div");lbl.className="match-dropped";this.insertBefore(lbl,this.firstChild);}
      lbl.textContent=S._matchSet[parseInt(tidx)].term;
    });
  });
}
function checkMatch(){
  let correct=0;const defEls=document.querySelectorAll(".match-def");
  defEls.forEach(function(el){
    const dropped=parseInt(el.dataset.dropped);const right=parseInt(el.dataset.correct);const isRight=(dropped===right);
    if(isRight){el.classList.add("correct");correct++;}else{el.classList.add("incorrect");}
    const defText=el.querySelector(".match-def-text").textContent;
    const droppedTermText=(dropped>=0&&S._matchSet[dropped])?S._matchSet[dropped].term:"No answer given";
    const correctTermText=S._matchSet[right].term;
    logAttempt("Match'em Up",defText,droppedTermText,correctTermText,isRight);
  });
  const total=defEls.length;const pct=Math.round((correct/total)*100);
  document.getElementById("matchFb").innerHTML=`<div class="feedback-box ${correct===total?"correct":correct>total/2?"neutral":"incorrect"}">${correct} / ${total} correct (${pct}%)</div>${buildReviewBlock()}<button class="btn-next" onclick="renderMatch()">Try Another Set</button>`;
}

// ==============================================================
// HANGMAN
// ==============================================================
function renderHangman(){
  if(S.idx>=S.terms.length){showVocabScore();return;}
  const t=S.terms[S.idx];S.hCurrentTerm=t;S.hWord=t.term.toUpperCase();
  S.hGuessed=S.hWord.split("").map(function(ch){return /[A-Z]/.test(ch)?null:ch;});
  S.hMistakes=0;S.hAttempted=new Set();
  const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  const keyHTML=letters.map(function(l){return `<button class="key" data-ltr="${l}">${l}</button>`;}).join("");
  const pct=(S.idx/S.terms.length)*100;
  setQA(`<div class="progress-row"><span>Word ${S.idx+1} of ${S.terms.length}</span><span>Score: ${S.score}</span></div><div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div><div class="hangman-container"><div><svg class="hangman-svg" viewBox="0 0 100 120" stroke="#1a2744" stroke-width="3" fill="none" stroke-linecap="round"><line x1="10" y1="115" x2="90" y2="115"/><line x1="30" y1="115" x2="30" y2="5"/><line x1="30" y1="5" x2="70" y2="5"/><line x1="70" y1="5" x2="70" y2="20"/><circle id="hp1" cx="70" cy="32" r="12" style="display:none"/><line id="hp2" x1="70" y1="44" x2="70" y2="80" style="display:none"/><line id="hp3" x1="70" y1="52" x2="54" y2="68" style="display:none"/><line id="hp4" x1="70" y1="52" x2="86" y2="68" style="display:none"/><line id="hp5" x1="70" y1="80" x2="54" y2="100" style="display:none"/><line id="hp6" x1="70" y1="80" x2="86" y2="100" style="display:none"/></svg></div><div class="hangman-hint"><strong>Hint:</strong> ${t.def}</div><div class="word-display" id="hDisp"></div><div class="keyboard" id="hKeys">${keyHTML}</div><div id="hFb" style="margin-top:16px;min-height:44px;text-align:center;"></div></div>`);
  updateHDisp();
  document.querySelectorAll(".key").forEach(function(btn){btn.addEventListener("click",function(){doHGuess(this.dataset.ltr);});});
}
function updateHDisp(){const el=document.getElementById("hDisp");if(el)el.textContent=S.hGuessed.map(function(ch){return ch===null?"_":ch;}).join(" ");}
function updateHParts(){for(let i=1;i<=6;i++){const el=document.getElementById("hp"+i);if(el)el.style.display=i<=S.hMistakes?"block":"none";}}
function doHGuess(letter){
  if(!S.hActive||S.hAttempted.has(letter)||S.hMistakes>=6)return;
  S.hAttempted.add(letter);const btn=document.querySelector('.key[data-ltr="'+letter+'"]');
  if(S.hWord.includes(letter)){S.hWord.split("").forEach(function(ch,i){if(ch===letter)S.hGuessed[i]=letter;});if(btn){btn.classList.add("correct-guess");btn.disabled=true;}}
  else{S.hMistakes++;if(btn){btn.classList.add("wrong-guess");btn.disabled=true;}updateHParts();}
  updateHDisp();checkHEnd();
}
function checkHEnd(){
  const won=!S.hGuessed.includes(null);const lost=S.hMistakes>=6;if(!won&&!lost)return;
  document.querySelectorAll(".key").forEach(function(k){k.disabled=true;});const fb=document.getElementById("hFb");
  const t=S.hCurrentTerm;
  logAttempt("Hangman",t?t.def:"",won?"Solved":"Not solved ("+S.hMistakes+" wrong guesses)",S.hWord,won);
  if(won){S.score++;if(fb)fb.innerHTML=`<div class="feedback-box correct">Correct! The term is "${S.hWord}".</div><button class="btn-next" onclick="S.idx++;renderHangman()">Next Word</button>`;}
  else{const d=document.getElementById("hDisp");if(d)d.textContent=S.hWord.split("").join(" ");if(fb)fb.innerHTML=`<div class="feedback-box incorrect">The term was: <strong>${S.hWord}</strong></div><button class="btn-next" onclick="S.idx++;renderHangman()">Next Word</button>`;}
}
document.addEventListener("keydown",function(e){
  if(!S.hActive)return;const k=e.key.toUpperCase();
  if(/^[A-Z]$/.test(k)){const btn=document.querySelector('.key[data-ltr="'+k+'"]');if(btn&&!btn.disabled)doHGuess(k);}
});

// ==============================================================
// PRACTICE SET MCQs
// ==============================================================
function renderPractice(){
  if(S.idx>=S.practice.length){showPracticeScore();return;}
  const q=S.practice[S.idx];const letters=["A","B","C","D"];
  const optsHTML=q.opts.map(function(opt,i){return `<button class="option-btn" data-idx="${i}"><span class="letter">${letters[i]}</span><span>${opt}</span></button>`;}).join("");
  const pct=(S.idx/S.practice.length)*100;const stemHTML=q.q.replace(/\n/g,"<br>");
  setQA(`<div class="progress-row"><span>Question ${S.idx+1} of ${S.practice.length}</span><span>Score: ${S.score} / ${S.idx}</span></div><div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div><span class="skill-badge ${skillClass(q.skill)}">${q.skill}</span><div class="question-text">${stemHTML}</div><div class="options-list" id="pOpts">${optsHTML}</div><div id="pFb"></div>`);
  S._pq=q;
  document.querySelectorAll("#pOpts .option-btn").forEach(function(btn){btn.addEventListener("click",function(){handlePractice(parseInt(this.dataset.idx));});});
}
function handlePractice(si){
  if(document.querySelector(".option-btn.correct,.option-btn.incorrect"))return;
  const q=S._pq;document.querySelectorAll(".option-btn").forEach(function(b){b.disabled=true;if(parseInt(b.dataset.idx)===q.answer)b.classList.add("revealed");});
  const isRight=(si===q.answer);const btn=document.querySelector('#pOpts [data-idx="'+si+'"]');
  if(btn){btn.classList.remove("revealed");btn.classList.add(isRight?"correct":"incorrect");}
  if(isRight)S.score++;
  logAttempt("Practice Set MCQ",q.q.replace(/\n/g," "),q.opts[si],q.opts[q.answer],isRight);
  S.idx++;
  document.getElementById("pFb").innerHTML=`<div class="feedback-box ${isRight?"correct":"incorrect"}">${isRight?"Correct!":"Not quite. The correct answer is highlighted above."}</div><button class="btn-next" onclick="renderPractice()">Next</button>`;
}
function showPracticeScore(){
  const pct=Math.round((S.score/S.practice.length)*100);
  const msg=pct>=80?"Strong work.":pct>=60?"Getting there. Keep reviewing.":"More revision needed - you have got this.";
  setQA(`<div class="score-screen"><div class="big-score">${pct}%</div><div class="score-label">${S.score} correct out of ${S.practice.length}</div><div class="score-message">${msg}</div>${buildReviewBlock()}<br><button class="btn-restart" onclick="S.idx=0;S.score=0;S.log=[];S.practice=shuffle(getPractice(S.topic));renderPractice()">Try Again</button></div>`);
}
function showVocabScore(){
  const pct=Math.round((S.score/S.terms.length)*100);
  const msg=pct>=80?"Strong work.":pct>=60?"Getting there. Keep reviewing.":"More revision needed - you have got this.";
  const restart=S.mode==="mcq"?"S.idx=0;S.score=0;S.log=[];S.terms=shuffle(getTerms(S.topic));renderMCQ()":S.mode==="tf"?"S.idx=0;S.score=0;S.log=[];S.terms=shuffle(getTerms(S.topic));renderTF()":"S.idx=0;S.score=0;S.log=[];S.hActive=true;S.terms=shuffle(getTerms(S.topic));renderHangman()";
  setQA(`<div class="score-screen"><div class="big-score">${pct}%</div><div class="score-label">${S.score} correct out of ${S.terms.length}</div><div class="score-message">${msg}</div>${buildReviewBlock()}<br><button class="btn-restart" onclick="${restart}">Try Again</button></div>`);
}
</script>
</body>
